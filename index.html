<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ağ Haritası — economic-intelligence-os</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Fragment+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css" />
  <link rel="stylesheet" href="assets/bugun.css" />
</head>
<body>
  <header class="ust">
    <a href="index.html" class="marka-logo" title="yuppiepoff — Ağ Haritası ana sayfa"><span class="m-yesil">yuppi</span><span class="m-turuncu">e</span><span class="m-kirmizi">poff</span></a>
    <div class="arama-kutusu">
      <input id="arama" type="text" placeholder="Şirket, kod veya konu ara… (ör. NVDA, bellek)" autocomplete="off" />
      <div id="arama-sonuc" class="arama-sonuc gizli"></div>
    </div>
    <div id="ozet" class="ozet"></div>
    <div class="makro-kutu">
      <a href="makro.html" class="ust-buton makro-baglanti" title="Makro Kriz Paneli — erken uyarı göstergeleri">🌡️ Makro Kriz Paneli</a>
      <div id="makro-noktalar" class="makro-noktalar"></div>
    </div>
  </header>

  <div id="krtl" class="krtl gizli">
    <button id="geri">◀ Tümüne dön</button>
    <span id="krtl-ad"></span>
  </div>

  <main class="yerlesim">
    <aside class="sol">
      <div class="sekmeler" id="sol-sekmeler">
        <button data-sekme="sekme-agac" class="aktif">Sektör</button>
        <button data-sekme="sekme-temalar">Konu</button>
        <button data-sekme="sekme-raporlar">Rapor</button>
        <button data-sekme="sekme-filtre">Filtre</button>
      </div>
      <section class="blok sekme-icerik" id="sekme-agac">
        <div id="agac"></div>
      </section>
      <section class="blok sekme-icerik gizli" id="sekme-temalar">
        <ul id="temalar" class="tema-liste"></ul>
      </section>
      <section class="blok sekme-icerik gizli" id="sekme-raporlar">
        <ul id="raporlar" class="rapor-liste"></ul>
      </section>
      <section class="blok sekme-icerik gizli" id="sekme-filtre">
        <div class="cipler" id="yon-filtre">
          <label class="cip poz"><input type="checkbox" data-yon="pozitif" checked />Pozitif</label>
          <label class="cip neg"><input type="checkbox" data-yon="negatif" checked />Negatif</label>
          <label class="cip ntr"><input type="checkbox" data-yon="notr" checked />Nötr</label>
          <label class="cip gri"><input type="checkbox" data-yon="yok" checked />Sinyalsiz</label>
        </div>
      </section>
      <section class="blok" id="blok-bugun">
        <h2 id="bugun-baslik">Bugünün izi</h2>
        <p id="bugun-sayac" class="bugun-sayac"></p>
        <p id="bugun-ozet" class="bugun-ozet gizli"></p>
        <ul id="bugun-iz" class="bugun-iz"></ul>
      </section>
    </aside>

    <section class="orta">
      <div id="cy"></div>
      <div id="isi" class="gizli"></div>
      <div class="arac-cubugu sekmeler">
        <button id="gv-ag" class="aktif">Ağ</button>
        <button id="gv-isi" title="Isı haritası">Isı</button>
        <button id="btn-bugun" class="harita-arac aktif" title="Son dolu dilimin düğümlerini öne çıkar">Bugün</button>
        <button id="btn-sigdir" class="harita-arac" title="Tüm haritayı ekrana sığdır">Sığdır</button>
        <button id="btn-buyut" class="harita-arac" title="Yakınlaş">+</button>
        <button id="btn-kucult" class="harita-arac" title="Uzaklaş">−</button>
        <label class="harita-arac arac-toggle" title="Tüm ilişkileri göster"><input type="checkbox" id="tum-iliskiler" />İlişki</label>
      </div>
    </section>

    <aside id="panel" class="sag gizli"></aside>
  </main>

  <footer class="alt lejant-alt">
    <span><i class="nokta poz"></i>Pozitif</span>
    <span><i class="nokta neg"></i>Negatif</span>
    <span><i class="nokta ntr"></i>Nötr</span>
    <span><i class="nokta gri"></i>Sinyalsiz</span>
    <span class="lejant-ayrac">·</span>
    <span><i class="halka"></i>İçeriden alım</span>
    <span class="lejant-ayrac">·</span>
    <span><i class="halka taze-halka"></i>Bugün</span>
    <span class="lejant-ayrac">·</span>
    <span>Boyut = sermaye akışı</span>
    <span class="lejant-ayrac harita-lejant">·</span>
    <span class="harita-lejant">Çizgi = seçilen şirket</span>
  </footer>

  <script src="data/manifest.js"></script>
  <script>
    window.DELTAS = [];
    (function () {
      var i = 0;
      function sonraki() {
        if (i >= window.DELTA_FILES.length) {
          window.DELTAS_READY = true;
          window.dispatchEvent(new Event("deltas-ready"));
          return;
        }
        var s = document.createElement("script");
        s.src = "data/deltas/" + window.DELTA_FILES[i++] + ".js";
        s.onload = sonraki;
        s.onerror = function () { console.error("delta yüklenemedi:", s.src); sonraki(); };
        document.head.appendChild(s);
      }
      sonraki();
    })();
  </script>
  <script src="assets/vendor/cytoscape.min.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/bugun.js"></script>
  <script src="data/makro.js"></script>
  <script>
    (function () {
      var kutu = document.getElementById("makro-noktalar");
      if (!kutu || !window.MAKRO || !window.MAKRO.gostergeler) return;
      var etiket = { normal: "normal", izleme: "izleme", alarm: "ALARM" };
      window.MAKRO.gostergeler.forEach(function (g) {
        var n = document.createElement("i");
        n.className = "m-nokta " + (g.durum || "");
        n.setAttribute("data-bilgi", g.ad + " — " + g.deger + " (" + (etiket[g.durum] || g.durum) + ")");
        kutu.appendChild(n);
      });
    })();
  </script>
</body>
</html>
