# Günlük Rapor — 7 Ağustos 2026

*Economic Intelligence OS — Günlük haber akışı ve istihbarat özeti*

---

## 🔴 Günün Öne Çıkanı: İki Stres Testi de Geçildi — SpaceX Lockup'ı Emildi, Kore Toparlandı; Polisilikon Kararnamesi İmzalandı

Dünkü raporun işaretlediği iki eşzamanlı stres testi beklenenden yumuşak sonuçlandı.

**SpaceX lockup günü çöküş olmadı.** ~911,5 milyon halka arz öncesi hissenin (fiyat düşüşü sonrası ~**101 milyar $**) satışa açıldığı perşembe günü hisse gün içinde **+%2,84 ile 111,34 $**'a kadar çıktı; kapanış **~−%1** ile yataya yakındı. Haziran zirvesi 225,64 $'a göre kayıp hâlâ ~%50 ama korkulan arz seli gelmedi — Morgan Stanley'nin "temeller değişmedi" çağrısıyla kurumsal alıcıların beklediği tablo doğrulandı. "Capex cezası" rejimi fiyatı yarıya indirmişti; **emilim testi, dip oluşumunun ilk sinyali** olarak okunabilir *(tek günlük veri; teyit gerektirir)*.

**Kore altı günlük türbülansın ardından toparlandı:** Kospi cuma sabahı **+%1,8 ile 6.411** civarına yükseldi (açılış 6.365,07); **Samsung +%3,15, SK Hynix +%2,54, SK Square +%3,51**. Kritik ayrıntı akış tarafında: bir gün önce 3,35 trilyon won satan **yabancı yatırımcı bu sabah 265,5 milyar won net alıcı**. Dünkü teşhis doğrulandı — satış sektörel çöküş değil, ağır sıklet pozisyon tasfiyesiydi; tasfiye bitince fiyat toparladı. Yedi günlük sekans: −%11 / +%17,9 / −%4,9 / −%1,7 / +%3,76 / −%4,59 / **+%1,8**.

**Üçüncü gelişme politika cephesinden:** Trump, perşembe günü **polisilikon ve türevlerine Section 232 tarifesi getiren kararnameyi imzaladı** — %15 tarife (120 gün sonra yürürlükte) + polisilikon, wafer, hücre ve modüllere **asgari ithalat fiyatı** sistemi + Ticaret Bakanlığı'na yerli üretim teşvik programı talimatı. İki gündür "hazırlanıyor" denilen karar resmiyet kazandı; ayrıntılar aşağıda.

ABD endeksleri günü yatay-hafif satıcılı kapattı: **S&P 500 ~7.726,9, Dow 54.262,82, Nasdaq 100 29.415,67** — beş günlük Dow rekor serisi bitti; depolama satışı (WD **−%17**, SanDisk **−~%10** normal seansta) teknolojiyi bastırırken sağlık ve finans (Eli Lilly, J&J, Goldman ~+%1) endeksi taşıdı. Bugün TSİ 15:30'da **Temmuz istihdam raporu** (konsensüs ~+80 bin, işsizlik %4,2) haftanın ana kararını verecek: Eylül faiz artırımı fiyatlaması %55 civarında.

→ *Modül ilgisi: Financial Power (5), Semiconductor (7), Defense & Space (9), Political Influence (4), Risk Engine (23), Timeline Engine (24)*

## 💰 Finansal Güç: İşgücü Verileri "Sıkı Ama Kırılmamış" Dedi

- **6 Ağustos ABD kapanışı:** S&P 500 **~7.726,9**, Dow **54.262,82**, Nasdaq 100 **29.415,67** — üçü de yatay/hafif eksi *(günlük yüzde değişimler kaynaklar arasında küçük farklarla raporlanıyor)*. Altın **4.321,50 $** (+%0,38) ile çok haftalık zirvede; gümüş 62,03 $.
- **Haftalık işgücü akışı:** İlk işsizlik başvuruları **199 bin** (+1 bin), devam eden başvurular **1,801 milyon** (+24 bin). **Challenger planlı işten çıkarmalar Temmuz'da 33.429** (−%27, iki yılın en düşüğü). **Q2 verimlilik öncü verisi yıllıklandırılmış +%1,4** (beklenti +%0,6) — "işgücü bulamayan şirket, mevcut çalışandan daha fazla verim sıkıyor" yorumu, dünkü JOLTS çerçevesiyle tutarlı.
- **Bugünün ana verisi:** Temmuz tarım dışı istihdam (TSİ 15:30). Konsensüs ~+80 bin, işsizlik %4,2. Başabaş istihdam eşiğinin sıfıra yakın olduğu tartışması nedeniyle zayıf manşet bile "soğuma" okunmayabilir; asıl izlenecek, ücret artışı ve Eylül artırım fiyatlamasının (%55) tepkisi.

→ *Modül ilgisi: Financial Power (5), Timeline Engine (24), Risk Engine (23)*

## 🤖 AI Ekosistemi: Cloudflare "Ajan İnterneti" Teziyle Kazanan Tarafa Geçti

- **Cloudflare Q2'de beklentiyi aştı ve yıl öngörüsünü yükseltti:** Gelir **696,1 milyon $ (+%36)**, cari RPO +%35, düzeltilmiş EPS **0,29 $** (geçen yıl 0,21 $), serbest nakit akışı 56,4 milyon $. Yıl öngörüsü **2,864-2,870 milyar $** gelire çekildi; hisse seans sonrası sert yükseldi. CEO Matthew Prince: "Web, AI yanıt motorlarına ve ajan tabanlı ticarete kayarken internetin **makineden-makineye trafik** için baştan yazılışını görüyoruz" — şirket "Agentic Internet" (ajan interneti) için geliştirici araçları ve **ödeme rayları** kurduğunu söylüyor. Not: 150,7 milyon $'lık yeniden yapılanma gideri GAAP zararını 0,48 $/hisseye derinleştirdi.
- **Dünkü ayrışma çerçevesi doğrulanıyor:** AI'ı dağıtım/altyapı kanalı olarak konumlandıranlar (Shopify, Cloudflare) primlenirken, iş modeli AI tarafından yeniden yazılanlar (HubSpot −%24, AppLovin) cezalandırılmaya devam etti. Cloudflare'in 9. Daire'nin CFAA kararından iki gün sonra "ajan trafiğine ödeme rayı" vurgusu yapması tesadüf değil: **ajan trafiği hukuken serbestleşirken, parasallaştırma katmanını kim kurarsa platform kirasını o toplayacak.**

→ *Modül ilgisi: AI Ecosystem (6), Financial Power (5), Risk Engine (23)*

## 🔬 Yarıiletken: Depolama Dip Aradı, Kore Alıcı Buldu

- **ABD seansında ikinci gün satışı:** Western Digital **−%17**, SanDisk **−~%10** — öngörü şokunun normal seans fiyatlaması, seans sonrası tepkiden de sertti. Buna karşılık Kore'nin cuma toparlanması (yukarıda) ve yabancının alıcıya dönmesi, zincirin Asya ayağında "aşırı satış" teşhisini destekliyor. Spot/sözleşme fiyat verisi hâlâ eksik — tez düzeyinde değişiklik yok: talep kırılmadı, beklenti fiyatlaması test ediliyor.
- **Polisilikon kararının çip ayağı:** Kararname kapsamına **AI çipleri ve telefonlarda kullanılan silikon wafer'lar** da giriyor; 120 günlük geçiş, tedarik zincirlerine stok ve tedarikçi çeşitlendirme süresi tanıyor. Hemlock ve Wacker'ın ABD tesisleri için öngörülebilir fiyat tabanı; Çin'li GCL/Tongwei tarafında ise ABD pazarına giriş fiilen fiyat-kontrollü hâle geliyor.

→ *Modül ilgisi: Semiconductor (7), Supply Chain (22), Political Influence (4), Risk Engine (23)*

## ⚡ Enerji: Petrol 80 $ Bandına Tutundu — "48 Saat" Doldu, İmza Yok

- **Brent 80,23 $ (+%0,98), WTI 75,81 $ (+%0,78)** — üç günlük düşüşün ardından ikinci gün hafif yukarı. Piyasa, İran-Umman rota çerçevesine rağmen imzasız geçen her günü küçük bir risk primiyle fiyatlıyor.
- Trump'ın çarşamba günkü "48 saat içinde bileceğiz" penceresi bugün doluyor; taraflardan birinin **ücret/kontrol** başlığında geri adım atması gerektiği yönündeki değerlendirmeler basında ağırlıkta *(müzakere durumu akışkan; teyit gerektirir)*. Boğaz trafiği hâlâ savaş öncesinin çok altında — normalleşme fiyatlandı ama gerçekleşmedi; bu makas, haftanın en asimetrik riski olmayı sürdürüyor.

→ *Modül ilgisi: Energy Network (8), Financial Power (5), Risk Engine (23)*

## 🛡️ Savunma ve Uzay: Lockup Emilimi AI-IPO Dalgası İçin Yeşil Işık

- SpaceX'in ~101 milyar $'lık arz açılışını çöküşsüz emmesi, yalnızca şirketin değil **2026 AI-IPO penceresinin** testiydi: CXMT sonrası sırada bekleyen adaylar (olası OpenAI, Solidigm'in Nasdaq planı) için "piyasada derinlik var" sinyali. İzleme: önümüzdeki günlerde kayıtlı satış hacimleri ve hissenin 111 $ bandını koruyup korumadığı.
- Dünkü "yalnızca Nvidia" kararının ikinci gün etkisi sınırlı kaldı; AMD'nin Helios sipariş defterinden SpaceX-dışı doğrulama sorusu açık.

→ *Modül ilgisi: Defense & Space (9), AI Ecosystem (6), Financial Power (5)*

## ⚖️ Politika ve Regülasyon: Polisilikon Kararnamesi — Tarife Değil, Fiyat Rejimi

- **Kararnamenin mimarisi üç katmanlı:** (1) polisilikon türevlerine **%15 gümrük vergisi**, imzadan 120 gün sonra; (2) polisilikon, wafer, hücre ve modüllere **asgari ithalat fiyatları** — Çinli üreticinin tarifeyi fiyat kırarak etkisizleştirme yolunu kapatan asıl mekanizma; (3) Ticaret Bakanlığı'na **yerli üretim teşvik programı** kurma talimatı. Dayanak: bir yıllık Section 232 ulusal güvenlik soruşturması.
- **Etki kanalları:** Güneş paneli ithal fiyatlarında yukarı baskı (sektör basını "tüm ithal panellerin fiyatı artacak" diyor) → veri merkezi yenilenebilir PPA maliyetlerine gecikmeli yansıma; çip tarafında wafer maliyet tabanı. CHIPS-hissedarlık modeliyle birlikte federal sanayi politikası artık **fiyat mekanizması tasarlayan** bir evreye geçti — bu, tarife hukuku davalarından farklı ve daha kalıcı bir müdahale biçimi.

→ *Modül ilgisi: Political Influence (4), Supply Chain (22), Energy Network (8), Semiconductor (7)*

## 🌡️ Makro Görünüm (Kriz Termometresi: 3/18 — DÜŞÜK)

Panel değişmedi: alarm yok; getiri eğrisi (+0,45), enflasyon (CPI %3,5/PCE %3,7) ve Fed yönü (artırım %55) izlemede. Dünkü verimlilik sürprizi (+%1,4) birim işgücü maliyeti baskısını hafifletici — enflasyon kanalı için olumlu kenar notu. Bugünkü istihdam raporu Sahm girdisini (0,07) güncelleyecek; kısa uç faiz tepkisi eğri izlemesinin ana değişkeni.

→ *Modül ilgisi: Risk Engine (23), Financial Power (5), Timeline Engine (24)*

## 📌 Risk Engine Notları (Bugünün sinyalleri)

1. **Emilim testi geçildi, dip teyidi değil:** SpaceX'in lockup gününü yatay kapatması arz korkusunu söndürdü ama tek günlük veri; kayıtlı satışlar haftalar boyu damla damla gelebilir. 111 $ bandı tutarsa "capex cezası" rejiminin fiyatlamayı tamamladığı tezi güçlenir — AI-IPO takvimi (Solidigm, olası OpenAI) buna endeksli.
2. **Kore'de akış yönü döndü, soru hâlâ fiyatta:** Yabancının 3,35 trilyon won satıştan 265,5 milyar won alıma dönmesi pozisyonel tasfiyenin bittiğini gösteriyor; ama NAND öngörü şokunun kaynağı (beklenti fazlası) çözülmedi. Spot/sözleşme fiyat serileri gelene kadar oynaklık rejimi ±%2-5 bandında kalır.
3. **Polisilikonda asıl haber asgari fiyat:** %15 tarife manşet, fiyat tabanı mekanizma. 120 günlük geçişte iki izleme: Çin'in DTÖ/misilleme tepkisi ve ilk taban fiyat seviyelerinin açıklanması — taban yüksek gelirse güneş+veri merkezi maliyet zincirinde 2027 PPA fiyatlamaları yukarı kayar.
4. **"Ajan interneti" parasallaştırma yarışı açıldı:** CFAA kararı ajan trafiğini hukuken serbestleştirdi; Cloudflare'in ödeme rayı hamlesi ilk büyük kira toplama girişimi. Platformlar (Amazon) teknik bariyer + ücretli API'ye kayarken, altyapı katmanında Cloudflare-tipi aracıların fiyatlama gücü yeni izleme başlığı.
5. **İstihdam raporu çift taraflı risk:** Güçlü veri Eylül artırımını kilitler (kısa uç ↑, eğri düzleşir — makro izleme 1 numara); zayıf veri ise "başabaş eşik sıfıra yakın" tartışması yüzünden resesyon sinyali olarak okunmayabilir ama hisse çarpanını rahatlatır. Asimetri: tahvil piyasası için güçlü veri, hisse için zayıf veri daha "kolay" senaryo.
