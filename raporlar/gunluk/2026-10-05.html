# Günlük Rapor — 5 Ekim 2026

*Economic Intelligence OS — pencere: 2 Ekim Cuma seansı + hafta sonu + 5 Ekim Pazartesi sabah*

---

## 🔴 Tez: Tesla teslim konsensüsü aştı ama yıllık düştü; istihdam +29 bin; Amazon 8 mlr $ çip SPV’si görüşmede; G7 100 mn varil

Tesla IR (2 Eki, 8-K 09:04 ET): Q3 üretim 464.391, teslim 486.532 (şirket konsensüsü 461.974), enerji depolama 13,7 GWh. Teslim üretimden ~22 bin üstte; yıllık teslim 497.099’dan −%2,1. BLS (2 Eki 08:30 ET): tarım dışı +29 bin (Reuters anketi 90 bin), işsizlik %4,2 (önceki %4,1), ücret yıllık %3,0; Temmuz −10 bin, Ağustos 162→133 bin. Amazon, ~8 mlr $ Nvidia Grace Blackwell’i SPV’ye aktarıp kiralama görüşmesinde (FT/Bloomberg, 2 Eki); Amazon yorum yok, imza yok. G7, IEA koordinasyonunda 100 mn varil dizel+ham (4 ay, 20 günde önden dizel) açıkladı (Reuters/BBC, 2 Eki); ülke kırılımı yok. Brent sabah ~102 $. Çin Ekim yakıt izni hâlâ yok (NYT 2–3 Eki teyit). Dönemsel “sıkılaşan darlık” ayakta: işgücü yumuşak, çip finansmanı bilanco dışına kayıyor, ürün kısıtı G7 ile kısmi ofset. Yarının testi: 7 Eki Çin izni + 9 Eki SpaceX kilit.

## ⚡ Bugün işe yarayanlar

- **Tesla Q3 teslim + depolama:** IR/8-K; 486.532 teslim, 13,7 GWh. Kim: stok eritme + depolama sevkiyatı. Yarına: nakit/marj çeyrekte.
- **İstihdam +29 bin:** BLS/Reuters; işsizlik %4,2, ücret %3,0. Kim: Ekim faiz artırım gerekçesi zayıfladı, getiri yüksek kaldı. Yarına: 10Y bandı.
- **Amazon çip SPV görüşmesi:** FT/Bloomberg; ~8 mlr $ Grace Blackwell, borç + en fazla %10 hisse; imza yok. Kim: AI capex finansman katmanı. Yarına: imza veya ret.
- **G7 100 mn varil:** Reuters/BBC; 4 ay, önden dizel. Kim: ürün kısıtına kısmi ofset, Hürmüz’ü kapatmaz. Yarına: ülke hacmi.

## 🧭 Yön teyidi

Son dönemsel (29 Ağu–17 Eyl): **sıkılaşan darlık — yatay-aşağı ve dar**. Bugün: **ayakta**. Teslim sürprizi capex kesmedi; istihdam yumuşak ama 10Y ~%5,26–5,28. SPV görüşmesi harcamayı değil finansman katmanını kaydırıyor. G7 stok Çin askısını ve Hürmüz primini silmedi. Geçersizleşme: (a) Aramco tam hat + Brent kalıcı <95; (b) Çin ihracat izni + Hürmüz 50+ gemi; (c) hyperscaler capex kesimi.

## 🧱 Hareket eden darboğaz

- **cin-yakit-ihracat:** NYT 2–3 Eki ikinci kaynak; yeni ticari izin yok, HK/Makao dışı askı sürüyor. Kpler: dizel stoku eşiğin ~20 mn varil altında. Durum: açık (7 Eki testi).
- **G7 stok:** 100 mn varil dizel+ham, ülke kırılımı yok. Yeni kısıt satırı değil; ürün sıkılığında kısmi ofset.

hat-dogu-bati / yanbu-yukleme / humruz-ais: pencerede Aramco bülten veya yeni AIS bandı yok. hbm-cowos ve ai-capex-kilavuz durağan (SPV kesim değil). spcx-kilit 9 Eki açık, emilim yok. Jazan, Umman STS, bellek-abd açık.

## 💰 Sermaye

Amazon: ~8 mlr $ Grace Blackwell SPV + kiralama görüşmesi; borç ve en fazla %10 hisse; Amazon mülkiyet bırakma konuşuluyor. İmza yok, 8-K yok. Tesla 8-K teslim/depolama, sermaye işlemi değil. SpaceX kilit 9 Eki (en fazla ~328 mn hisse) henüz açılmadı. Çekirdek 23’te yeni ATM / 13D / imzalı PPA yok.

**4/18 DÜŞÜK** · izlemede: getiri eğrisi (10Y 2 Eki kapanış %5,28 / 4 Eki %5,26), enflasyon (PCE %3,4 / çekirdek %3,0). VIX 2 Eki kapanış 15,31. Brent sabah ~102 $. TCMB brüt rezerv 25 Eyl 171,2 mlr $. Yeni alarm yok.

## 📌 Koşullu sinyaller

1. Eğer Amazon SPV imzalanırsa → çip capex’i bilanco dışına kayar, kullanım kalır. Geçersizleşme: görüşme dağılır.
2. Eğer Çin 7 Eki sonrası izin vermezse → dizel sıkışıklığı G7 ofsetine rağmen uzar. Geçersizleşme: izin + kargo.
3. Eğer 9 Eki SpaceX dilimi zayıf emilirse → arz baskısı ikinci bacak. Geçersizleşme: teslim + güçlü emilim.
4. Eğer 10Y %5,30+ kalıcı olursa → yumuşak istihdam getiri primini silmez. Geçersizleşme: kalıcı %5,10 altı.
5. Eğer G7 ülke hacmi 20 günde gelmezse → dizel ofseti kağıtta kalır. Geçersizleşme: IEA teyitli sevkiyat.
