# Günlük Rapor — 9 Kasım 2026

*Economic Intelligence OS — pencere: 6–9 Kasım (hafta sonu dahil)*

---

## 🔴 Tez: Nvidia Yönetim Kurulu Jensen Huang’ın yabancı istihbarat hedefi olması iddiası üzerine bağımsız soruşturma açtı (8 Kas IR); after-hours hisseler düştü; Micron Taoyuan $4,5 mlr $ HBM fab inşaatını iş uyuşmazlığı nedeniyle durdurdu (Bloomberg); SpaceX Google yöneticisi Donald Harrison kuruldan istifa etti (8-K, Alphabet çatışma); Hürmüz AIS ~%8 normal — sıkılaşan darlık ayakta, AI çip liderliği yönetişim riski ve HBM kapasite sürtünmesi sermaye akışını ofsetliyor

6–9 Kas penceresinde çekirdek 23 ad IR + ajans taramasında eşikler: Nvidia Yönetim Kurulu 8 Kas bağımsız soruşturma başlattı (founder/CEO Jensen Huang yabancı istihbarat hedefi iddiası; Çinli iş kadını ilişkisi raporları; Huang sadakatsizlik özrü; kurul güven bildirimi, sırlar tehlikede değil). After-hours hisseler düştü (Reuters 9 Kas). Micron Taoyuan Fab 11E ($4,5 mlr $, HBM/DRAM 2028) inşaatını iş uyuşmazlığı/kâr paylaşımı nedeniyle durdurdu (Bloomberg 6-8 Kas); Micron operasyonlar normal dedi, müzakere sürüyor. SpaceX 6 Kas 8-K: Google yöneticisi Donald Harrison kuruldan istifa (anlaşmazlık yok); Musk Alphabet çatışma gerekçesi; Bloomberg bağımsızlar Tesla birleşmesini değerlendiriyor. Hürmüz AIS-görünür 9 Kas ~7,1/gün (haftalık, ~%8 normal, restricted). Çin Kasım diesel ihracatı ince stok nedeniyle yumuşuyor (Reuters kaynaklar ~500 bin ton satıldı, <800 bin tahmin). Loughton çözülmedi. Diğer adlarda yeni IR eşiği yok. Dönemsel sıkılaşan darlık ayakta. Yarının testi: Nvidia soruşturma güncellemesi veya Micron fab teyidi veya Hürmüz 20+.

## ⚡ Bugün işe yarayanlar

- **Nvidia board probe:** Yönetişim riski AI çip liderinde. Kim: sır/ilişki incelemesi. Yarına: kurul güncellemesi veya Q3 (17 Kas).
- **Micron Taoyuan pause:** $4,5 mlr $ HBM kapasite sürtünmesi. Kim: iş uyuşmazlığı. Yarına: inşaat restart veya müzakere.
- **SpaceX board exit:** Harrison istifa (8-K), Tesla birleşme iddiası. Kim: Alphabet çatışma. Yarına: birleşme veya kurul değişikliği.
- **Hürmüz AIS düşük:** ~%8 normal devam. Kim: kısıt sürüyor. Yarına: 20+ veya resmi.

## 🧭 Yön teyidi

Son dönemsel (29 Ağu–17 Eyl): **sıkılaşan darlık — yatay-aşağı ve dar**. Bugün: **ayakta, ofset yönetişim/kapasite**. Hürmüz/Çin/Loughton kısıtı sürüyor; AI sermayesi borç/capex ile akıyor ancak Nvidia yönetişim riski ve Micron HBM fab duraklaması ofset üretiyor. 10Y ~%4,86. Geçersizleşme: (a) Aramco tam hat + Brent kalıcı <95; (b) Çin kargo + Hürmüz 50+ ve isabet durması; (c) hyperscaler capex kesimi veya bellek arz gevşemesi.

## 🧱 Hareket eden darboğaz

**humruz-ais:** kısıt teyidi devam (AIS-görünür ~7,1/gün, ~%8 normal). **hbm-cowos:** Micron Taoyuan Fab 11E inşaat duraklaması (iş uyuşmazlığı), 2028 HBM risk. **cin-yakit-ihracat:** Kasım diesel yumuşama (ince stok, kaynaklar), resmi teyitsiz. **ai-capex (güç/saha):** Loughton çözülmedi, ABD seçim ofset sürüyor. **spcx-kilit:** emilim ölçülmedi. yanbu/jazan/umman-sts Aramco bülten yok. ai-capex-kilavuz durağan.

## 💰 Sermaye

SpaceX 8-K (Harrison kurul istifa, anlaşmazlık yok) — yönetişim, saf sermaye değil. Yeni ATM / büyük tahvil / 13D / PPA / kilit emilim yok. Önceki Apple/Meta/Alphabet/Microsoft tahvil ve Amazon CapEx yüksekliği sürüyor. Kotasyon ≠ sermaye.

## 🌡️ Termometre

**4/18 DÜŞÜK** · izlemede: getiri eğrisi (10Y ~%4,86), enflasyon (Eylül CPI %3,7 / PCE %3,4). VIX önceki yükselme sonrası izleme bandı. Brent ~94-100 $. TCMB brüt rezerv 25 Eyl 171,2 mlr $. Termometre alarmı yok. Saha: Hürmüz kısıtı + Nvidia yönetişim + Micron HBM sürtünmesi.

## 📌 Koşullu sinyaller

1. Eğer Nvidia soruşturma sırlar tehlikede bulursa → AI çip liderliği ofset derinleşir. Geçersizleşme: kurul “güven” teyidi + Q3 güçlü.
2. Eğer Micron Taoyuan restart olmazsa → HBM 2028 kapasite gecikir. Geçersizleşme: inşaat devam + IR teyit.
3. Eğer Hürmüz 20 geminin altında kalırsa → kısıt tek gün değil. Geçersizleşme: günlük 50+ ve isabet durması.
4. Eğer Çin resmi bülten + kargo gelmezse → diesel yumuşama kaynak iddiası olarak kalır. Geçersizleşme: NDRC + kargo.
5. Eğer SpaceX-Tesla birleşme ilerlerse → AI computing/power entegrasyonu. Geçersizleşme: kurul reddi.
