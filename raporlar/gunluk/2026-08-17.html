2. **MoU'nun bitişi Hürmüz'ü çerçevesiz bıraktı — ve iki resmi anlatı artık uzlaşmaz:** ABD "günde 9 milyon varile kadar geçiyor" derken saha verisi %1 debi gösteriyor; biri doğruysa diğeri değil. Eğer ABD anlatısı doğruysa stok tamponu sanılandan güçlü (fiyat baskısı sınırlı kalır); saha verisi doğruysa mevcut ~88 $ Brent, beş yılın en geniş açığını hâlâ fiyatlamıyor. OECD stok verisi ve tanker takip raporları bu çelişkinin hakemi — Risk Engine bu kalemi "veri savaşı" olarak ayrı izlemeye aldı.
3. **SpaceX 20 Ağustos kilidi, üç bilançoya birden bağlı tek risk düğümü:** ~320 milyon hisselik tranş; SPCX'in kendisi, Alphabet'in 94 milyar $'lık payı ve (Berkshire üzerinden) yeni dolaylı maruziyet zinciri aynı takvime kilitli. Anysphere kapanışı anlatıyı güçlendiriyor ama arz matematiği kısa vadede baskın — ilk tranşın +%22'lik "korkuluk boşa çıktı" rallisi ikinci tranşta tekrarlanamazsa, özel-piyasa AI değerlemelerinin halka açık çapası zayıflar.
4. **Bellek re-rating'i sözleşme anlatısıyla kurumsallaşıyor — tek kaynaklı TCV'ye dikkat:** SNDK hedef bandı 48 saatte 1.550-2.250 $'a taşındı; ~94 milyar $ TCV rakamı henüz şirket dosyasıyla değil analist derlemesiyle dolaşımda. Kospi'nin tatil sonrası Salı açılışı + Temasek tutarının hâlâ boş olması + ABD'nin Kore dron tarifesi: Kore bacağında pozitif fiyat / negatif politika makası açılıyor. İlk NBM fiyat revizyonu veya bağımsız hacim teyidi gelene dek "döngü kırıldı" tezini doğrulanmamış sayıyoruz.
5. **AI fiyat savaşında yön ayrıştı — bu bir marj sinyali:** OpenAI/Anthropic fiyat indirirken DeepSeek %1.100'e varan zam yaptı ve SMIC %93,7 dolulukla fiyat artırdı: Batı'da dağıtım rekabeti fiyatı ezerken, Çin zincirinde kapasite kıtlığı fiyat gücü üretiyor. Anthropic'in 11,5 milyar $'lık çeyreği ve 1,5 trilyon $'lık Big Tech taahhüt stoku, gelir tarafının şimdilik yetiştiğini gösteriyor — ama Cuma'nın AMAT/Broadcom satışı, halka açık piyasanın bu denkleme artan iskonto uyguladığının kanıtı. İzleme: Anthropic IPO dosyası + Eylül başı AI dolaşımsal finansman modülü.
