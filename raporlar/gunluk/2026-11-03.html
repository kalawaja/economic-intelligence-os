# Günlük Rapor — 3 Kasım 2026

*Economic Intelligence OS — pencere: 2–3 Kasım*

---

## 🔴 Tez: Apple Q4 FY26 bellek maliyeti tatil çeyreği brüt marjı 45-46 %'ya basacak (önceki 47,9 %); Hürmüz AIS 2 Kas 5, 3 Kas ~3/24h düşük; Çin kota teyitsiz; Loughton çözülmedi — sıkılaşan darlık ayakta, bellek darlığı tüketiciye yansıyor

2–3 Kas penceresinde çekirdek 23 ad IR + ajans taramasında eşik: Apple Q4 sonuçları (2 Kas). Gelir $114,5 mlr $ (+%12), EPS $2,10. Brüt marj %47,9 (gümrük iadesi etkisi ~1 puan). Tatil çeyreği kılavuzu brüt marj %45-46 (bellek çip maliyeti baskısı); hizmetler büyümesi %8-9. iPhone Duo tedarik kısıtı sürüyor. Hürmüz AIS-görünür 2 Kasım 5 geçiş, 3 Kasım ~3/24h (hormuz.now, restricted, ~%10 normal). Çin 4. parti ~3,7-4 mn ton kota kaynaklarla (önceki), resmi bülten/kargo yok. Loughton güç 2030’lara, Microsoft çekildi (önceki), çözüm yok. Önceki AI sermaye akışı (Microsoft tahvil, Amazon capex) duruyor; yeni 8-K/ATM/13D/PPA yok. Dönemsel sıkılaşan darlık ayakta. Yarının testi: Nvidia 17 Kas sonuçları veya Hürmüz 20+ veya Çin resmi bülten.

## ⚡ Bugün işe yarayanlar

- **Apple bellek maliyeti:** Q4 $114,5 mlr $; tatil GM 45-46 %. Kim: tüketici marj + bellek arz. Yarına: fiyat/tedarik IR.
- **Hürmüz AIS düşük:** 2 Kas 5, 3 Kas ~3/24h. Kim: ofset yok. Yarına: 20+ veya resmi.
- **Çin kota teyitsiz:** 4. parti kaynaklarla, resmi bülten/kargo yok. Kim: ihracat politikası. Yarına: NDRC bülten veya kargo.
- **Loughton çözülmedi:** Güç 2030’lara, Microsoft çekildi. Kim: AI kapasite dağıtımı. Yarına: alternatif güç IR.

## 🧭 Yön teyidi

Son dönemsel (29 Ağu–17 Eyl): **sıkılaşan darlık — yatay-aşağı ve dar**. Bugün: **ayakta, ofset yok**. Apple bellek maliyeti tüketiciye yansıdı; Hürmüz/Çin/Loughton kısıtı sürüyor. 10Y 2 Kas ~%4,91. Geçersizleşme: (a) Aramco tam hat + Brent kalıcı <95; (b) Çin kargo + Hürmüz 50+ ve isabet durması; (c) hyperscaler capex kesimi veya bellek arz gevşemesi.

## 🥻 Hareket eden darboğaz

**humruz-ais:** kısıt teyidi devam (AIS-görünür 2 Kas 5, 3 Kas ~3/24h). **cin-yakit-ihracat:** ~3,7-4 mn ton kaynaklarla, resmi bülten yok, kargo teyitsiz. **ai-capex (güç):** Loughton çözülmedi. **hbm-cowos / bellek:** Apple kılavuzu maliyet baskısı teyit. **spcx-kilit:** emilim ölçülmedi. yanbu/jazan/umman-sts Aramco bülten yok. ai-capex-kilavuz durağan.

## 💰 Sermaye

Yeni ATM / 8-K / 13D / PPA / kilit emilim yok. Apple sonuçları + maliyet kılavuzu; sermaye olayı değil. Önceki Microsoft tahvil ve Amazon Q3 CapEx yüksekliği sürüyor. Çin kota ticaret politikası, şirket sermayesi değil. Kotasyon ≠ sermaye.

## 🌡️ Termometre

**5/18 DÜŞÜK** · izlemede: getiri eğrisi (10Y 2 Kas ~%4,91), enflasyon (Eylül CPI %3,7 / PCE %3,4), VIX ~21,15. Brent ~104-110 $. TCMB brüt rezerv 25 Eyl 171,2 mlr $. Termometre alarmı yok. Saha: Hürmüz kısıtı sürüyor; Apple bellek maliyeti.

## 📌 Koşullu sinyaller

1. Eğer Apple bellek maliyeti tatil marjını kalıcı basarsa → tüketici fiyat/tedarik kısıtı. Geçersizleşme: IR maliyet gevşemesi veya fiyat artışı emilimi.
2. Eğer Hürmüz 20 geminin altında kalırsa → kısıt tek gün değil. Geçersizleşme: günlük 50+ ve isabet durması.
3. Eğer Çin resmi bülten + kargo gelmezse → kota kaynak iddiası olarak kalır. Geçersizleşme: NDRC/Ticaret Bakanlığı + kargo.
4. Eğer Loughton alternatif güç bulunmazsa → AI kapasite dağıtımı daha da gecikir. Geçersizleşme: alternatif kaynak veya başka site IR.
5. Eğer hyperscaler capex kesimi gelirse → AI sermaye akışı durur. Geçersizleşme: kılavuz düşüşü.
