# Günlük Rapor — 13 Ekim 2026

*Economic Intelligence OS — pencere: 12 Ekim Pazartesi seansı + 13 Ekim Salı sabah*

---

## 🔴 Tez: Çin izin ve Hürmüz kısıtı teyitsiz duruyor; SpaceX çip borcu term sheet’siz

Reuters (9 Eki, dört tüccar) Çin Ekim ürün izni ~3,7 mn ton iddiası 13 Eki’ye kadar resmi bülten veya kargo ile teyit edilmedi. Hürmüz canlı AIS takipçileri (13 Eki) ticari geçişi ~3–9 gemi/gün bandında tutuyor (normal ~74); 12 Eki tanker isabet iddiaları (İran/UKMTO) kısıtı pekiştiriyor. SpaceX ~40 mlr $ Nvidia çip borcu görüşmesi sürüyor, term sheet veya imza yok. 9 Eki kilit dilimi emilim başarısızlığı göstermedi; sonraki dilim 24 Eki. Çekirdek 23 ad taramasında yeni imzalı sermaye olayı (8-K, ATM, 13D, PPA, capex revizyonu) yok. Dönemsel “sıkılaşan darlık” ayakta: ofset teyitsiz, boğaz dar, çip borcu bağlanmadı. Yarının testi: Çin kargosu + Hürmüz 20+ veya SpaceX borç/emilim.

## ⚡ Bugün işe yarayanlar

- **Hürmüz kısıtı sürüyor:** 13 Eki canlı AIS ~3–9/gün; 12 Eki isabet iddiaları. Kim: ürün ofseti yok. Yarına: günlük 20+ veya resmi açılış.
- **Çin izin teyitsiz:** 9 Eki Reuters tüccar; 13 Eki NDRC/kargo yok. Kim: dizel ofseti hâlâ iddia. Yarına: gümrük veya rıhtım.
- **SpaceX borç ve kilit:** ~40 mlr $ görüşme term sheet’siz; 9 Eki dilim emilim zayıf negatif değil. Kim: arz penceresi devam. Yarına: 24 Eki dilimi veya imza.
- **Sermaye sıfır:** 23 ad taramasında yeni ATM/13D/PPA/capex yok. Kim: harita sermaye katmanı durağan.

## 🧭 Yön teyidi

Son dönemsel (29 Ağu–17 Eyl): **sıkılaşan darlık — yatay-aşağı ve dar**. Bugün: **ayakta, ofset yok**. Çin izni iddiası ve Hürmüz kısıtı teyitsiz. SpaceX borcu bağlanmadı. 10Y 12 Eki kapanış %5,240. Geçersizleşme: (a) Aramco tam hat + Brent kalıcı <95; (b) Çin kargo + Hürmüz 50+ ve isabet durması; (c) hyperscaler capex kesimi.

## 🧱 Hareket eden darboğaz

**humruz-ais:** kısıt teyidi devam (13 Eki ~3–9/gün + 12 Eki isabet iddiaları). **cin-yakit-ihracat:** teyitsiz izin duruyor, kargo yok. **spcx-kilit:** 9 Eki dilimi emilim ölçümü zayıf negatif değil; sonraki 24 Eki. yanbu/jazan/umman-sts Aramco bülten yok. hbm-cowos ve ai-capex-kilavuz durağan.

## 💰 Sermaye

İmzalı olay yok. Çin izni ticaret politikası, şirket sermayesi değil. SpaceX kilit açılışı arz, yeni ihraç değil. ~40 mlr $ çip borcu term sheet’siz. Çekirdek 23’te yeni ATM / 13D / PPA / capex revizyonu yok.

## 🌡️ Termometre

**4/18 DÜŞÜK** · izlemede: getiri eğrisi (10Y 12 Eki kapanış %5,240), enflasyon (PCE %3,4 / çekirdek %3,0). VIX 12 Eki kapanış 15,21. Brent 13 Eki ~105,5 $. TCMB brüt rezerv 25 Eyl 171,2 mlr $. Termometre alarmı yok. Saha: Hürmüz kısıtı sürüyor.

## 📌 Koşullu sinyaller

1. Eğer Çin kargosu yüklenmezse → 3,7 mn ton iddiası kota olarak kalır. Geçersizleşme: gümrük veya rıhtım teyidi.
2. Eğer Hürmüz 20 geminin altında kalırsa → kısıt tek gün değil. Geçersizleşme: günlük 50+ ve isabet durması.
3. Eğer SpaceX 24 Eki dilimi zayıf emilirse → arz baskısı ikinci bacak. Geçersizleşme: teslim + güçlü emilim.
4. Eğer SpaceX–Apollo term sheet imzalanırsa → Nvidia çip siparişi dış borç katmanına bağlanır. Geçersizleşme: görüşme dağılır.
5. Eğer 10Y kapanış kalıcı %5,30 üstüne çıkarsa → %5,24 bandı tek seanslık değil. Geçersizleşme: kalıcı %5,10 altı.
