3. **Warsh bugün 14:00 UTC — "Eylül beklet / Aralık artır" fiyatlamasının ilk resmî testi:** TE >%70 Aralık-artırım fiyatlaması ile Beansprout'un bayat %58,6'sı arasındaki makas, konuşma sonrası tek yönde kapanacak. Şahin süpriz 10Y'yi %4,70 üstüne ve altını aşağı iter; "veri bağımlı" yumuşaklık yazılım rallisine ikinci bacak verir. Metin Pazartesi koşusunda işlenecek.
4. **Hürmüz'de diplomasi-saha makası kurumsallaşıyor:** Gelir paylaşımı + koridor + 30-60 günlük mayın penceresi ilerleme; ama Tahran'ın "ABD taahhütleri" şartı ve Washington'ın "Haziran şartlarına dönüş yok" cevabı, tam açılışı yeniden ABD-İran ikili masasına bağladı. Debi %9'da sabitken Goldman'ın "ihracat 2/3 toparlandı" hesabı, fiyatın hangi veriye inanacağı sorusunu keskinleştiriyor. İzleme: mayın temizliği fiili başlangıcı, günlük geçiş serileri, tanker sigorta primleri, ABD-İran temas sinyali.
5. **Endeks-içi genişlik uyarısı:** S&P +%0,72'lik günde eşit-ağırlık eksi, üç sektör negatif — ralli Nvidia + yazılım kanıt sunanlarla sınırlı. Bu desen sürerse endeks tek anlatıya (AI-capex) kaldıraçlanmış demektir; Nvidia'da tek kötü haber genişlik tamponu olmadan düşüşe çevirir. İzleme: eşit-ağırlık S&P'nin göreli seyri, RSP/SPY oranı, sektör genişliği.
