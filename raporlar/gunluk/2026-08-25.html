1. **İzolasyon paketinin "eksik dişi" iki yönlü risk üretiyor:** Çin bankalarına ikincil yaptırımın ertelenmesi petrolü soğuttu (Brent 93 → 92 $); ama bu, paketin ya kademeli sertleşeceği (Çin bankası vakası → petrol/kur şoku) ya da sızıntıyla sulanacağı (yaptırım kredibilite kaybı) anlamına gelir. Rezai'nin tanker tehdidi asimetriyi büyütüyor: Hürmüz'de tek fiilî olay, "sıfır sızıntı" retoriğini fiziksel arz sorununa çevirir. İzleme: Çin'in alım davranışı, tanker sigorta primleri, Brent 90 $ tabanı (üçüncü hafta).
2. **Eğri izlemeye döndü + artırım fiyatlaması %40 — yarınki PCE %50 eşiğinin tetikçisi olabilir:** Çekirdek PCE a/a %0,3+ gelirse Eylül artırım fiyatlaması %50 izleme eşiğini test eder ve Fed göstergesi de yanarak termometreyi 3/18'e taşır; %0,2 ve altı Warsh'a "ölçülü şahin" alanı açar. Karartma öncesi son pencere: yarınki veri + Cuma Warsh, 16 Eylül kararının fiyatlamasını kilitleyecek.
3. **Nvidia: yedi kayıp günü + ±%6,75 opsiyon fiyatlaması + bellek maliyet baskısı = asimetrik kurulum:** Pozisyon temizliği (Kore V-dönüşünün teyit ettiği gibi) beklentiyi aşağı çekti — Q3 kılavuzu 103,96 milyar $ eşiğini aşarsa tepki rallisinin yakıtı hazır; kaçırırsa bellek-maliyet marj sorusu (sunucu maliyeti +%15, 2027 başı) anlatıya kalıcı yapışır. Yayılma kanalı: hiperölçekleyici capex çarpanları + Broadcom/Marvell (bilanço bu hafta) üzerinden satıcı-finansmanı zinciri.
4. **Kanada'da "ılımlı ilk gün" yanıltıcı olabilir — eskalasyon takvimi yüklü:** 8 Eylül misillemesi + Trump'ın 1 Ocak otomotiv/çelik tehdidi, USMCA gözden geçirmesini fiilen çift-tarifeli rejime çeviriyor. TSX'in yükselişi maruziyetin dar fiyatlandığını gösteriyor; otomotiv tedarik zinciri (parça geçişleri günde ~6 kez sınır aşıyor) 1 Ocak senaryosunda ilk kırılma noktası. İzleme: iki başkent arasında geri-kanal sinyali, CAD 72 sent tabanı.
5. **Kore belleğine jeopolitik kuyruk — "Amerika'ya yatırım" baskısı rallinin yeni değişkeni:** ABD'nin Seul'e bellek-üretim yatırımı baskısı + Honam 800 trilyon ₩ projesi gerilimi, Samsung/SKH sermaye-getirisi anlatısına capex-yeri sorusu ekliyor (getiri planları ile ABD fab taahhütleri aynı bilançodan yarışacak). Eylül'de açıklanacak ilk Kore-ABD yatırım paketi, temettü/geri alım beklentilerinin revizyon riski. İzleme: Salı V-dönüşünün kalıcılığı, SKH-Samsung ayrışması, Nvidia sonrası HBM haberleri.
