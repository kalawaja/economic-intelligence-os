# Günlük Rapor — 26 Kasım 2026

*Economic Intelligence OS — pencere: 25–26 Kasım*

---

## 🔴 Tez: FCC SpaceX Starmind 1 milyon uydu orbital veri merkezi onayladı (25 Kas) + Hürmüz 25 Kas 6 / 26 sabah 0 düşük + VIX ~28,3 izlemede — sıkılaşan darlık ayakta, orbital compute regülasyonu açıldı, enerji/çip kısıtı sürüyor

25–26 Kas penceresinde FCC SpaceX’e 1 milyona kadar Starmind uydusu için koşullu lisans verdi (orbital AI veri merkezleri, 500-1002 km, ilk 2033’e, tam 2040’a; Amazon/Viasat itirazları reddedildi; Ars/BBC/Verge 25 Kas). Hürmüz AIS-görünür 25 Kas 6, 26 Kas sabah 0 (hormuz.now, restricted ~%8 normal). VIX 25 Kas kapanış ~28,3, 10Y ~%4,85. Nvidia Huang dönüşü sonrası selloff devam (25 Kas ~-%4), SEC/CA ofseti sürüyor. Amazon Decart önceki pencerede. Diğer 23 ad + darboğaz taramasında yeni IR/ajans eşiği yok. Dönemsel sıkılaşan darlık ayakta. Yarının testi: SpaceX ilk uydu detayı veya Hürmüz 20+.

## ⚡ Bugün işe yarayanlar

- **SpaceX Starmind:** FCC 1M uydu koşullu onay. Kim: orbital AI compute regülasyonu. Yarına: debris plan veya ilk fırlatma.
- **Hürmüz AIS düşük:** 25 Kas 6, 26 sabah 0. Kim: ofset yok. Yarına: 20+ veya resmi.
- **VIX / AI volatilite:** ~28,3 izleme, Nvidia selloff. Kim: AI çip sermaye riski. Yarına: kapanış.
- **ASML MATCH:** Hollanda hükümeti ABD MATCH bill’ini engellemeye çalışıyor. Kim: Çin çip ekipman. Yarına: NDAA sonucu.

## 🧭 Yön teyidi

Son dönemsel (29 Ağu–17 Eyl): **sıkılaşan darlık — yatay-aşağı ve dar**. Bugün: **ayakta, orbital compute regülasyonu açıldı, enerji kısıtı ve AI volatilite sürüyor**. Hürmüz/Çin/Loughton kısıtı devam. Geçersizleşme: (a) Aramco tam hat + Brent kalıcı <95; (b) Çin kargo + Hürmüz 50+ ve isabet durması; (c) hyperscaler capex kesimi veya bellek arz gevşemesi.

## 🧱 Hareket eden darboğaz

**humruz-ais:** kısıt teyidi devam (25 Kas 6, 26 sabah 0). **nvidia-yonetisim:** Huang geri, SEC/CA ofseti sürüyor. **hbm-cowos:** önceki. **ai-capex (güç/saha):** SpaceX Starmind orbital ofset denemesi. Diğerleri durağan.

## 💰 Sermaye

Yeni ATM / 8-K / 13D / PPA / kilit emilim yok. SpaceX FCC lisans regülasyon, sermaye değil. Kotasyon ≠ sermaye.

## 🌡️ Termometre

**5/18 YÜKSELMİŞ** · izlemede: getiri eğrisi (10Y ~%4,85), enflasyon (Eylül CPI %3,7 / PCE %3,4), VIX ~28,3. SP500 ~%7 rekor altı. Brent ~90-91 $. Termometre alarmı yok. Saha: Hürmüz kısıtı + SpaceX orbital onay + Nvidia ofseti.

## 📌 Koşullu sinyaller

1. Eğer SpaceX Starmind debris planı veya ilk uydu gecikirse → orbital ofset spekülasyon kalır. Geçersizleşme: IR/FCC detay.
2. Eğer Hürmüz 20 geminin altında kalırsa → kısıt tek gün değil. Geçersizleşme: günlük 50+ ve isabet durması.
3. Eğer VIX 30 üstüne çıkarsa → risk-off derinleşir. Geçersizleşme: <20 kapanış.
4. Eğer ASML MATCH bill NDAA’ya eklenirse → Çin ekipman kısıtı artar. Geçersizleşme: engellenmesi.
5. Eğer Nvidia SEC/CA suçlama netleşirse → yönetişim ofseti derinleşir. Geçersizleşme: kapanış.
