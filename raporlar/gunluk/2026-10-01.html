# Günlük Rapor — 1 Ekim 2026

*Economic Intelligence OS — pencere: 30 Eylül Çarşamba kapanış + 1 Ekim Perşembe sabah*

---

## 🔴 Tez: Micron HBM 2027 bit arzının çoğunu bağladı; PCE 3,4/çekirdek 3,0; 10Y ~%5,29; Hormüz ekstrem

Micron FQ4 IR: gelir 54,23 mlr $ (beklenti ~51); FQ1 kılavuz 61,5±1,5 mlr $ / düzeltilmiş EPS 38,15±1,00. HBM geliri şirket genelinden hızlı; takvim 2027 HBM bit arzının büyük kısmı anlaşmalı, fiyat 2026’ya göre belirgin yüksek; Nvidia ile ilk özel HBM uygulaması. PCE Ağustos yıllık %3,4 (beklenen ~%3,7), çekirdek %3,0 — eşik üstü ama sürpriz aşağı. 10Y ~%5,29 (Eylül ayı en sert yükselişlerden). Brent aktif kontrat ~97 $; Hormüz AIS ~%3–5 normal. Yanbu teyidi önceki pakette; Aramco resmi bülten yok. Dönemsel “sıkılaşan darlık” ayakta — bellek bacağı somutlaştı. Yarının testi: 9 Eki kilit öncesi emilim + Yanbu tanker ritmi + Ekim Fed fiyatlaması.

## ⚡ Bugün işe yarayanlar

- **Micron FQ4 + FQ1 + HBM 2027:** IR/CNBC; 26 SCA; 2027 bit arzı büyük ölçüde bağlandı. Kim: bellek darlığı kılavuz testi geçti. Yarına: fiyat artış hızının “ılımlı” dili vs bit kıtlığı.
- **PCE soğudu, getiri inmedi:** Reuters/BEA; yıllık %3,4 / çekirdek %3,0. Kim: enflasyon-getiri ayrışması. Yarına: 10Y %5,30 bandı.
- **Hormüz ekstrem sürüyor:** AIS ~4–5 gemi/gün vs ~85 barış. Kim: deniz kısıtı yerinde. Yarına: 50+ gemi bandı.
- **Brent aktif ~97 $:** Kasım vade 30 Eyl 103,50 kapandı; aktif Aralık geri. Kim: kısmi enerji gevşemesi. Yarına: Yanbu düzenli yükleme.

## 🧭 Yön teyidi

Son dönemsel (29 Ağu–17 Eyl): **sıkılaşan darlık — yatay-aşağı ve dar**. Bugün: **ayakta**. Micron HBM 2027 bağları darlık bacağını güçlendirdi; PCE sürprizi getiri yüksekliğini bozmadı; Hormüz ekstrem, kilit 9 Eki açık. Geçersizleşme: (a) Aramco teyitli tam hat + Brent kalıcı <95; (b) kilit güçlü emilim + Flight ritim; (c) hyperscaler capex kesimi.

## 🧱 Hareket eden darboğaz

- **hbm-cowos:** Micron 2027 HBM bit arzının büyük kısmı anlaşmalı; fiyat YoY yüksek. Durum: açık → hareket (darlık teyidi).
- **hat-dogu-bati / yanbu-yukleme:** önceki paket teyidi; yeni Aramco bülten yok. Durum: açık (kısmi).
- **humruz-ais:** 7g ort. ~%5 normal. Durum: açık.
- **spcx-kilit:** sonraki dilim 9 Eki. Durum: açık.

Jazan, Umman STS, bellek-abd açık; ai-capex-kilavuz durağan (kılavuz kesilmedi).

## 💰 Sermaye

Micron: 26 SCA imzalı; 2027 HBM bit arzı büyük ölçüde sözleşmeli (tutar IR’de toplanmadı). CHIPS nihai anlaşma imzası dile getirildi; yeni ATM/13D yok. Nvidia 150 mlr $ yetkisi önceki paket. Caterpillar Fabick önceki paket. Çekirdek 23 ad içinde yeni 8-K ATM / 13D / PPA eşiği yok.

## 🌡️ Termometre

**4/18 DÜŞÜK** · izlemede: getiri eğrisi (10Y ~%5,29), enflasyon (PCE %3,4 / çekirdek %3,0). VIX 16,34; Brent aktif ~97 $; TCMB toplam rezerv 174,4 mlr $ (18 Eyl haftası). Yeni alarm yok.

## 📌 Koşullu sinyaller

1. Eğer 2027 HBM fiyat/bit teslimatı tutulursa → bellek darlığı 2028’e uzar. Geçersizleşme: iptal/erteleme.
2. Eğer 10Y %5,30+ kalıcı olursa → finansman maliyeti capex anlatısını sıkıştırır. Geçersizleşme: PCE sonrası kalıcı geri çekilme.
3. Eğer Yanbu düzenli tanker ritmi tutulursa → enerji kısıtı bir kademe daha düşer. Geçersizleşme: tek seferlik program.
4. Eğer Hormüz 50+ gemi/gün bandına çıkarsa → deniz kısıtı gevşer. Geçersizleşme: AIS ekstrem sürer.
5. Eğer 9 Eki kilit emilimi zayıf kalırsa → arz baskısı ikinci bacak. Geçersizleşme: teslim + güçlü emilim.
