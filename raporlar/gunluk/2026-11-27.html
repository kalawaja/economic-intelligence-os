# Günlük Rapor — 27 Kasım 2026

*Economic Intelligence OS — pencere: 26–27 Kasım*

---

## 🔴 Tez: Nvidia Güneydoğu Asya sunucu sevkiyatını durdurdu (ABD ihracat kuralları) + S&P AA CreditWatch negatif (yönetişim) + Hürmüz 26 Kas 2 / 27 sabah 0 düşük — sıkılaşan darlık ayakta, ihracat kısıtı derinleşiyor, yönetişim ofseti devam, enerji kısıtı sürüyor

26–27 Kas penceresinde Nvidia, Dell ve Supermicro’ya Malezya, Singapur, Tayland ve Endonezya’ya sunucu sevkiyatını durdurma talimatı verdi (FT/Reuters 26 Kas; 19 Kas yürürlüğe giren ABD lisans kuralı, Çin yönlendirme yollarını kapatma). S&P Global Ratings 25 Kas’ta Nvidia’nın AA notunu CreditWatch negatif’e aldı (yönetişim/bağımsızlık; 90 gün içinde olası bir kademe indirim). Hürmüz AIS-görünür 26 Kas 2, 27 Kas sabah 0 (hormuz.now, restricted ~%7-8 normal). VIX 26 Kas kapanış ~26,8, 10Y ~%4,8. ASML MATCH direnci önceki. Diğer 23 ad + darboğaz taramasında yeni IR/ajans eşiği yok. Dönemsel sıkılaşan darlık ayakta. Yarının testi: Nvidia uyum detayı veya Hürmüz 20+.

## ⚡ Bugün işe yarayanlar

- **Nvidia SE Asya durdurması + S&P watch:** İhracat kısıtı + yönetişim ofseti. Kim: AI çip tedarik zinciri. Yarına: lisans/uyum veya not kararı.
- **Hürmüz AIS düşük:** 26 Kas 2, 27 sabah 0. Kim: ofset yok. Yarına: 20+ veya resmi.
- **VIX / getiri:** ~26,8 izleme, 10Y ~%4,8. Kim: risk-off baskısı. Yarına: kapanış.
- **ASML MATCH:** Hollanda direnci sürüyor, NDAA henüz yok. Kim: Çin ekipman. Yarına: oylama.

## 🧭 Yön teyidi

Son dönemsel (29 Ağu–17 Eyl): **sıkılaşan darlık — yatay-aşağı ve dar**. Bugün: **ayakta, ihracat kısıtı derinleşiyor, yönetişim ofseti ve enerji kısıtı sürüyor**. Hürmüz/Çin/Loughton devam. Geçersizleşme: (a) Aramco tam hat + Brent kalıcı <95; (b) Çin kargo + Hürmüz 50+ ve isabet durması; (c) hyperscaler capex kesimi veya bellek arz gevşemesi.

## 🧱 Hareket eden darboğaz

**humruz-ais:** kısıt teyidi devam (26 Kas 2, 27 sabah 0). **nvidia-ihracat / yonetisim:** SE Asya durdurması + S&P CreditWatch negatif. **hbm-cowos:** önceki. **ai-capex (güç/saha):** önceki. Diğerleri durağan.

## 💰 Sermaye

Yeni ATM / 8-K / 13D / PPA / kilit emilim yok. Nvidia durdurması uyum, sermaye değil. Kotasyon ≠ sermaye.

## 🌡️ Termometre

**5/18 YÜKSELMİŞ** · izlemede: getiri eğrisi (10Y ~%4,8), enflasyon (Eylül CPI %3,7 / PCE %3,4), VIX ~26,8. SP500 ~%8 rekor altı. Brent ~91-92 $. Termometre alarmı yok. Saha: Hürmüz kısıtı + Nvidia ihracat/yönetişim ofseti.

## 📌 Koşullu sinyaller

1. Eğer Nvidia SE Asya durdurması kalıcılaşır veya genişlerse → tedarik kısıtı derinleşir. Geçersizleşme: lisans/uyum açıklaması.
2. Eğer Hürmüz 20 geminin altında kalırsa → kısıt tek gün değil. Geçersizleşme: günlük 50+ ve isabet durması.
3. Eğer VIX 30 üstüne çıkarsa → risk-off derinleşir. Geçersizleşme: <20 kapanış.
4. Eğer S&P Nvidia notunu indirirse → yönetişim ofseti krediye yansır. Geçersizleşme: watch kalkması.
5. Eğer ASML MATCH bill NDAA’ya eklenirse → Çin ekipman kısıtı artar. Geçersizleşme: engellenmesi.
