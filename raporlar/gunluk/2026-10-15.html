# Günlük Rapor — 15 Ekim 2026

*Economic Intelligence OS — pencere: 14 Ekim Çarşamba seansı + 15 Ekim Perşembe sabah*

---

## 🔴 Tez: ASML 2027-28 arzı yetmeyecek; Hürmüz ve Çin ofseti teyitsiz, SpaceX borcu term sheet’siz

ASML 14 Eki Q3’te rekor €11,7 mlr satış ve 2026 kılavuzunu €44-45 mlr’ye yükseltti; planlı 2027-28 arzının talebi karşılamayacağını ve 2028 için ek kapasite araştırdığını söyledi. Hürmüz 14 Eki 10 ticari geçişle kısıtlı kaldı (15 Eki kısmi hâlâ düşük; normal ~74-85). Çin Ekim ~3,7 mn ton ürün izni iddiası 15 Eki’ye kadar resmi bülten veya kargo ile teyit edilmedi. SpaceX ~40 mlr $ Nvidia çip borcu görüşmesi term sheet veya imza olmadan sürüyor; sonraki kilit dilimi 24 Eki. Çekirdek 23 ad taramasında yeni imzalı sermaye olayı yok. Dönemsel “sıkılaşan darlık” ayakta: araç darboğazı teyit, ofset yok, borcu bağlanmadı. Yarının testi: Hürmüz 20+ veya Çin kargosu + ASML kapasite adımı.

## ⚡ Bugün işe yarayanlar

- **ASML kapasite uyarısı:** 14 Eki IR Q3 rekor + 2026 kılavuz yükseltme; 2027-28 planlı arz yetersiz, 2028 için ek artış araştırılıyor. Kim: EUV/High-NA araç darboğazı. Yarina: kapasite açıklaması veya sipariş.
- **Hürmüz kısıtı sürüyor:** 14 Eki AIS 10 geçiş; 15 Eki kısmi düşük. Kim: ürün ofseti yok. Yarina: günlük 20+ veya resmi açılış.
- **Çin izin teyitsiz:** 9 Eki Reuters tüccar; 15 Eki NDRC/kargo yok. Kim: dizel ofseti hâlâ iddia. Yarina: gümrük veya rıhtım.
- **SpaceX borç term sheet’siz:** ~40 mlr $ görüşme imzasız; 24 Eki dilimi bekleniyor. Kim: arz penceresi devam. Yarina: term sheet veya emilim.

## 🧭 Yön teyidi

Son dönemsel (29 Ağu–17 Eyl): **sıkılaşan darlık — yatay-aşağı ve dar**. Bugün: **ayakta, ofset yok, araç teyidi**. ASML 2027-28 arzı yetmeyecek. Çin izni ve Hürmüz kısıtı teyitsiz. SpaceX borcu bağlanmadı. 10Y 14 Eki kapanış ~%5,19. Geçersizleşme: (a) Aramco tam hat + Brent kalıcı <95; (b) Çin kargo + Hürmüz 50+ ve isabet durması; (c) hyperscaler capex kesimi.

## 🧱 Hareket eden darboğaz

**humruz-ais:** kısıt teyidi devam (14 Eki 10 geçiş, 15 Eki kısmi düşük). **cin-yakit-ihracat:** teyitsiz izin duruyor, kargo yok. **spcx-kilit:** 9 Eki dilimi emilim ölçümü zayıf negatif değil; sonraki 24 Eki. yanbu/jazan/umman-sts Aramco bülten yok. hbm-cowos ve ai-capex-kilavuz durağan (ASML araç uyarısı ayrı).

## 💰 Sermaye

İmzalı olay yok. ASML Q3’te devam eden geri alım (~€4,1 mlr) yeni sermaye değil. Çin izni ticaret politikası, şirket sermayesi değil. SpaceX kilit açılışı arz, yeni ihraç değil. ~40 mlr $ çip borcu term sheet’siz. Çekirdek 23’te yeni ATM / 13D / PPA / capex revizyonu yok.

## 🌡️ Termometre

**4/18 DÜŞÜK** · izlemede: getiri eğrisi (10Y 14 Eki kapanış ~%5,19), enflasyon (Eylül CPI %3,7 / PCE %3,4). VIX 14 Eki kapanış 16,87. Brent 14 Eki kapanış ~106,1 $, 15 Eki sabah ~104,4 $. TCMB brüt rezerv 25 Eyl 171,2 mlr $. Termometre alarmı yok. Saha: Hürmüz kısıtı sürüyor.

## 📌 Koşullu sinyaller

1. Eğer ASML 2028 kapasite artışı somutlaşmazsa → araç darboğazı 2027’ye kadar sürer. Geçersizleşme: IR kapasite adımı.
2. Eğer Hürmüz 20 geminin altında kalırsa → kısıt tek gün değil. Geçersizleşme: günlük 50+ ve isabet durması.
3. Eğer Çin kargosu yüklenmezse → 3,7 mn ton iddiası kota olarak kalır. Geçersizleşme: gümrük veya rıhtım teyidi.
4. Eğer SpaceX–Apollo term sheet imzalanırsa → Nvidia çip siparişi dış borç katmanına bağlanır. Geçersizleşme: görüşme dağılır.
5. Eğer 10Y kapanış kalıcı %5,30 üstüne çıkarsa → %5,19 bandı tek seanslık değil. Geçersizleşme: kalıcı %5,10 altı.
