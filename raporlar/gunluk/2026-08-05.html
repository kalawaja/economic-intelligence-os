# Günlük Rapor — 5 Ağustos 2026

*Economic Intelligence OS — Günlük haber akışı ve istihbarat özeti*

---

## 🔴 Günün Öne Çıkanı: Rekorların Gölgesinde "Capex Cezası" — AMD ve SpaceX Gelirde Şaşırttı, Harcamada Cezalandırıldı

Salı günü Wall Street, Hürmüz anlaşması beklentisiyle yeni rekorlar kırdı: **S&P 500 +%1,79 ile 7.736,52, Dow +%1,71 ile 54.085,88 (rekor), Nasdaq +%2,59 ile 26.584,99**. Petrol %6'dan fazla düşerek **WTI 75,32 $**'a geriledi; Hazine Bakanı Bessent "Hürmüz anlaşması günler içinde, belki yarın" dedi. Palantir, dünkü bilançosunun ardından günü **+%29,45** ile kapattı.

Ancak kapanış sonrası açıklanan iki bilanço, piyasanın yeni refleksini netleştirdi: **gelir rekoru artık yetmiyor, sermaye harcaması (capex) cezalandırılıyor.**

**AMD çift taraflı beklenti aştı ama düştü:** Q2 geliri **11,54 milyar $ (+%52; beklenti 11,28 milyar $)**, düzeltilmiş EPS **1,66 $** (beklenti 1,62 $), veri merkezi geliri **6,7 milyar $ (+%107**, toplam gelirin %58'i). Net kâr 872 milyon $'dan **2,3 milyar $**'a çıktı; Q3 öngörüsü **12,7-13,3 milyar $** (orta nokta 13 milyar $, konsensüs 12,5 milyar $). Buna rağmen hisse, gün içi +%7'lik rallinin ardından seans sonrası **~%8 düştü (~486 $)**. Neden: brüt marj %54 ile %56'lık beklentiyi ıskaladı; CFO Jean Hu, OpenAI/Oracle/Meta'ya bu çeyrek sevkiyatı başlayan **Helios raf sistemlerinin rampasının kısa vadede marjı baskılayacağını** söyledi. Capex bir yılda 282 milyon $'dan **808 milyon $**'a çıktı. Lisa Su: sunucu geliri 2026'nın ikinci yarısında yıllık +%80'in üzerinde büyüyecek, veri merkezi adetleri 2027'de ikiye katlanacak.

**SpaceX'in ilk halka açık bilançosu aynı kalıba oturdu:** Q2 geliri **7,8 milyar $ (+%92; beklenti 6,9 milyar $)**, FAVÖK üç katına çıktı. Kırılım: Starlink **4,3 milyar $ (+%66, 12 milyon abone, +1,7 milyon net)**, AI/compute **2,6 milyar $ (+%247**; Anthropic ve Google'a kapasite kiralama), roket **962 milyon $**. Ama capex **18,4 milyar $** ile analist beklentisinin (13,2 milyar $) çok üstüne çıktı — **16 milyar $'ı AI compute altyapısına**. Hisse seans sonrası **%5-8 düştü**; Musk'ın 1 trilyon $ yıllık gelir hedefini 2031'den 2030'a çekmesi ve "Ay'da robot fabrikaları" anlatısı dengeyi kuramadı. Kritik eşik yarın: **6 Ağustos'ta ~911,5 milyon halka arz öncesi hisse (~116 milyar $) satışa açılıyor.**

Alphabet ve Tesla'yla başlayan "capex cezası" kalıbı, artık hem çip tedarikçisini (AMD) hem de en yeni halka açık AI oyuncusunu (SpaceX) kapsıyor. Asya bu sabah tersine döndü: **Kospi +%3,76 ile 6.598,26** (Samsung +%2,5, SK Hynix +%5,77), **Nikkei +%3,66**; SoftBank Group, iştirakinin güçlü bulut/AI sonuçlarıyla **+%13,96** sıçradı.

→ *Modül ilgisi: Financial Power (5), AI Ecosystem (6), Semiconductor (7), Risk Engine (23), Timeline Engine (24)*

## 💰 Finansal Güç: Hürmüz İyimserliği Rekor Getirdi, JOLTS Soğuk Sinyaller Verdi

- **4 Ağustos ABD kapanışı:** S&P 500 7.736,52 (+%1,79), Dow 54.085,88 (+%1,71, rekor), Nasdaq 26.584,99 (+%2,59). Altın +%1 ile 4.075 $; 10 yıllık tahvil faizi 4,61'e geriledi (−7 baz puan). Palantir +%29,45; Caterpillar rekor çeyrek geliriyle +%5,6.
- **JOLTS (Haziran, 4 Ağustos'ta açıklandı):** Açık pozisyonlar 7,54 milyondan **7,36 milyona** düştü; işe alımlar 5,3 milyon, işten çıkarmalar 1,8 milyonla yatay. 2026'da aylık istihdam artışı ortalaması ~92 bin — göç kısıtları ve emeklilik dalgası nedeniyle ekonomistler "başabaş istihdam eşiğinin sıfıra yakın olabileceğini" tartışıyor; bu, Cuma günkü tarım dışı istihdam verisinin (konsensüs ~85 bin) yorumunu zorlaştıran bir çerçeve.
- **Takvim:** Bugün ABD hizmet PMI; yarın SpaceX lockup açılışı; Cuma Temmuz istihdam raporu — Eylül faiz artırımı fiyatlaması için haftanın ana verisi.

→ *Modül ilgisi: Financial Power (5), Timeline Engine (24), Risk Engine (23)*

## 🤖 AI Ekosistemi: Uygulama Katmanı Rallisi Sürüyor, Ajan Hukukunda Dönüm Noktası

- **Palantir etkisi ikinci gününde:** +%29,45'lik kapanış, pazartesi seans sonrası +%13'lük tepkinin çok üzerine çıktı — "model fiyatları düşerken uygulama katmanı kazanıyor" tezi piyasa genelinde fiyatlanıyor. AMD'nin +%107'lik veri merkezi büyümesi, dün akşam beklenen "donanım katmanı teyidi"ni de getirdi; sorun talepte değil, marj/capex dengesinde.
- **9. Temyiz Mahkemesi'nden AI ajan emsali (4 Ağustos):** Mahkeme, Amazon'un Perplexity'nin **Comet** alışveriş ajanını engelleyen alt mahkeme tedbirini bozdu. Gerekçe: CFAA (Bilgisayar Dolandırıcılığı ve Kötüye Kullanımı Yasası) kapsamında Amazon'un sistemlerine "erişen" bot değil, **ajanı kullanan kullanıcının kendisi** — 40 yıllık anti-hacking yasasının otonom ajanlara uygulanamayacağı yönündeki ilk federal temyiz kararı. Comet, Amazon'da yeniden çalışabilecek; dava diğer talepler yönünden sürüyor. Agentic commerce (ajan tabanlı ticaret) için platform kontrolünü zayıflatan, ajan geliştiricilerini güçlendiren bir emsal.
- **SoftBank bulut/AI teyidi:** SoftBank Corp'un ilk çeyrek sonuçlarında bulut ve AI geliri **+%31** büyüdü, kâr +%27,5 arttı; şirket önümüzdeki yıllar için bulut/AI'da ~%30 bileşik yıllık büyüme öngördü. SoftBank Group hissesi Tokyo'da +%13,96 ile rallinin motoru oldu.

→ *Modül ilgisi: AI Ecosystem (6), Political Influence (4), Financial Power (5)*

## 🔬 Yarıiletken: Kore Toparlandı, SK Hynix–SanDisk "HBF" ile Yeni Bellek Cephesi Açtı

- **Kore beşinci günde yön değiştirdi:** Kospi +%3,76 ile 6.598,26; **Samsung +%2,5 (246.000 won), SK Hynix +%5,77 (1.668.000 won)**; Kioxia +%4,24. Beş günlük sekans: −%11 / +%17,9 / −%4,9 / −%1,7 / **+%3,76**. Tetikleyici yeni bir bellek sinyali değil, Nasdaq'ın +%2,59'luk momentumu — dünkü raporda işaretlenen **bellek spot fiyatlarındaki gerileme sorusu henüz yanıtlanmadı**, oynaklık rejimi teyit edilmiş durumda.
- **HBF standardı (FMS 2026):** SK Hynix ve SanDisk, AI çıkarım (inference) yükleri için NAND tabanlı **High Bandwidth Flash (HBF)** standardının ilk teknik spesifikasyonunu OCP (Open Compute Project) üzerinden yayımladı; Google ve Tenstorrent konsorsiyuma katıldı. HBF, HBM ile SSD arasındaki kapasite/bant genişliği boşluğunu hedefliyor — bellek kıtlığı tezinin ortasında, HBM-dışı yeni bir değer katmanı ve iki şirket için standart-koyucu avantajı.
- **AMD'nin marj mesajı sektöre sinyal:** Helios rampasının marj baskısı, AI hızlandırıcı gelir karmasının "önce hacim, sonra kârlılık" evresine girdiğini gösteriyor — Nvidia dışı tedarikçilerin fiyatlama gücü sorusu 19 Ağustos'taki Nvidia bilançosuna kadar açık kalacak. *(Nvidia bilanço tarihi teyit gerektirir)*

→ *Modül ilgisi: Semiconductor (7), AI Ecosystem (6), Supply Chain (22), Risk Engine (23)*

## ⚡ Enerji: Petrol 75 $'a İndi — "Anlaşma Günler İçinde" Ama Metin Henüz Teyitsiz

- **WTI %6'dan fazla düşüşle 75,32 $** — üç günde ~%11'lik gerileme. Bessent: ABD-İran Hürmüz anlaşması "günler içinde, belki yarın" gelebilir. Trump müzakereleri İran için "son şans" olarak niteledi.
- Pakistan'ın arabuluculuğuyla **anlaşma metninin hazır olduğu ve İran'ın "nihai istişare" yürüttüğü** bildiriliyor *(teyit gerektirir — tek kanal, resmi açıklama yok)*. Dünkü raporun tespiti geçerli: pazarlığın düğümü boğazın kimin kontrolünde, geçiş ücretini kimin toplayacağı.
- Petrol düşüşü enflasyon görünümü üzerinden hisse rallisini besledi; ancak boğaz fiilen kapalı kaldıkça bu fiyatlama anlaşma haberine endeksli ve geri dönüşe açık. Veri merkezi capex dalgasının enerji maliyet varsayımları için yön hâlâ belirsiz.

→ *Modül ilgisi: Energy Network (8), Financial Power (5), Risk Engine (23)*

## 🛡️ Savunma ve Uzay: SpaceX'in İlk Karnesi — Roket Şirketi Değil, AI Altyapı Şirketi

- Bilançonun yapısal mesajı gelir kırılımında: **Starlink 4,3 milyar $ + AI/compute 2,6 milyar $ = gelirin %88'i**; roket işi 962 milyon $ ile artık üçüncü sırada. İkinci yarı için **6,7 milyar $'lık bulut/compute sözleşmesi** imzalanmış durumda (Anthropic ve Google başta) — SpaceX, yörünge kapasitesini AI compute kiralamasına bağlayan ilk büyük oyuncu.
- **Yarınki lockup açılışı sistemik test:** ~116 milyar $'lık potansiyel arz, zayıf geçen ilk bilançonun iki gün ardından geliyor. Dünkü raporun uyarısı geçerli: emilim zayıf kalırsa 2026 IPO dalgasının (CXMT sonrası, olası OpenAI) fiyatlama disiplini sertleşir.

→ *Modül ilgisi: Defense & Space (9), AI Ecosystem (6), Financial Power (5), Risk Engine (23)*

## 🔀 M&A Akışı: EA'nın 55 Milyar $'lık Özelleşmesi Tamamlandı

- **Electronic Arts'ın 55 milyar $'lık go-private (özelleşme) işlemi 4 Ağustos'ta kapandı** — tarihin en büyük kaldıraçlı satın alması. Nihai yapı: **Suudi Arabistan Kamu Yatırım Fonu (PIF) %93,4, Silver Lake %5,5, Affinity Partners (Jared Kushner) %1,1**; bilançoya ~20 milyar $ borç biniyor. Tüm düzenleyici onaylar (AB Komisyonu dahil) 30 Temmuz itibarıyla alınmıştı.
- Stratejik okuma: körfez sermayesinin ABD teknoloji/medya varlıklarındaki kontrol iştahı — Trump Media veri servisi ve PIF'in spor yatırımlarıyla birlikte — enformasyon ve eğlence altyapısında jeopolitik sahiplik sorusunu büyütüyor.

→ *Modül ilgisi: Financial Power (5), Political Influence (4), M&A Flow (12)*

## ⚖️ Politika ve Regülasyon: Sanayi Politikası Ham Maddeye İniyor — Polisilikon Taban Fiyatı

- **Reuters (4 Ağustos, özel haber):** Trump yönetimi, çip ve güneş paneli ham maddesi **polisilikon** ithalatına **asgari ithalat fiyatı + tarife** karmasından oluşan hibrit bir sistem hazırlıyor; yasal dayanak Section 232 (ulusal güvenlik), karar ay içinde bekleniyor. Çin, küresel güneş üretim kapasitesinin ~%80'ini kontrol ediyor; korunacak yerli üreticiler Hemlock Semiconductor (Corning–Shin-Etsu ortaklığı, Michigan) ve Wacker'ın Tennessee tesisi. Geçen haftaki CHIPS-hissedarlık modeliyle birlikte okunmalı: federal sanayi politikası çipten sonra **malzeme katmanına** genişliyor; güneş ve yarıiletken maliyet zincirlerinde yeni fiyat tabanı riski.
- 25 eyaletin Section 301 davasında yeni gelişme yok; dosya tarife rejiminin ikinci yargısal testi olarak takipte.

→ *Modül ilgisi: Political Influence (4), Supply Chain (22), Semiconductor (7), Energy Network (8)*

## 📌 Risk Engine Notları (Bugünün sinyalleri)

1. **"Capex cezası" artık rejim:** Alphabet, Tesla, AMD ve SpaceX — dört bilanço aynı kalıp: gelir beklenti üstü, hisse capex/marj endişesiyle satılıyor. Piyasa AI yatırım döngüsünü büyüme hikâyesinden nakit disiplini hikâyesine çevirdi; bu, capex'i gelire çeviremeyen oyuncular için değerleme riskini öne çekiyor. İzleme: yarınki SpaceX lockup emilimi bu rejimin ilk stres testi.
2. **Hürmüz fiyatlaması tek yönlü ve kırılgan:** Rekor endeksler + %6 düşen petrol, "anlaşma günler içinde" varsayımına yaslanıyor; metin teyitsiz, boğaz fiilen kapalı. Müzakere Cuma istihdam verisinden önce çökerse, enerji şoku ve faiz fiyatlaması aynı anda ters döner — haftanın en asimetrik riski.
3. **Kore rallisi momentum, sinyal değil:** +%3,76'lık toparlanma ABD momentumundan geldi; bellek spot fiyatlarındaki gerileme sorusu açık. Spot zayıflığı sözleşme fiyatlarına sızarsa "2028'e kadar kıtlık" tezinin ilk revizyonu hâlâ masada — beş günlük ±%4-18'lik salınım rejimi pozisyon riskini büyütmeye devam ediyor.
4. **AI ajan hukuku platform dengesini değiştirdi:** 9. Daire'nin CFAA kararı, ajan trafiğini engellemek isteyen platformların elini zayıflattı. Kısa vadede agentic commerce girişimlerine (Perplexity, OpenAI Operator türevleri) alan açılıyor; orta vadede platformlar savunmayı hukuktan teknik bariyere ve ücretli API'lere kaydıracak — Trump Media'nın veri feed'i modelinin genelleşmesi riski.
5. **HBF, bellek savaşında standart-koyucu hamle:** SK Hynix–SanDisk'in OCP spesifikasyonu, AI çıkarım katmanında HBM-dışı yeni bir pazar tanımlıyor; Google ve Tenstorrent'in katılımı hiperölçekleyici talebinin sinyali. CXMT'nin DRAM tarafındaki yükselişine karşı, standart ve ekosistem kontrolü Kore-ABD ekseninde kalıyor.
