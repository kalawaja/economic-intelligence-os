5. **SpaceX kilidi yarın — arz düşükken fiyat keşfi kırılgan:** 319 mn hisse serbest kalıyor; hisse kilit arifesinde −%2,9 (141,94 $) ve float'un %80'i 23 yatırımcıda. İlk tranş deneyimi "unlock ≠ arz" dedi; ama bu kez makro fon (30Y %5,33 + tekno satışı) kilitle aynı haftada. İzleme: 20-24 Ağu hacim profili + 150 $ yerine 135 $ IPO fiyatı referansının test edilip edilmediği; Alphabet'in 551 mn hisselik bloğu üzerinden dolaylı maruziyet sürüyor.
