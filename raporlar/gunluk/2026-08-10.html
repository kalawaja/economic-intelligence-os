# Günlük Rapor — 10 Ağustos 2026

*Economic Intelligence OS — Günlük haber akışı ve istihbarat özeti (Pazartesi koşusu: 8 Ağustos 14:00 UTC sonrası + hafta sonu)*

---

## 🔴 Günün Öne Çıkanı: Masada Pazarlık, Sahada Tırmanış — Husiler Aramco'nun Jazan Rafinerisini Vurdu, Pentagon'dan Cephanelik Alarmı; Piyasa Yine de İndirim Rallisinde

Hafta sonu, Hürmüz sürecinin iki yüzünü aynı karede gösterdi. **Masada:** İran Dışişleri Bakanı Abbas Erakçi Pazar günü şartları ağırlaştırdı — boğaz, ABD **yaptırımları gevşetmeden ve savaş tazminatı ödemeden** açılmayacak; Tahran ayrıca geçiş trafiğinin kontrolünü istiyor. Trump cephesinin tanımı ise "yalnızca **yarı-müzakere** ediyoruz". Cuma "yakın" denilen imza, Pazartesi sabahı hâlâ yok; geçişler 4-6 Ağustos'ta günde **8-15 gemi** düzeyinde (savaş öncesi ~130).

**Sahada:** Pazar sabahı Husiler, **Suudi Aramco'nun Jazan rafinerisini İHA ile vurdu** — yangın çıktı ve söndürüldü, yaralanma bildirilmedi; ama bu, savaşın başından beri **Aramco tesislerine ilk doğrulanmış saldırı** ve Mekke üçlü savunma paktının imzasından yalnızca iki gün sonra geldi: paktın ilk stres testi. Aynı gün Husiler, Yemen'in Mokha limanındaki Suudi unsurlara balistik füze ve İHA'larla saldırdı; en az **7 ölü** ve liman altyapısında ciddi hasar bildirildi.

Üçüncü katman ABD'den: **Pentagon 2 No'lu ismi Steve Feinberg'in savunma şirketlerine gönderdiği mektup** hafta sonu ortaya çıktı — beş aylık İran savaşı stokları eritti: **Patriot önleyicileri savaş öncesi 2.330'dan ~759-827'ye (en az −%65), THAAD 452'den 234-278'e** düştü. Feinberg şirketlere hızlandırılmış üretim planı için **21 gün** verdi: "Yıllar süren geliştirme döngüleri kabul edilemez." Pentagon sözcüsü Parnell mektubun gerçek olduğunu doğruladı; talepler 2028 mali yılı bütçe teklifine (1,5 trilyon $ tartışması Kongre'de tıkalı) işlenecek.

Piyasa ise bu tabloya rağmen istihdam şokunun bıraktığı "faiz indirimi" rejimiyle haftaya güçlü başladı: **Kospi +%1,72 ile 6.366,71** (SK Hynix +%3,09, Samsung +%2,60), **Nikkei +%1,10 ile 66.329,75**; **Ekim vadeli Brent 84,43 $** (04:30 GMT, +%1'in üzerinde). Haftanın menteşesi Çarşamba günkü **Temmuz CPI**.

→ *Modül ilgisi: Energy Network (8), Defense & Space (9), Financial Power (5), Risk Engine (23), Timeline Engine (24)*

## 💰 Finansal Güç: Enflasyon Haftası — "Kötü Haber = İyi Haber" Rejimi Çarşamba Sınavda

- **Takvim:** Çarşamba **Temmuz CPI**, Perşembe **PPI**, Cuma **perakende satışlar**. Konsensüs hem manşet hem çekirdek CPI'da **aylık +%0,2**. Kritik asimetri: BofA'dan Stephen Juneau'ya göre beklentiye uygun bir veri bile "Fed'in Eylül'de artırım tezini güçlendirir" — yani istihdam şokunun ürettiği güvercin fiyatlama (Eylül artırımı Cuma itibarıyla ~%44), sıcak olmayan bir CPI ile bile geri sarabilir *(Pazartesi güncel FedWatch değeri; teyit gerektirir)*.
- **Asya-Avrupa açılışı risk iştahlı:** Kospi ve Nikkei %1+ yükseldi; Cuma ABD kapanışının (S&P 7.757,64 rekor) devamı fiyatlanıyor. Altın Cuma 4.375,80 $ ile zirve bölgesindeydi; Pazartesi Asya seansında değerli metaller alıcılıydı *(seans içi veri; teyit gerektirir)*.
- **Tahvil cephesinde soru:** İstihdam sonrası %4,64'e gerileyen 10 yıllık getiri, CPI sıcak gelirse "zayıf büyüme + inatçı enflasyon" kombinasyonunu fiyatlamak zorunda kalacak — hisse çarpanı için en zor senaryo bu.

→ *Modül ilgisi: Financial Power (5), Timeline Engine (24), Risk Engine (23)*

## 🤖 AI Ekosistemi: Altyapı Bilanço Turu Başlıyor; Google'da Nöbet Değişimi (Gecikmeli Kayıt)

- **Bu hafta AI altyapısının "ikinci kademe" bilançoları var:** Nebius, Cerebras, CoreWeave ve Applied Materials Çarşamba-Perşembe açıklıyor. Yatırımcı kabulü şimdiden ayrışmış durumda — Nebius yıl başından beri **+%122**, Cerebras **−%35**: aynı sektörde iki uç, "AI altyapı talebi güçlü ama değerleme disiplini şirket bazında" tezinin test alanı.
- **Gecikmeli kayıt (6 Ağustos):** Google, AI liderliğini yeniden düzenledi — **Demis Hassabis Google DeepMind CEO'luğundan Chair rolüne geçti; günlük yönetim Koray Kavukcuoglu'na** (Kıdemli Başkan Yardımcısı, AI ürün geliştirme) devredildi. Aynı günlerde **Jeff Dean** (27 yıl sonra) ve Sanjay Ghemawat, Quoc Le, Oriol Vinyals gibi isimler Google'dan ayrılıp bilimsel keşif döngüsünü otomatikleştirmeyi hedefleyen **Discovery Loop** girişimini kurdu; **Google kurucu yatırımcı** olarak katıldı. Harita okuması: en kıdemli AI araştırma katmanı, büyük laboratuvarlardan misyon-odaklı girişimlere sıçramaya devam ediyor — Alphabet bu kez sermayesiyle içeride kalmayı seçti.

→ *Modül ilgisi: AI Ecosystem (6), Financial Power (5), Risk Engine (23)*

## 🔬 Yarıiletken: TSMC Temmuz'da +%45 — Talep Tarafı Türbülansı Umursamıyor; Kore Rallide

- **TSMC'nin Temmuz satışları yıllık ~%45 arttı** (Bloomberg, 10 Ağustos): bellek oynaklığına ve "capex cezası" tartışmalarına rağmen AI donanım harcaması üretim tarafında hız kesmiyor. Şirketin IR sayfasında Temmuz tablosu henüz yayımlanmadı; kesin NT$ tutarı *(teyit gerektirir)*.
- **Kore haftaya toparlanmayla başladı:** Kospi **+%1,72 ile 6.366,71**; **SK Hynix +%3,09 (1.466.000 won)**, **Samsung +%2,60 (237.000 won)**, Kioxia +%0,57; SoftBank Group **−%2,40**. Dokuz günlük sekans: −%11 / +%17,9 / −%4,9 / −%1,7 / +%3,76 / −%4,59 / +%1,8→kapanışta zayıflama / −%0,60 / **+%1,72**. Cuma kapanışındaki "yabancı yeniden satıcı" düzeltmesinden sonra bu sabahki rallinin akış teyidi (yabancı net alım verisi) henüz yok *(teyit gerektirir)* — tasfiye-bitti tezi hâlâ fiyatla değil akışla doğrulanmalı.

→ *Modül ilgisi: Semiconductor (7), AI Ecosystem (6), Supply Chain (22), Financial Power (5), Risk Engine (23)*

## ⚡ Enerji: Brent 84 $ Üzeri — İran Şart Listesini Uzattı, Jazan Saldırısı Arz Riskini Rafineriye Taşıdı

- **Ekim vadeli Brent 84,43 $** (Pazartesi 04:30 GMT; günde +%1'in üzerinde) — savaşın başladığı Şubat sonundan bu yana birikimli artış ~%16. Analist Tim Waterer: "Somut ilerleme yokluğu fiyatta risk primini tutuyor."
- **İran'ın şartları ağırlaştı:** Erakçi Pazar günü açılışı **yaptırım gevşetmesi + savaş tazminatı** koşuluna bağladı; Tahran ayrıca geçiş trafiği üzerinde kontrol istiyor — uluslararası deniz hukukunun transit geçiş ilkesiyle doğrudan çelişen bir talep. Şubat'tan beri boğaz bölgesinde **64 şiddet içeren denizcilik olayı ve 17 can kaybı** kayıtlı; Cumartesi günkü ADNOC tanker saldırısını BAE resmen kınadı.
- **Jazan saldırısı arz riskinin adresini genişletti:** Bugüne dek tanker ve liman odaklı olan saldırı seti, ilk kez büyük bir **rafineri kompleksini** (Jazan, ~400 bin varil/gün kapasite bölgesi) hedef aldı. Hasar sınırlı görünse de mesaj fiyatlama açısından önemli: Hürmüz anlaşması imzalansa bile Kızıldeniz-Yemen ekseni ayrı bir arz risk kanalı olarak açık *(kapasite etkisi; teyit gerektirir)*.

→ *Modül ilgisi: Energy Network (8), Financial Power (5), Risk Engine (23)*

## 🛡️ Savunma ve Uzay: Feinberg Mektubu — "Savaş Ekonomisi" Resmî Belgeye Döküldü; Mekke Paktının Ayrıntıları Netleşti

- **Pentagon mektubunun mimarisi:** Feinberg savunma sanayiine **21 gün** içinde hızlandırılmış üretim ve kapasite genişletme planı sunma talimatı verdi; öncelik füze savunması (Patriot, THAAD) ve mühimmat. Stok erimesi tablosu (Patriot −%65+, THAAD −%38+) beş aylık savaşın maliyetini ilk kez resmî rakamla belgeliyor. Trump ise Truth Social'da kıtlık haberlerini reddetti ("devasa miktarlarda üretiliyor") — yönetim içi mesaj uyumsuzluğu, 1,5 trilyon $'lık bütçe pazarlığında Kongre tıkanıklığıyla üst üste biniyor. Sipariş döngüsü okuması: Lockheed (Patriot PAC-3), RTX (Patriot radar/önleyici) ve Northrop için çok yıllı kapasite sözleşmeleri sinyali — "savunma neo-prime" temasının klasik primleri.
- **Mekke paktı ayrıntıları:** Resmî çerçeve **"birine yapılan silahlı saldırı üçüne yapılmış sayılır"** maddesini içeriyor; kapsam istihbarat paylaşımı, savunma sanayii koordinasyonu, kapasite inşası ve enerji işbirliği. Pakistan "tamamen savunma amaçlı ve başka ülkelere açık" dedi; Türkiye "belirli bir aktöre yönelik değil" vurgusu yaptı. Pakistan'ın nükleer kapasitesi nedeniyle analistler paktı bölgesel caydırıcılık mimarisinde yapısal kayma olarak okuyor. İran'dan resmî tepki yok (bir milletvekili "güvenlik dilenilmez" dedi); ABD ve İsrail sessiz. **İlk test 48 saat içinde geldi:** İran destekli Husilerin Jazan saldırısı, paktın caydırıcılık iddiasını imza haftasında sınıyor.

→ *Modül ilgisi: Defense & Space (9), Political Influence (4), Energy Network (8), Risk Engine (23)*

## 🔀 M&A Akışı: AMD, Taalas'ı Aldı (Gecikmeli Kayıt) — "Modeli Silikona Göm" Yarışı Konsolidasyona Başladı

- **Gecikmeli kayıt (6 Ağustos):** AMD, AI modellerini doğrudan silikona "kazıyan" (hardwired inference) Toronto merkezli çip girişimi **Taalas'ı satın aldı**; tutar açıklanmadı. Taalas'ın iddiası, özelleşmiş donanımda ~17.000 token/sn çıkarım hızı *(şirket iddiası; teyit gerektirir)*. Stratejik okuma: Musk'ın "yalnızca Nvidia" kararıyla adreslenebilir pazarı daralan AMD, genel amaçlı GPU yarışının yanına **model-özel ASIC** kulvarı ekliyor — çıkarım maliyeti savaşında (tema: AI fiyat savaşı) dikey uzmanlaşma hamlesi. Apollo-easyJet cephesinde yeni gelişme yok; hafta sonu büyük ölçekli yeni işlem duyurusu gelmedi.

→ *Modül ilgisi: M&A Flow (12), Semiconductor (7), AI Ecosystem (6), Financial Power (5)*

## 📌 Risk Engine Notları (Bugünün sinyalleri)

1. **Çarşamba CPI çift taraflı kırılma noktası:** Sıcak veri hem Eylül artırımını geri getirir hem de "zayıf istihdam + inatçı enflasyon" kombinasyonuyla hisse çarpanını vurur; beklentiye uygun +%0,2 bile (Juneau) artırım tezini canlandırabilir. İstihdam şokuyla kurulan güvercin rejim tek veriyle kuruldu — tek veriyle yıkılabilir. Pazartesi Asya rallisi bu riski fiyatlamıyor.
2. **Hürmüz'de şart enflasyonu:** İran'ın talep seti genişliyor (yaptırım gevşetmesi + tazminat + trafik kontrolü) — bu, anlaşmanın fiyatlanmış "yakınlığı" ile gerçekleşme olasılığı arasındaki makası açıyor. Geçişler hâlâ 8-15 gemi/gün; yeni bir tanker/tesis olayında petrolde yukarı asimetri, imzada ise aşağı yön sınırlı (koridor beklentisi zaten fiyatta).
3. **Jazan, arz riskinin adres değişikliği:** Saldırı seti tanker-liman ekseninden ilk kez büyük rafineri kompleksine genişledi ve Mekke paktının imza haftasında geldi. Husi kanalı, Hürmüz anlaşmasından bağımsız bir eskalasyon değişkeni — pakt "üçe saldırı" maddesinin vekil saldırılarda nasıl yorumlanacağı, bölgesel güvenlik temasının ana belirsizliği.
4. **Feinberg mektubu savunma tedarik zincirinde rejim sinyali:** 21 günlük plan talebi + stok erimesi rakamları, çok yıllı kapasite sözleşmeleri döngüsünün (Lockheed, RTX, Northrop) resmî başlangıcı olarak okunabilir. Fren: 1,5 trilyon $ bütçe teklifinin Kongre'de tıkalı olması — sipariş sinyali ile ödenek gerçekliği arasındaki gecikme, sektör fiyatlamasında oynaklık üretir.
5. **TSMC +%45, bellek oynaklığının karşı kanıtı:** Üretim tarafındaki momentum, "AI talebi kırıldı" okumasını desteklemiyor; Kore'deki türbülans talep değil beklenti-fiyatlama sorunu olarak kalmayı sürdürüyor. İzleme: Pazartesi Kore rallisinin yabancı akış teyidi ve bu haftaki Nebius/Cerebras/CoreWeave/AMAT sonuçlarının capex zincirine yansıması.
