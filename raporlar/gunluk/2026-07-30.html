# Günlük Rapor — 30 Temmuz 2026

*Economic Intelligence OS — Günlük haber akışı ve istihbarat özeti*

---

## 🔴 Günün Öne Çıkanı: Big Tech Bilançolarında "AI Para Kazandırıyor mu?" Ayrışması

Aynı gece açıklanan iki bilanço, AI harcamalarının piyasada nasıl iki farklı hikâyeye dönüştüğünü gösterdi:

**Microsoft (+%15,5):** Gelir 90 milyar $ (+%18), EPS 4,74 $ (beklentinin 0,50 $ üzerinde). **Azure +%43 büyüdü ve yıllık 100 milyar $ geliri aştı.** Sipariş birikimi (backlog) %84 artışla **678 milyar $**'a ulaştı. Capex 175 milyar $; CFO Amy Hood 2027 mali yılında da pozitif serbest nakit akışı bekliyor. Piyasa mesajı: AI altyapı harcaması *dışarıya satılan* gelire dönüşüyor.

**Meta (−%10):** Gelir %28 artışla 60,8 milyar $'a çıktı ama EPS beklentiyi 1,02 $ ıskaladı; faaliyet marjı 12 puan düşüşle %31'e geriledi, **serbest nakit akışı %81 düşüşle 784 milyon $'a çöktü**. Yıllık gider öngörüsü 4 milyar $ artırılarak 169 milyar $'a çıkarıldı; CFO Susan Li 2027 capex'i için rakam vermeyi reddetti. Reality Labs çeyrekte 4,6 milyar $ zarar yazdı. Piyasa mesajı: dış gelire dönüşmeyen *içsel* AI harcaması artık cezalandırılıyor.

Nasdaq %2,47 yükselerek Fed satışının ardından toparlandı; teknoloji sektörü %4,31 primli.

→ *Modül ilgisi: Corporate Network (1), AI Ecosystem (6), Risk Engine (23)*

## 💰 Finansal Güç: Fed Faizi Sabit Tuttu — Üç Şahin Muhalefet

Dünkü raporda beklenen FOMC kararı netleşti: **Faiz %3,50-3,75 aralığında sabit** (üst üste beşinci toplantı). Kritik detay muhalefetin yönü: **Hammack, Kashkari ve Logan 25 baz puan ARTIRIM istedi** — 2026'nın alışılmadık teması doğrulandı; piyasalar yıl sonuna kadar **iki 25 baz puanlık artırım** fiyatlıyor.

Aynı sabah açıklanan **2. çeyrek GDP: %1,5** (beklenti %1,8). Tüketici harcaması güçlü (+%3,2), asıl çarpıcı olan **iş yatırımlarında AI kaynaklı +%8,4 artış** — Fed Başkanı Kevin Warsh bunu "en dikkat çekici unsur" olarak niteledi. Çekirdek PCE %3,3'te yapışkan; manşet PCE yıllık %3,7. Tablo: AI capex büyümeyi taşıyor, enflasyon hedefin üzerinde, Fed artırım tarafına yatık.

→ *Modül ilgisi: Financial Power (5), Timeline Engine (24)*

## 🤖 AI Ekosistemi: IPO Yarışı Kızışıyor

- **Anthropic vs OpenAI halka arz yarışı:** Anthropic'in bankaları yatırımcı toplantıları ayarlamaya başladı — mega-IPO'da OpenAI'ın önüne geçme stratejisi izleniyor. Anthropic'in gelir koşu hızı (run rate) **47 milyar $'ı aştı** (yıl başı projeksiyonu 10 milyar $'dı).
- **OpenAI:** ~852 milyar $ değerlemeyle IPO hazırlığında; CFO Sarah Friar, GPT-5.6 serisi ve kurumsal ChatGPT ile ARR'nin hızla büyüdüğünü söyledi. 1 trilyon $ hedefli IPO'nun zamanlaması Anthropic'in yükselişiyle baskı altında.
- Dünkü açık/kapalı model saflaşması (NVIDIA'nın Open Secure AI Alliance'ı vs frontier laboratuvarlar) bağlamında bu IPO yarışı, iki laboratuvarın sermaye tabanını halka açarak NVIDIA-merkezli finansman bağımlılığını azaltma hamlesi olarak da okunabilir.

→ *Modül ilgisi: AI Ecosystem (6), VC Network (19), Ownership Network (2)*

## 🔬 Yarıiletken: Samsung'dan Rekor — "Kıtlık 2028'e Kadar Sürer"

- **Samsung Q2:** Faaliyet kârı **89,5 trilyon won (62 milyar $)** — tüm zamanların rekoru, yıllık ~19 kat artış; çip biriminin kârı **250 kattan fazla** arttı. Gelir 171,5 trilyon won ile rekor. Kârın "neredeyse tamamı" yarıiletkenden: AI sunucu çipleri + HBM fiyat artışları.
- **Kıtlık mesajı:** Samsung yönetimi talebin üretim artışını geçtiğini, arz-talep açığının **2027'de daha da genişleyeceğini** ve krizin 2028'e kadar sürebileceğini söyledi — dünkü rapordaki bellek fiyat enflasyonu tezi (6 katlık RAM artışı) doğrulanıyor.
- **Dev yatırımlar:** Samsung + SK Hynix, Güney Kore'de **800 trilyon won (554 milyar $)** tutarında yeni çip üretim merkezi; Samsung ikinci Teksas fabrikasının inşaatına yıl sonundan önce başlıyor (üretim 2030). SK Hynix rekor 60,5 trilyon won gelir açıkladı.
- Micron ve çip hisseleri Samsung sonuçlarıyla ralli yaptı.

→ *Modül ilgisi: Semiconductor (7), Supply Chain (22), Critical Minerals (9)*

## ⚡ Enerji: DOE Arazisinde 100 Milyar $'lık Kampüs — Nükleersiz

- **NextEra + Brookfield → Paducah, Kentucky:** DOE'nin eski uranyum zenginleştirme sahasında (3.556 dönüm) **100 milyar $'lık AI veri merkezi kampüsü**. 2032'ye kadar 1,2+ GW compute yükü; **4,6 GW özel üretim: 2 GW doğalgaz + 2,6 GW batarya depolama**. Dikkat çekici: DOE, SMR içeren teklifleri davet etmesine rağmen kazanan konsorsiyum **nükleeri dışarıda bıraktı** — hız, nükleer belirsizliğe tercih edildi (dünkü Bulletin "SMR abartısı" uyarısıyla uyumlu sinyal).
- DOE arazilerinde özel AI veri merkezi programının dört başlangıç sahasından biri; "Ratepayer Protection Pledge" ile şebeke maliyeti mevcut abonelere yüklenmiyor.

→ *Modül ilgisi: Energy Network (8), AI Ecosystem (6), Political Influence (4)*

## 📌 Risk Engine Notları (Bugünün sinyalleri)

1. **AI capex ayrışması fiyatlanmaya başladı:** Meta'nın nakit akışı çöküşü, "gelire dönüşmeyen AI harcaması" riskinin ilk büyük piyasa cezası — hyperscaler'lar arasında finansman kalitesi farkı açılıyor.
2. **Bellek kıtlığı yapısallaşıyor:** Samsung'un "2028'e kadar" mesajı, tüm elektronik/veri merkezi tedarik zinciri için çok yıllı maliyet enflasyonu anlamına geliyor.
3. **Fed artırım riski güçlendi:** Üç şahin muhalefet + %3,3 çekirdek PCE + piyasada iki artırım fiyatlaması — 500 milyar $'lık veri merkezi projelerinin finansman maliyeti için ters rüzgâr.
4. **Enerji tarafında nükleerin sessiz yenilgisi:** Paducah'ta SMR yerine gaz+batarya tercihi, veri merkezi enerji yarışında 2030 öncesi pencerede nükleerin devre dışı kaldığının somut kanıtı.
5. **GDP'nin AI'a bağımlılığı:** %1,5'lik büyümede iş yatırımı (+%8,4) neredeyse tek motor — AI capex yavaşlarsa makro büyüme doğrudan etkilenir (tek hata noktası).
