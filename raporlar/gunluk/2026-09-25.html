# Günlük Rapor — 25 Eylül 2026

*Economic Intelligence OS — pencere: 24 Eylül Perşembe kapanış sonrası + 25 Eylül Cuma sabahı*

---

## 🔴 Tez: 10Y yeni yüksek + Brent 106 $ + kilit emilimi; Hürmüz/hat kısıtları yerinde

10Y ~%5,18 bandına yükseldi (çok yıllı yüksek). Brent 24 Eyl kapanış ~106,60 $. SpaceX 24 Eyl ~328 mn Class A kilit dilimi emilim testi devam ediyor. East-West hattı debisi artıyor ancak Yanbu yüklemeleri henüz başlamadı (Reuters 24 Eyl). Hürmüz görünür AIS trafik ekstrem düşük kalmaya devam ediyor. Tesla ZET SCALE koalisyonundan ~2.500 Semi siparişi + Nevada Semi fabrikasi resmi açılış. Dönemsel “sıkılaşan darlık” teyit: getiri ve enerji fiyat baskısı arttı, arz kısıtları bozulmadı. Yarinın testi: kilit emilimi izi + Yanbu ilk yükleme + 10Y seyri.

## ⚡ Bugün işe yarayanlar

- **10Y + Brent yükselişi:** 10Y ~%5,18 (çok yıllı), Brent ~106,60 $. Kim: finansman maliyeti ve enerji kısıtı baskısı. Yarina: getiri eğrisi ve petrol bandı.
- **SpaceX kilit emilimi devam:** 24 Eyl dilimi serbest; emilim gücü izleniyor. Kim: arz baskısı testi. Yarina: ikincil akış.
- **East-West / Yanbu:** Debi artışı kaynaklı; yükleme henüz yok. Kim: enerji kısıtı kısmi gevşeme ama teyitsiz. Yarina: Aramco bülten veya ilk yükleme.
- **Tesla Semi siparişi + fabrika:** ZET SCALE ~2.500 Class 8 + Nevada Semi tesisi açılış. Kim: ağır vasıta elektrifikasyon talebi. Yarina: teslim takvimi.

## 🧭 Yön teyidi

Son dönemsel (29 Ağu–17 Eyl): **sıkılaşan darlık — yatay-aşağı ve dar**. Bugün: **ayakta / teyit**. Getiri ve Brent yükselişi kısıt baskısını güçlendirdi; kilit ve Hürmüz/hat bozmadı. Geçersizleşme: (a) SpaceX kilit güçlü emilim + Flight 14 başarı; (b) Aramco teyitli tam hat + Yanbu yükleme akışı + Brent kalıcı <100; (c) hyperscaler capex/kılavuz gevşetme.

## 🧱 Hareket eden darboğaz

- **spcx-kilit:** 24 Eyl dilim serbest; emilim testi sürüyor. Durum: açık.
- **hat-dogu-bati / yanbu-yukleme:** Debi artışı (kaynaklı); yükleme henüz başlamadı, tam 6–8 hafta. Durum: açık (kısmi).
- **humruz-ais:** Görünür trafik ekstrem düşük band. Durum: açık.

Jazan, Umman STS, bellek-abd açık; HBM/CoWoS ve ai-capex-kilavuz durağan.

## 💰 Sermaye

SpaceX kilit dilimi (önceki günden devam) arz olayı. Çekirdek 23 ad içinde eşiği aşan yeni 8-K / ATM / 13D / imzalı büyük capex-PPA yok. Tesla Semi siparişi sipariş olayı (sermaye satırı değil).

## 🌡️ Termometre

**3/18 DÜŞÜK** · izlemede: getiri eğrisi (10Y ~%5,18), enflasyon (CPI %3,4). VIX ~15,7; Brent ~106,60 $; equities karışık. TCMB toplam rezerv 174,4 mlr $ (18 Eyl haftası).

## 📌 Koşullu sinyaller

1. Eğer SpaceX kilit emilimi zayıf kalırsa → arz baskısı ikinci bacak. Geçersizleşme: güçlü teslim + emilim.
2. Eğer Yanbu’da sürdürülebilir yükleme başlarsa → enerji kısıtı düşer. Geçersizleşme: yalnızca debi artışı, yükleme yok.
3. Eğer 10Y %5,30+ kalıcı olursa → finansman maliyeti hyperscaler/ capex anlatısını sıkıştırır. Geçersizleşme: hızlı geri çekilme.
4. Eğer Hürmüz AIS 20+ gemi bandına çıkarsa → deniz yolu kısıtı gevşer. Geçersizleşme: tek haneli kalırsa.
5. Eğer Micron (30 Eyl) HBM kılavuz revizyonu gelirse → bellek darlığı netleşir.
