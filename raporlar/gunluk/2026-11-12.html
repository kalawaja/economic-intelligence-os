# Günlük Rapor — 12 Kasım 2026

*Economic Intelligence OS — pencere: 11–12 Kasım*

---

## 🔴 Tez: Nvidia kurul Huang’ı görevden alma hazırlığında (WSJ: affair + Çin casus iddiası, kurul toplantısı); SpaceX Starbase ~$24 mlr $ planı 9 Ara hearing’de; Micron Taoyuan pause sürüyor; Hürmüz AIS ~3-8/gün düşük — sıkılaşan darlık ayakta, AI çip liderlik riski yükseldi

11–12 Kas penceresinde çekirdek 23 ad IR + ajans taramasında yeni eşik: Nvidia yönetişim krizi derinleşti. Kurul, Huang’ın Alice Huang (Megaspeed, Çin casus iddiası) ve Kimberly Powell (Nvidia sağlık yöneticisi) ilişkileri üzerine görevden alma hazırlığı yapıyor; Wachtell soruşturması sürüyor, halef aranıyor. SpaceX Starbase gaz santrali + super-compute (~$24 mlr $, 35 türbin ~748 MW, 9 Ara hearing) plan aşamasında, onay yok. Micron Taoyuan Fab 11E inşaat pause’u sürüyor, sendika görüşmeleri çöktü. Hürmüz AIS-görünür 12 Kas ~3, 24h ~8, 7g ort ~7.3 (normal ~85). Loughton çözülmedi. Çin diesel teyitsiz. Dönemsel sıkılaşan darlık ayakta. Yarinın testi: Nvidia kurul kararı veya SpaceX hearing detayı veya Hürmüz 20+.

## ⚡ Bugün işe yarayanlar

- **Nvidia Huang krizi:** Kurul görevden alma hazırlığı (WSJ/NBC/Reuters). Kim: AI çip liderliği. Yarina: kurul duyurusu veya halef.
- **SpaceX $24 mlr $ planı:** Hearing 9 Aralık, 748 MW izin başvurusu. Kim: AI güç kısıtı saha ofset. Yarina: kapasite veya onay.
- **Micron Taoyuan:** Pause sürüyor, görüşmeler çöktü. Kim: HBM 2028 kapasite sürtünmeleri. Yarina: restart teyidi.
- **Hürmüz AIS düşük:** 12 Kas ~3, 24h ~8. Kim: ofset yok. Yarina: 20+ veya resmi.

## 🧭 Yön teyidi

Son dönemsel (29 Ağu–17 Eyl): **sıkılaşan darlık — yatay-aşağı ve dar**. Bugün: **ayakta, liderlik riski yükseldi**. Hürmüz/Çin/Loughton kısıtı sürüyor; AI sermayesi borç/capex ile akıyor, SpaceX saha güç planı ofset deniyor, Nvidia yönetişim krizi derinleşti. 10Y ~%4,99. Geçersizleşme: (a) Aramco tam hat + Brent kalıcı <95; (b) Çin kargo + Hürmüz 50+ ve isabet durması; (c) hyperscaler capex kesimi veya bellek arz gevşemesi.

## 🧱 Hareket eden darboğaz

**humruz-ais:** kısıt teyidi devam (~3-8/gün). **hbm-cowos:** Micron Taoyuan pause sürüyor (sendika görüşmeleri çöktü). **cin-yakit-ihracat:** Kasım diesel yumuşama (kaynaklar), resmi teyitsiz. **ai-capex (güç/saha):** SpaceX Starbase güç planı (proposal, 748 MW), Loughton çözülmedi. **nvidia-yonetisim:** Huang görevden alma hazırlığı (kurul toplantısı). **spcx-kilit:** emilim ölçülmedi. yanbu/jazan/umman-sts Aramco bülten yok. ai-capex-kilavuz durağan.

## 💰 Sermaye

SpaceX ~$24 mlr $ gaz santrali + super-compute (Starbase, vergi indirimi başvurusu, hearing 9 Aralık) — plan, kapanış yok. Yeni ATM / büyük tahvil / 13D / PPA / kilit emilim yok. Önceki Apple/Meta/Alphabet/Microsoft tahvil ve Amazon CapEx yüksekliği sürüyor. Kotasyon ≠ sermaye.

## 🌡️ Termometre

**4/18 DÜŞÜK** · izlemede: getiri eğrisi (10Y ~%4,99), enflasyon (Eylül CPI %3,7 / PCE %3,4). VIX ~17-18. Brent ~92-93 $. TCMB brüt rezerv 25 Eyl 171,2 mlr $. Termometre alarmı yok. Saha: Hürmüz kısıtı + Nvidia yönetişim krizi + SpaceX güç planı.

## 📌 Koşullu sinyaller

1. Eğer Nvidia kurul Huang’ı görevden alırsa → AI çip liderliği ofset derinleşir. Geçersizleşme: kurul “güven” teyidi + halef yok.
2. Eğer SpaceX Starbase planı onay alırsa → AI güç kısıtı ofset derinleşir. Geçersizleşme: hearing reddi veya kapasite belirsizliği.
3. Eğer Hürmüz 20 geminin altında kalırsa → kısıt tek gün değil. Geçersizleşme: günlük 50+ ve isabet durması.
4. Eğer Micron Taoyuan restart olmazsa → HBM 2028 kapasite gecikir. Geçersizleşme: inşaat devam + IR teyit.
5. Eğer Çin resmi bülten + kargo gelmezse → diesel yumuşama kaynak iddiası olarak kalır. Geçersizleşme: NDRC + kargo.
