# Günlük Rapor — 29 Ekim 2026

*Economic Intelligence OS — pencere: 28–29 Ekim*

---

## 🔴 Tez: Alphabet Q3 negatif FCF $9,1 mlr $ + 2026 capex $195-205 mlr $ tuttu (2027 önemli artış); Çin ~4 mn ton ürün kotası kaynaklarla verildi (resmi teyitsiz); SpaceX Apollo taahhüt ve Meta equity planı bağlandı, Loughton/Hürmüz kısıtı sürüyor — sıkılaşan darlık ayakta, AI sermayesi akıyor

28–29 Eki penceresinde Alphabet Q3: gelir miss, negatif free cash flow $9,1 mlr $, çeyrek capex $51,4 mlr $, 2026 kılavuz $195-205 mlr $ değişmedi, 2027’de önemli artış beklentisi (IR/Reuters/CNBC). Microsoft Q3 Azure +48 % ($33,17 mlr $), FCF pozitif $18,6 mlr $, capex $45,2 mlr $ (projeksiyon altı). Çin 4. parti ~3,7-4 mn ton benzin+dizel+jet kotası kaynaklarla verildi (Reuters 28 Eki, NDRC/Ticaret Bakanlığı yorumsuz). SpaceX ~40 mlr $ Apollo bağlayıcı taahhüt ve Meta ~95-97,5 mlr $ equity planı önceki pencerede bağlandı, yeni kapanış yok. Loughton alternatif güç yok. Hürmüz AIS-görünür 28 Eki 5 (7g ort ~5,9). Çekirdek 23 ad taramasında diğerlerinde yeni eşik yok. Dönemsel sıkılaşan darlık ayakta. Yarının testi: Çin resmi bülten/kargo veya Alphabet/Microsoft capex detayı veya Hürmüz 20+.

## ⚡ Bugün işe yarayanlar

- **Alphabet Q3 capex/FCF:** Negatif FCF $9,1 mlr $, çeyrek $51,4 mlr $, 2026 $195-205 mlr $ tuttu, 2027 artış. Kim: AI altyapı harcaması devam. Yarına: IR detay.
- **Çin 4. parti kota:** ~3,7-4 mn ton kaynaklarla (Reuters 28 Eki). Kim: ürün arzı ofset potansiyeli. Yarına: resmi bülten veya kargo.
- **Microsoft Q3 Azure/capex:** Azure +48 % $33,17 mlr $, FCF pozitif, capex $45,2 mlr $ altı. Kim: cloud kapasite artışı. Yarına: kılavuz.
- **Hürmüz AIS düşük:** 28 Eki 5, 29 sabah 1. Kim: ofset yok. Yarına: 20+ veya resmi.

## 🧭 Yön teyidi

Son dönemsel (29 Ağu–17 Eyl): **sıkılaşan darlık — yatay-aşağı ve dar**. Bugün: **ayakta, ofset yok, AI sermayesi akıyor**. Alphabet/Microsoft Q3 capex yüksek, Çin kota kaynaklarla verildi (resmi yok), SpaceX/Meta bağlandı, Loughton/Hürmüz kısıtı sürüyor. 10Y 28 Eki ~%5,00-5,05. Geçersizleşme: (a) Aramco tam hat + Brent kalıcı <95; (b) Çin kargo + Hürmüz 50+ ve isabet durması; (c) hyperscaler capex kesimi.

## 🧱 Hareket eden darboğaz

**cin-yakit-ihracat:** ~3,7-4 mn ton 4. parti kota kaynaklarla verildi (Reuters 28 Eki), resmi bülten yok, kargo teyitsiz. **ai-capex (güç):** Loughton çözülmedi; Alphabet/Microsoft çeyrek capex yüksek, kılavuz tuttu/artış. **humruz-ais:** kısıt teyidi devam (AIS-görünür 28 Eki 5). **spcx-kilit:** 26 Eki dilimi, emilim ölçülmedi; lease taahhüt compute’u destekliyor. yanbu/jazan/umman-sts Aramco bülten yok. hbm-cowos durağan. ai-capex-kilavuz durağan.

## 💰 Sermaye

Alphabet Q3 çeyrek capex $51,4 mlr $ (2026 kılavuz $195-205 mlr $ tuttu, 2027 önemli artış — harcama). Microsoft Q3 capex $45,2 mlr $ (projeksiyon altı, FCF pozitif — harcama). SpaceX ~40 mlr $ Nvidia GPU master finance lease bağlayıcı taahhüt (önceki, kapanış yıl sonu beklenen — taahhüt). Meta ~95-97,5 mlr $ equity planı (önceki, ATM zamanı belirsiz — plan). Çin kota ticaret politikası, şirket sermayesi değil. Çekirdek 23’te yeni ATM / 13D / PPA / 8-K yok. Kotasyon ≠ sermaye.

## 🌡️ Termometre

**4/18 DÜŞÜK** · izlemede: getiri eğrisi (10Y 28 Eki ~%5,00-5,05), enflasyon (Eylül CPI %3,7 / PCE %3,4). VIX ~18-19. Brent ~110-116 $. TCMB brüt rezerv 25 Eyl 171,2 mlr $. Termometre alarmı yok. Saha: Hürmüz kısıtı sürüyor.

## 📌 Koşullu sinyaller

1. Eğer Çin resmi bülten veya kargo yüklenmezse → kota kaynak iddiası olarak kalır. Geçersizleşme: gümrük veya rıhtım teyidi.
2. Eğer Alphabet 2027 capex artışı gerçekleşmezse → kılavuz tutma tek seferlik. Geçersizleşme: IR revizyonu.
3. Eğer Hürmüz 20 geminin altında kalırsa → kısıt tek gün değil. Geçersizleşme: günlük 50+ ve isabet durması.
4. Eğer Microsoft Loughton alternatif güç bulamazsa → AI kapasite dağıtımı daha da gecikir. Geçersizleşme: alternatif kaynak veya başka site IR.
5. Eğer SpaceX lease kapanışı teyit edilmezse → taahhüt olarak kalır. Geçersizleşme: kapanış veya pricing IR.
