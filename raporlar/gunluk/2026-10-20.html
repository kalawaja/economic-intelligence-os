# Günlük Rapor — 20 Ekim 2026

*Economic Intelligence OS — pencere: 19–20 Ekim*

---

## 🔴 Tez: Microsoft Loughton güç kısıtı çözülmedi; Hürmüz AIS-görünür geçiş sıfıra yakın, Çin izni teyitsiz, SpaceX Q3 öncesi borç term sheet’siz

19–20 Eki penceresinde yeni imzalı sermaye veya darboğaz çözümü yok. Microsoft Nscale Loughton çekilmesi sonrası alternatif güç veya site IR’si yok. Hürmüz canlı AIS takipçileri 20 Eki itibarıyla ticari geçişleri 0’a yakın (önceki 7 günlük ~4). Çin Ekim ~3,7 mn ton izni hâlâ tüccar iddiası. SpaceX Q3 sonuçları bugün seans sonrası; ~40 mlr $ Nvidia çip borcu term sheet’siz. Çekirdek 23 ad taramasında sessiz. Dönemsel sıkılaşan darlık ayakta. Yarının testi: SpaceX sonuçları + Hürmüz teyidi veya Çin kargosu.

## ⚡ Bugün işe yarayanlar

- **Güç kısıtı devam:** Loughton için yeni alternatif kaynak açıklaması yok. Kim: AI kapasite dağıtımı kısıtlı. Yarına: IR veya başka site.
- **Hürmüz AIS sıfır:** 20 Eki hormuz.now ve benzerleri 0 geçiş. Kim: ofset yok. Yarına: 20+ veya resmi.
- **Çin teyitsiz:** Resmi gümrük veya kargo yok. Kim: dizel ofseti iddia. Yarına: teyit.
- **SpaceX Q3 bekleniyor:** Sonuçlar seans sonrası; borç görüşmesi sürüyor. Kim: arz penceresi. Yarına: sonuç veya term sheet.

## 🧭 Yön teyidi

Son dönemsel (29 Ağu–17 Eyl): **sıkılaşan darlık — yatay-aşağı ve dar**. Bugün: **ayakta, ofset yok, güç kısıtı çözülmedi**. Microsoft Loughton güç gecikmesi AI kapasite dağıtımını kısıtladı. Çin izni ve Hürmüz kısıtı teyitsiz. SpaceX borcu bağlanmadı. 10Y 19 Eki ~%5,15. Geçersizleşme: (a) Aramco tam hat + Brent kalıcı <95; (b) Çin kargo + Hürmüz 50+ ve isabet durması; (c) hyperscaler capex kesimi.

## 🧱 Hareket eden darboğaz

**ai-capex (güç):** Loughton güç arzı 2030’lara kayınca Microsoft çekildi; yeni çözüm yok, kapasite dağıtımı kısıtlı. **humruz-ais:** kısıt teyidi devam (AIS-görünür 0’a yakın). **cin-yakit-ihracat:** teyitsiz izin duruyor. **spcx-kilit:** 9 Eki dilimi emilim zayıf; sonraki 26 Eki. yanbu/jazan/umman-sts Aramco bülten yok. hbm-cowos AATT2 sonrası durağan. ai-capex-kilavuz durağan (kılavuz kesilmedi).

## 💰 Sermaye

İmzalı olay yok. Microsoft çekilmesi kapasite kısıtı, yeni sermaye değil. Çin izni ticaret politikası, şirket sermayesi değil. SpaceX kilit açılışı arz, yeni ihraç değil. ~40 mlr $ çip borcu term sheet’siz. Çekirdek 23’te yeni ATM / 13D / PPA / capex revizyonu yok.

## 🌡️ Termometre

**4/18 DÜŞÜK** · izlemede: getiri eğrisi (10Y 19 Eki ~%5,15), enflasyon (Eylül CPI %3,7 / PCE %3,4). VIX 16 Eki ~19-20. Brent 19 Eki kapanış ~109,55 $. TCMB brüt rezerv 25 Eyl 171,2 mlr $. Termometre alarmı yok. Saha: Hürmüz kısıtı sürüyor.

## 📌 Koşullu sinyaller

1. Eğer Microsoft Loughton alternatif güç bulamazsa → AI kapasite dağıtımı daha da gecikir. Geçersizleşme: alternatif kaynak veya başka site IR.
2. Eğer Hürmüz 20 geminin altında kalırsa → kısıt tek gün değil. Geçersizleşme: günlük 50+ ve isabet durması.
3. Eğer Çin kargosu yüklenmezse → 3,7 mn ton iddiası kota olarak kalır. Geçersizleşme: gümrük veya rıhtım teyidi.
4. Eğer SpaceX–Apollo term sheet imzalanırsa → Nvidia çip siparişi dış borç katmanına bağlanır. Geçersizleşme: görüşme dağılır.
5. Eğer 10Y kapanış kalıcı %5,20 üstüne çıkarsa → %5,15 bandı tek seanslık değil. Geçersizleşme: kalıcı %5,00 altı.
