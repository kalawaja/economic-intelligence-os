# Günlük Rapor — 8 Ağustos 2026

*Economic Intelligence OS — Günlük haber akışı ve istihbarat özeti*

---

## 🔴 Günün Öne Çıkanı: İstihdam Şoku — ABD Temmuz'da 23 Bin İş KAYBETTİ; Eylül Artırımı Fiyatlamadan Düşüyor, "Sonraki Hamle İndirim" Tartışması Açıldı

Haftanın ana kararını verecek denilen Temmuz istihdam raporu, beklenen "güçlü mü, ılımlı mı" sorusunun tamamen dışında bir sonuç üretti: **ABD ekonomisi Temmuz'da 23.000 istihdam kaybetti** — beklenti +83-95 bin aralığındaydı; sapma tek başına ~106 bin. Üstüne **Mayıs-Haziran toplamda ~103 bin aşağı revize edildi** (Haziran +20 bine indi); son 12 ayın ortalaması aylık +34 bine geriledi. **İşsizlik %4,1'e indi** ama bu bir güç işareti değil: **işgücüne katılım %61,4 ile beş yılın en düşüğüne** çekildi — işsizlik oranını düşüren, iş bulanlar değil işgücünden çıkanlar.

**Fed fiyatlaması bir günde tersine döndü:** CME FedWatch'ta Eylül artırım olasılığı **%57'den %43,9'a** düştü, sabit tutma **%60'ın** üzerine çıktı (bir hafta önce %33'tü). Citi daha ileri gitti: "Sonraki hamle **indirim** — baz senaryo Ekim." Karşı ses Morgan Stanley'den Ellen Zentner: 12 Ağustos'taki CPI sıcak gelirse artırım çağrıları geri dönebilir. Fed'in mevcut aralığı %3,50-3,75; karar 16 Eylül'de.

**Piyasa "kötü haber = iyi haber" penceresini seçti:** S&P 500 **7.757,64 (+%0,62) ile rekor kapanış** yaptı ve CNBC'ye göre Nisan'dan bu yana en güçlü haftasını tamamladı; Nasdaq Bileşik **26.690,62 (+%1,30)**, Dow **54.036,93 (+%0,28)**, Russell 2000 +%1,10. 10 yıllık getiri **%4,64'e** geriledi, dolar zayıfladı; **altın 4.375,80 $ (+%1,77) ile zirve bölgesinde, gümüş +%5 ile 64,69 $**. Dünkü raporun "hisse için zayıf veri daha kolay senaryo" asimetri tespiti aynen gerçekleşti.

İkinci büyük gelişme kurumsal cepheden: **Tesla ve SpaceX, Teksas Grimes County'de "Terafab" adını verdikleri AI çip fabrikasını resmileştirdi** — ilk faz **16,8 milyar $**; ayrıntılar Yarıiletken bölümünde.

→ *Modül ilgisi: Financial Power (5), Risk Engine (23), Timeline Engine (24), Semiconductor (7)*

## 💰 Finansal Güç: "Sıkı Ama Kırılmamış" Tezi İlk Çatlağını Verdi

- **Raporun iç dokusu manşetten daha zayıf:** −23 bin, aylardır ilk aylık kayıp; beklentiden kümülatif sapma (revizyonlarla birlikte) ~250 bin istihdam. Perşembe verileri (claims 199 bin, Challenger işten çıkarmalar iki yılın dibinde) "işten çıkarma yok" diyordu — yeni tablo bunu "işe alım da yok" diye tamamlıyor: dünkü JOLTS/verimlilik çerçevesindeki "donmuş işgücü piyasası" teşhisi, ilk kez net negatif yazdırdı.
- **Tepki dağılımı klasik gevşeme rallisi:** Tahvil fiyatları yükseldi, eğrinin geneli aşağı geldi (10Y %4,64); büyüme/teknoloji öncülük etti (Nasdaq +%1,30); değerli metaller rekor bölgesine sıçradı (altın 4.375,80 $, gümüş 64,69 $). Q2 sezonu da destek: S&P 500 şirketlerinin **%85'i** beklenti üstü sonuç açıkladı.
- **İzleme:** 12 Ağustos CPI. Zayıf istihdam + sıcak enflasyon kombinasyonu, piyasanın bugün fiyatladığı "güvercin dönüş"ü hızla geri sardırabilir *(çift veri riski; teyit gerektirir)*.

→ *Modül ilgisi: Financial Power (5), Timeline Engine (24), Risk Engine (23)*

## 🔬 Yarıiletken: "Terafab" Resmileşti — Musk Dikey Entegrasyonu Çipe Taşıyor; Kore'de Toparlanma Kapanışta Buharlaştı

- **Tesla + SpaceX, 6 Ağustos akşamı Teksas Grimes County'yi (Houston'ın kuzeyi) "Terafab" için seçtiklerini duyurdu:** İlk faz yatırımı **16,8 milyar $**; çok aşamalı planda yalnızca SpaceX tarafının **119 milyar $'a** kadar çıkabileceği belirtiliyor. Hedef **100 milyon ft²+ üretim alanı** — Musk "dünyanın en büyük ve en değerli binası olacak" dedi; tesis **gelişmiş mantık VE bellek** üretecek, ilk etapta 3.000+ istihdam öngörülüyor. TechCrunch'a göre projeye **Intel de katkıda bulunacak** *(rolün kapsamı belirsiz; teyit gerektirir)*. Gerekçe: iki şirketin önümüzdeki yıllarda ihtiyaç duyacağı ~1 terawatt bilişim gücü ile küresel çip arzı arasındaki makas.
- **Harita okuması:** Bu, "capex cezası" rejiminde fiyatı yarılanan SpaceX'in cevabının *daha fazla capex* olması demek — ama bu kez tedarik zincirinin en kıt halkasını (üretim kapasitesi) içselleştirme iddiasıyla. Bellek üretimi iddiası ciddiye alınırsa Samsung/SK Hynix/Micron oligopolü için yeni bir değişken; mantık tarafında TSMC'ye uzun vadeli alternatif kanal anlamına gelir. Piyasanın ilk oylaması pozitifti ama jobs-rallisi gününe denk geldi — izole sinyal değil.
- **Kore'nin cuma kapanışı dünkü tezi zayıflattı:** Kospi güne alıcılı başlayıp (09:30'da 6.300,76, yabancı +286 milyar won) öğleden sonra satışa döndü ve **6.258,77 ile −%0,60 kapandı**; yabancı gün sonunda **863,3 milyar won NET SATICI** (kurumsal +579,0 milyar won alıcı). **SK Hynix −%4,88** (1.422.000 won), Samsung +%0,22; won 1.416,1'e değer kazandı. Dünkü rapor cuma sabahı verisiyle "Kore döndü" demişti — kapanış verisi bu teşhisi düzeltiyor: **akış yönü gün içinde yeniden tersine döndü, pozisyonel tasfiye bitmedi.** Sekiz günlük sekans: −%11 / +%17,9 / −%4,9 / −%1,7 / +%3,76 / −%4,59 / +%1,8(gün içi)→kapanışta güç kaybı / **−%0,60**.

→ *Modül ilgisi: Semiconductor (7), AI Ecosystem (6), Supply Chain (22), Financial Power (5), Risk Engine (23)*

## ⚡ Enerji: Hürmüz'de "Yönetilen Koridor" Şekilleniyor — Ama Cumartesi Bir Tankere Füze Atıldı

- **Çerçeve netleşiyor:** İran ve Umman, geçişi düzenleyen sistemde uzlaştı — ticari gemiler **İran sularından girip Umman sularından çıkacak**; Tahran bunun "tam açılış değil, yeni güvenlik modeli" olduğunu vurguluyor. Cumartesi IRGC cephesinden koşul geldi: boğaz, "ABD İran'ın şartlarını tamamen kabul ederse" açılacak. Bloomberg'in cumartesi haberi de aynı çizgide: anlaşma yakın, ama İran "koşullarımız karşılanmalı" diyor.
- **Modelin kırılganlığı aynı gün test edildi:** Cumartesi, BAE devi **ADNOC'un tanker filosuna ait bir gemi boğazda füzeyle hedef alındı** (yaralanma yok). Trafik hâlâ çökük: normalde haftada ~130 olan geçiş **8 gemiye** inmiş durumda. ABD ayrıca İran bankacılık sistemini hedefleyen **8. tur yaptırımları** devreye aldı — masada anlaşma, sahada baskı.
- **Petrol:** Perşembe Brent %2,86 artışla 83,64 $'a yükselmişti; cuma sabahı 86,04 $'a kadar geldi, gün içinde geri verdi — cuma kapanış aktarımları kaynaklar arasında karışık (hafif artı ile hafif eksi arası) ve hafta genelinde kayıp korundu *(vade/anlık seri farkları; teyit gerektirir)*. Cumartesi itibarıyla Brent 83 $ üzeri. ABD benzin ortalaması 4,04 $/galon (bir ay önce 3,79 $). **Düzeltme notu:** Dünkü rapordaki "Brent 80,23 / WTI 75,81" farklı bir seriden geliyordu; bu rapor Ekim vadeli Brent'i baz alıyor.

→ *Modül ilgisi: Energy Network (8), Financial Power (5), Risk Engine (23)*

## 🛡️ Savunma ve Uzay: Mekke'de Üçlü Pakt — Güvenlik Mimarisi ABD'siz Katmanlaşıyor

- **Suudi Arabistan, Türkiye ve Pakistan üçlü savunma anlaşması imzaladı** (Mekke). İran savaşının ve Hürmüz krizinin gölgesinde atılan bu adım, bölge ülkelerinin ABD güvenlik şemsiyesine paralel/alternatif mimari arayışının bugüne kadarki en somut halkası. Yemen cephesinde ise Husilerin Marib'e füze-İHA saldırısında en az 10 kişi öldü — güney cephesi soğumuyor.
- **SpaceX haftayı güçlü kapattı:** Cuma **+%16 ile ~133 $** — hafta genelinde +%23, Haziran ortasındaki 135 $ IPO fiyatının hemen altı. Lockup arzının emilmesinin ardından analist cephesi hızla yeniden fiyatlandı: Morgan Stanley (Adam Jonas) lockup'ı "giriş fırsatı" olarak niteledi, Argus notu Buy'a çekti (160 $), Bernstein 248 $'a, Citi 200 $'a yükseltti. Terafab (yukarıda) uzay-savunma tarafında da okunmalı: çip arzını içselleştiren bir SpaceX, ihracat kontrolü/tedarik şoku senaryolarına karşı da pozisyon alıyor.

→ *Modül ilgisi: Defense & Space (9), Political Influence (4), Energy Network (8), Financial Power (5)*

## 🔀 M&A Akışı: Apollo, easyJet'i 5,7 Milyar Sterline Alıyor — Teklif Savaşı Bitti

- **Apollo Global, easyJet'i £5,7 milyar (~7,7 milyar $) bedelle satın almak için anlaşmaya vardı;** rakip talip Castlelake çekildi, easyJet yönetimi teklifi destekliyor. Havacılıkta özel sermayenin (private equity) büyük ölçekli dönüşü: yüksek faiz ortamında bile altyapı-benzeri nakit akışına ödenen prim, "finansal güç haritası"nda Apollo düğümünü büyütüyor.

→ *Modül ilgisi: Financial Power (5), M&A Flow (12), Risk Engine (23)*

## 🌡️ Makro Görünüm (Kriz Termometresi: 2/18 — DÜŞÜK; Fed göstergesi izlemeden çıktı)

İstihdam şoku panelde bir göstergeyi rahatlattı: Eylül artırım fiyatlaması %50'nin altına (≈%44) indiği için **Fed politika yönü göstergesi "izleme"den "normal"e döndü — puan 3/18'den 2/18'e**. İzlemede kalanlar: **getiri eğrisi** (düz bölge; cuma günü kısa uç daha hızlı düştüğü için hafif dikleşme yönlü — inversiyon riski azaldı) ve **hedef üstü enflasyon** (CPI %3,5 / PCE %3,7; 12 Ağustos CPI belirleyici). **Sahm girdisi tetiklenmedi:** işsizlik %4,1'e gerilediği için gösterge düşük kalıyor — ama katılım kaynaklı düşüş, Sahm'ın bu evrede sinyal üretmekte gecikebileceğini hatırlatıyor. *(Not: data/makro.js paneli bu koşuda güncellenemedi — depo gizli olduğu için dosya okunamıyor; termometre bu bölümde izlenmeye devam ediyor.)*

→ *Modül ilgisi: Risk Engine (23), Financial Power (5), Timeline Engine (24)*

## 📌 Risk Engine Notları (Bugünün sinyalleri)

1. **"Kötü haber = iyi haber" penceresi 12 Ağustos'a endeksli:** Piyasa istihdam şokunu faiz gevşemesi olarak fiyatladı (S&P rekor, altın-gümüş zirve). Ama zayıf işgücü + sıcak CPI kombinasyonu gelirse hem artırım tartışması geri döner hem "büyüme zayıflıyor" okuması hisse çarpanını vurur — tek veriyle rejim değişti, tek veriyle geri dönebilir.
2. **İstihdamda asıl soru: talep mi, arz mı kırıldı?** −23 bin + katılımın %61,4'e düşüşü birlikte okununca, işsizlik oranının düşük kalması yanıltıcı; Sahm bu yapıda geç sinyal verir. Önümüzdeki iki raporda negatif seri devam ederse "donmuş piyasa"dan "daralan piyasa"ya geçiş teyit olur.
3. **Kore'de kapanış verisi düzeltmesi:** Cuma sabahı alıcı görünen yabancı, kapanışta 863 milyar won satıcıya döndü; SK Hynix −%4,9. Dünkü "tasfiye bitti" okuması erken — NAND spot/sözleşme fiyat serileri gelene kadar Kore pozisyonlarında oynaklık rejimi (±%2-5) baz senaryo olmayı sürdürüyor.
4. **Terafab, "capex cezası" rejiminin stres testi:** Musk şirketleri fiyat cezasına capex artırarak cevap veriyor; 16,8 milyar $ ilk faz + 119 milyar $'a dek genişleme, AI-IPO penceresi (Solidigm, olası OpenAI) açıkken duyuruldu. İzleme: Intel'in rolünün netleşmesi, finansman yapısı ve bellek üreticilerinin (Samsung/SK Hynix/Micron) tepkisi — tesis bellek iddiasını somutlaştırırsa bellek-kıtlığı tezinin 2028+ ayağı değişir.
5. **Hürmüz'de "yönetilen koridor" + tanker saldırısı + 8. tur yaptırım + Mekke paktı aynı 24 saatte:** Anlaşma imzalanırsa petrolde aşağı yön sınırlı (koridor zaten fiyatlı), yeni bir tanker olayında yukarı asimetri büyük. Mekke üçlü paktı ise savunma haritasında yeni bir blok düğümü — ABD dışı savunma tedarik zincirleri (Türkiye-Suudi-Pakistan ekseni) izleme listesine girdi.
