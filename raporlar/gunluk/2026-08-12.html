# Günlük Rapor — 12 Ağustos 2026

*Economic Intelligence OS — Günlük haber akışı ve istihbarat özeti (Çarşamba koşusu: 11 Ağustos ~08:00 UTC sonrası)*

---

## 🔴 Günün Öne Çıkanı: AI Talep Zinciri Çifte Teyit Aldı — İkinci Kademe Bilanço Sınavı Geçildi, Temasek Kore Belleğine Doğrudan Girdi; Kospi +%4,6 ile Rekor Kırdı

AI rallisinin iki kritik sorusu aynı 24 saatte cevap buldu. Birincisi bilanço sorusuydu: ikinci kademe AI altyapı şirketleri Salı kapanışı sonrası sınava girdi ve **talep tarafında tek bir çatlak bile rapor edilmedi**. **Lumentum** FQ4 gelirini yıllık **+%109,3 ile 1,01 milyar $'a** taşıdı ve 1,225-1,275 milyar $'lık FQ1 kılavuzuyla konsensüsü (~1,16 milyar $) ezdi; hedef işletme modeline "planladığından bir çeyrek erken" ulaştığını açıkladı. **CoreWeave** Q2 gelirini yıllık yaklaşık iki katına (2,58 milyar $) çıkardı ve **gelir birikimi (backlog) ~104 milyar $'a** ulaştı; hisse seans sonrası **+%12-16**. **Super Micro** 11,12 milyar $ gelire karşılık asıl bombayı kılavuzda patlattı: cari çeyrek için **14,5-15,5 milyar $** öngörüsü konsensüsün (~11,8 milyar $) 3 milyar $'dan fazla üzerinde; FY2026'da **60 milyar $'ın üzerinde yeni sipariş** ve rekor backlog bildirdi; hisse seans sonrası **+%10**. Tek uyarı işareti fiyatlamadan geldi: Lumentum'un kusursuz beat+raise'ine hissenin tepkisi **yatay (−%0,2)** kaldı — bir yılda +%600 koşan hissede mükemmellik artık fiyatın içinde.

İkinci soru sermaye sorusuydu ve cevabı Asya verdi: Singapur devlet fonu **Temasek (518 milyar SGD portföy)**, Kore borsasına ilk kez doğrudan hisse alımıyla girme kararını **Samsung Electronics ve SK Hynix** için verdi; alım zamanlaması Kore makamlarıyla koordine ediliyor *(tutar ve takvim açıklanmadı; teyit gerektirir)*. Haberle Çarşamba seansında **Samsung +%6,68 (255.500 won), SK Hynix +%5,54 (1.504.000 won)** kapattı; **Kospi +%4,57 ile 6.635,30'a** sıçrayarak rekor bölgesine döndü — 6 Ağustos'taki sert satışın ("capex cezası") üzerinden dört seans geçmeden. Dünkü raporun ana teması olan "faturayı kim ödüyor" sorusuna bu koşunun cevabı: talep gerçek, ve masaya artık **devlet sermayesi** de oturuyor.

→ *Modül ilgisi: AI Ecosystem (6), Semiconductor (7), Financial Power (5), Risk Engine (23)*

## 💰 Finansal Güç: CPI Günü — Artırım Fiyatlaması ~%57'ye Tırmandı; Alphabet'e "Capex Cezası" 25 Milyar $'lık Tahville Geri Döndü

- **Salı kapanışı:** S&P 500 **7.728,20 (−%0,32)**, Dow **53.791,85 (−%0,34)**, Nasdaq **26.445,45 (−%0,60)** — üç endeks de CPI öncesi temkinli. 10 yıllık getiri **~%4,69'da** yüksek seyretti. Dikkat çekici ayrışma: Philadelphia Yarıiletken Endeksi **+%0,87** ile endekslerin tersine yükseldi; bellek hisseleri (SanDisk +%2,68, Seagate +%2,44, SK Hynix ADR +%4,7) öncülük etti.
- **Günün asıl olayı bugün 12:30 UTC'de:** Temmuz CPI koşu anında **henüz açıklanmadı**. Konsensüs manşette aylık **~+%0,1-0,2** (yıllık ~%3,4), çekirdekte **+%0,2**; Cleveland Fed nowcast'i manşet +%0,09/çekirdek +%0,21. Eylül artırım fiyatlaması Salı itibarıyla **~%57'ye** yükseldi *(piyasa-türevi fiyatlama, gün içi ±3-5 puan oynak; teyit gerektirir)* — petrol şoku fiyatlamayı üçüncü gündür yukarı itiyor. Yarın PPI var; Perşembe TCMB haftalık rezerv bülteni, Cuma Berkshire 13F'i (~13,5 milyar $'lık gizli pozisyon) takvimde.
- **Alphabet −%3,6 (yaklaşık altı ayın en sert günlük kaybı):** AI altyapısını fonlamak için **25 milyar $'lık tahvil ihracını** tamamlaması, 195-205 milyar $'a çıkarılmış 2026 capex kılavuzu ve negatife dönen serbest nakit akışıyla birleşince "capex cezası" bu kez Alphabet'i buldu; hisse Berkshire'ın alım fiyatının altına indi. Nvidia cephesinde ise ters yönlü bir sinyal: Huang'ın platform açıklaması (aşağıda) sonrası **Nvidia'nın 2056 vadeli tahvil spreadleri daraldı** — kredi piyasası "bilanço dışına taşıma + %25 sınırı" kombinasyonunu risk azaltıcı okudu.
- **ICE, MarketAxess satın alımı için 6 milyar $'lık tahvil satışına** başladı — büyük ölçekli M&A'nın borç piyasasından fonlanması, faiz belirsizliğine rağmen açık kanal.

→ *Modül ilgisi: Financial Power (5), Timeline Engine (24), Risk Engine (23)*

## 🤖 AI Ekosistemi: Huang'dan Platformlara "%25 Sınırı" — CoreWeave'in 104 Milyar $'lık Backlog'u; Nebius Bugün

- **Huang, 500 milyar $'lık platformların mekaniğini netleştirdi:** Nvidia'nın tekil projelere finansal desteği **proje başına %25'i aşmayacak** ve finans kuruluşlarının bağımsız risk değerlendirmesinin yerine geçmeyecek. Açıklama, Pazartesi duyurusunun ardından büyüyen "dolaşımsal finansman" eleştirisine doğrudan cevap; tahvil spreadlerinin daralması ilk somut olumlu tepki. MOU'ların nihai sözleşmeye dönüşümü hâlâ izlemede.
- **CoreWeave Q2:** Gelir **2,58 milyar $ (yıllık ~2x)**, düzeltilmiş zarar hisse başına −1,14 $ (beklentiden dar); **backlog ~104 milyar $** — kontratlı gelecek gelir, yıllık gelirin ~40 katı. Hisse seans sonrası +%12-16. Zarar yazan ama backlog biriktiren AI bulut modeli, Nvidia'nın "hesaplamayı varlık sınıfına çevirme" teziyle aynı haftada güç kazandı.
- **Super Micro FQ4:** Gelir 11,12 milyar $ (konsensüsün hafif altı) ama düzeltilmiş EPS 1,70 $ ile beklenti üstü; cari çeyrek kılavuzu **14,5-15,5 milyar $** ile konsensüsü ezdi. FY2026'da 60 milyar $+ yeni sipariş. AI sunucu talebinde yavaşlama işareti yok.
- **Bugün Nebius** (Vera Rubin rack'i Finlandiya'da devrede) Q2 açıklıyor; Cerebras ve Applied Materials Perşembe. Ayrıca veri merkezi kapasite piyasasında yeni bir büyük kira raporlandı: TensorWave'e 15 yıllık, **6,5 milyar $'lık, 222 MW** bağlayıcı kapasite kirası (genişleme hakkı 650 MW+) *(taraflar ve koşullar; teyit gerektirir)*.

→ *Modül ilgisi: AI Ecosystem (6), Financial Power (5), Energy Network (8), Risk Engine (23)*

## 🔬 Yarıiletken: Optikte "Mükemmellik Fiyatlandı" — Lumentum Kusursuz, Hisse Yatay; Coherent Bu Akşam; Intel İhracı 20 Milyar $'a Büyüdü

- **Lumentum FQ4 ayrıntısı:** Gelir 1,01 milyar $ (+%109,3 yıllık, +%24,5 çeyreklik); FY2026 toplamı 3,014 milyar $ (+%83,2). Non-GAAP EPS 3,23 $ (konsensüs 2,97 $); FQ1 kılavuzu gelirde 1,225-1,275 milyar $, EPS'te 4,05-4,35 $ (konsensüs 3,61 $). GAAP tarafındaki 7,2 milyar $'lık net zarar, dönüştürülebilir tahvillerin hisseye çevrilmesinden kaynaklanan **tek seferlik** muhasebe kalemi. CEO Hurlston: "AI iş yükleri hız ve bant genişliğinde büyüdükçe veri merkezi mimarları birincil bağlantı olarak optiğe dönüyor"; OCS, 1.6T geçişi ve CPO lazerleri büyüme kanalları. Buna rağmen hisse seans sonrası **−%0,2 (818,90 $)** — Pazartesi'deki ön-boşaltmanın (−%7) ardından "güçlü sonuç = sert geri dönüş" senaryosu **çalışmadı**; optikte çıta artık kılavuzun da üstünde. → Optik Transceiver modülü: **Coherent FQ4 bu akşam** — dünkü −%12 sonrası asıl test.
- **Kore'de rekor gün (Çarşamba):** Kospi **+%4,57 → 6.635,30**; Samsung +%6,68, SK Hynix +%5,54 (gün içinde ikisi de +%8'i gördü). Tetikleyici Temasek haberi; arka planda bazı aracı kurumların "geleneksel bellek döngüsü zirveye yaklaşıyor olabilir" notlarıyla hedef fiyat kırpması da var — momentum ile döngü uyarısı aynı güne denk geldi. Japonya tatil dönüşünde yatay: Nikkei ~66.900 (−%0,1), Kioxia +%0,7.
- **Intel, hisse ihracını 15 milyar $'dan 20 milyar $'a büyüttü:** **95 $/hisseden ~210,5 milyon hisse** (Cuma kapanışına göre ~%6,5 iskonto; yükleniciye 30 gün içinde 31,6 milyon ek hisse opsiyonu). Kullanım alanı "genel kurumsal amaçlar" — analistler tanımın belirsizliğine dikkat çekerken güçlü talebi Intel Foundry'ye güven işareti okuyor. Pazartesi −%4'ün ardından ihracın büyütülebilmesi, sulandırmaya rağmen arz tarafında derin talep gösteriyor.
- SOX Salı günü +%0,87 ile endekslerden pozitif ayrıştı; TSMC rekor Temmuz cirosunun (NT$467,58 milyar) ardından yeni veri yok.

## ⚡ Enerji: Jazan Resmî Olarak 30 Ağustos'a Sarktı — Zaman Çizelgesi Düzeltmesi; Hürmüz'de İran'ın 6 Şartı Masada

- **Jazan restart'ı 30 Ağustos'a ertelendi** (IIR saha notu, 11 Ağu): 400 bin varil/gün kapasiteli rafineri için 15 Ağustos hedefi resmen kaydı. **Düzeltme (önceki raporlara):** IIR/sektör kaynaklarına göre tesis **27 Temmuz'dan beri kapalı** — IGCC kompleksini ve tank sahasını vuran ilk Husi saldırısı Temmuz sonundaydı; 9 Ağustos'taki saldırı (önceki raporlarda ana hasar olayı olarak işlenmişti) **ikinci dalga**ydı ve restart hazırlığını vurdu. Ayrıca 80 bin varil/gün kapasiteli reformer ünitesi operasyonel sorunlarla **27 Mayıs'tan beri** devre dışı. Suudi yakıt ihracatı Temmuz'da **1,32 milyon varil/gün ile savaş öncesinin ~%30 altında** — zayıf ürün stoklarına ve rekor marjlara ikinci tur baskı *(saldırı kronolojisi kaynaklar arasında farklılaşıyor; teyit gerektirir)*.
- **Petrol ikinci günü de yukarı kapattı:** WTI **~83,40 $ (+%1,5)**, Brent **~88,95 $ (+%1,3)**. Hürmüz pazarlığında İran, Ulusal Güvenlik Konseyi eliyle **6 maddelik şart listesini** resmileştirdi (saldırıların durması, ablukanın kalkması, **iki savaşın tazminatının eksiksiz ödenmesi**, yaptırımların kalkması, dondurulmuş varlıkların koşulsuz iadesi...); Trump "yol kenarı bombalarının kurbanları için" karşı-tazminat talebiyle cevap verdi ve süreci "yarı müzakere" diye tanımladı. Geçişler dip seviyede: 8 Ağustos'ta **8 gemi** (normal ~73); savaş öncesi 138'e karşı günlük ~13 gemi bandı; VLCC başına savaş riski sigortası ~10 milyon $ (normalin ~30 katı). Tahmin piyasaları 15 Ağustos'a kadar açılışa **<%1**, ay sonuna kadar **~%4** olasılık veriyor. ABD güçlerinin Panama bayraklı Vela Nova konteyner gemisine abluka ihlali gerekçesiyle müdahale ettiği iddiası doğrulanmadı *(teyit gerektirir)*.
- LME'de **alüminyum +%1,7** — Körfez arz endişesinin metal kanalına ilk belirgin sıçraması.

→ *Modül ilgisi: Energy Network (8), Financial Power (5), Risk Engine (23), Timeline Engine (24)*

## 🏛️ Politika ve Regülasyon: Devlet Sermayesi Sahnede — Temasek-Seul Koordinasyonu; Tazminat Diplomasisi Kurumsallaşıyor

- **Temasek'in Kore hamlesi yalnızca bir portföy kararı değil:** Fon, alımların zamanlamasını **Kore makamlarıyla koordine ediyor** ve yönetimi dış yöneticilere devretmeden içeride tutacak. Seul'ün Pazartesi açıkladığı 10 trilyon won'luk çip seferberliğinin 48 saat içinde yabancı devlet sermayesini çekmesi, "devlet kapasitesi yarışı" okumasını güçlendiriyor: sanayi politikası artık yalnız sübvansiyon değil, **egemen fon akışlarının koordinasyonu**.
- **Tazminat diplomasisi çerçeve hâline geldi:** İran'ın 6 şartı ile Trump'ın karşı-tazminat talebi, Hürmüz müzakeresini hukuki-teknik bir açılış pazarlığından **karşılıklı fatura pazarlığına** dönüştürdü. Uzman okuması: İran, Kasım ara seçimleri öncesi maksimalist açılışla küçük kazanımlar (yaptırım gevşemesi, varlık çözülmesi) hedefliyor. Bu çerçeve kalıcılaştıkça enerji risk primi yapısallaşıyor.
- Veri takvimi politikaya bağlanıyor: bugün CPI, yarın PPI — sıcak bir okuma, Eylül artırımını fiilen kilitleyip "zayıf istihdam + inatçı enflasyon" kombinasyonunu Fed'in kucağına bırakır.

→ *Modül ilgisi: Political Influence (4), Semiconductor (7), Energy Network (8), Financial Power (5)*

## 📌 Risk Engine Notları (Bugünün sinyalleri)

1. **CPI bugün, fiyatlama eşiğin belirgin üstünde:** Eylül artırım olasılığı ~%57 ile üçüncü gündür tırmanıyor; termometredeki Fed göstergesini izlemede tutan koşul artık tek veriye bağlı değil, petrol kanalıyla besleniyor. Çekirdekte aylık ≥%0,3-0,4 gelirse ve Brent ~89 $'da tutunursa, dönemsel pilotun (a) geçersizleşme koşulu tetiklenir — "yön yukarı" tespiti sorgulanır. Konsensüse uygun (~+%0,2) veya soğuk bir okuma ise artırım fiyatlamasını hızla çözebilir.
2. **Optikte "mükemmellik fiyatlandı" rejimi:** Lumentum'un beat+raise'ine yatay tepki, güçlü sonucun bile artık yukarı sürpriz üretemediğini gösterdi — dünkü 5. sinyalin "güçlü sonuç = sert geri dönüş" bacağı çalışmadı. Bu akşam Coherent: kusursuz olmayan her kılavuz, parabolik ralli sonrası ikinci satış bacağının tetiği olabilir. Talep tarafında ise kırılma yok — pilotun (b) koşulu tetiklenmedi.
3. **Jazan zaman çizelgesi revizyonu ürün şokunu uzattı:** Restart 30 Ağustos'a sarktı ve tesisin 27 Temmuz'dan beri kapalı olduğu netleşti — kesinti sanılandan ~2 hafta daha eski, Suudi yakıt ihracatı savaş öncesinin %30 altında. Husi taktiği "vurmak"tan çok "erteletmek": restart arifesinde düşük maliyetli saldırılarla 400 bin varil/gün kapasiteyi devre dışı tutmak. Ağustos enflasyon nowcast'lerine (manşet +%0,38) ikinci tur besleme riski büyüdü.
4. **Devlet sermayesi bellek rallisine girdi — momentum/döngü ayrışması:** Temasek'in Samsung/SK Hynix kararı Kospi'yi +%4,6 ile rekora taşırken, aynı gün aracı kurumlar "geleneksel bellek döngüsü zirveye yakın olabilir" uyarısıyla hedef kırpıyor. Egemen fon alımı yapısal-uzun vadeli bir imza; ama kısa vadede fiyat, döngü uyarısının üstüne %5-8'lik tek gün primi bindirdi. Kore oynaklığı temasında yeni katman: akış artık yalnız yabancı kurumsal değil, devlet fonu koordinasyonlu.
5. **"Compute-as-asset" tezi kredi piyasasında ilk onayını aldı:** Huang'ın %25 sınırı açıklaması sonrası Nvidia tahvil spreadlerinin daralması, platform yapısının şirket bilançosu için risk azaltıcı okunduğunu gösteriyor; CoreWeave'in 104 milyar $'lık backlog'u teminat havuzunun "altındaki varlığı" büyütüyor. Karşı kanıt hâlâ bekleniyor: MOU→sözleşme dönüşümü ve GPU amortisman varsayımlarının ilk bağımsız testi.
