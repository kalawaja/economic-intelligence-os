# Günlük Rapor — 20 Kasım 2026

*Economic Intelligence OS — pencere: 19–20 Kasım*

---

## 🔴 Tez: SpaceX $32 mlr $ AI çip borcu satışı (off-BS, >%8) + Micron Singapur HBM ilk proses ekipmanı (erken 2027) + Hürmüz 19 Kas 6 / 20 sabah 2 düşük — sıkılaşan darlık ayakta, sermaye çip/güç tarafına akıyor, yönetişim ofseti sürüyor

19–20 Kas penceresinde SpaceX $32 mlr $ AI çip borcu sattı (Bloomberg, off-balance-sheet, getiriler >%8, daha büyük finansmanın parçası; Nvidia çipleri için kiralama). Micron Singapur HBM advanced packaging tesisine ilk proses ekipmanını kurdu (19 Kas IR, erken 2027 üretim hedefi; 2027 kapasitesinin %75’i satıldı, $32 mlr $ multiyear taahhüt). Hürmüz AIS-görünür 19 Kasım 6, 20 Kasım sabah 2 (hormuz.now, restricted, 7g ort ~6, ~%7 normal). Nvidia kalıcı CEO yok, Kress geçici, Huang dönüş kapalı (önceki). Diğer 23 ad + darboğaz taramasında yeni IR/ajans eşiği yok. Çin diesel teyitsiz, Loughton sürüyor. Dönemsel sıkılaşan darlık ayakta. Yarının testi: SpaceX kilit emilim veya Hürmüz 20+.

## ⚡ Bugün işe yarayanlar

- **SpaceX sermaye:** $32 mlr $ AI çip borcu satışı (off-BS). Kim: AI güç/çip ramp. Yarına: emilim veya covenant detayı.
- **Micron HBM kapasite:** Singapur ilk ekipman + 2027 %75 satıldı. Kim: HBM darlığı. Yarına: SCA/kılavuz artışı.
- **Hürmüz AIS düşük:** 19 Kas 6, 20 sabah 2. Kim: ofset yok. Yarına: 20+ veya resmi.
- **Nvidia yönetişim:** kalıcı CEO yok, dönüş kapalı. Kim: AI çip liderliği. Yarına: aday netleşmesi.

## 🧭 Yön teyidi

Son dönemsel (29 Ağu–17 Eyl): **sıkılaşan darlık — yatay-aşağı ve dar**. Bugün: **ayakta, sermaye çip tarafına akıyor, yönetişim ofseti sürüyor**. Hürmüz/Çin/Loughton kısıtı devam; SpaceX borcu ve Micron kapasite adımı AI darlığını teyit ediyor. 10Y ~%5,05. Geçersizleşme: (a) Aramco tam hat + Brent kalıcı <95; (b) Çin kargo + Hürmüz 50+ ve isabet durması; (c) hyperscaler capex kesimi veya bellek arz gevşemesi.

## 🧱 Hareket eden darboğaz

**humruz-ais:** kısıt teyidi devam (19 Kas 6, 20 sabah 2). **hbm-cowos:** Micron Singapur ilk ekipman + %75 2027 satıldı darlığı teyit ediyor. **nvidia-yonetisim:** kalıcı CEO yok, dönüş kapalı. **cin-yakit-ihracat:** teyitsiz. **ai-capex (güç/saha):** SpaceX borcu akıyor, Loughton çözülmedi. **spcx-kilit:** emilim ölçülmedi. yanbu/jazan/umman-sts Aramco bülten yok. ai-capex-kilavuz durağan.

## 💰 Sermaye

SpaceX $32 mlr $ AI çip borcu satışı (off-BS, Bloomberg 19 Kas, getiriler >%8). Micron $32 mlr $ multiyear müşteri taahhütleri (önceki artış devam). Yeni ATM / 8-K / 13D / PPA / kilit emilim yok. Kotasyon ≠ sermaye.

## 🌡️ Termometre

**5/18 DÜŞÜK** · izlemede: getiri eğrisi (10Y ~%5,05), enflasyon (Eylül CPI %3,7 / PCE %3,4), VIX ~28 (19 Kas kapanış, izleme eşiği üzerinde). Brent ~90 $. TCMB brüt rezerv 25 Eyl 171,2 mlr $. Termometre alarmı yok. Saha: Hürmüz kısıtı + Nvidia geçici CEO + SpaceX borç akışı.

## 📌 Koşullu sinyaller

1. Eğer SpaceX borcu emilim + covenant netleşmezse → AI çip finansmanı belirsiz kalır. Geçersizleşme: kilit emilim + IR teyidi.
2. Eğer Hürmüz 20 geminin altında kalırsa → kısıt tek gün değil. Geçersizleşme: günlük 50+ ve isabet durması.
3. Eğer Micron 2027 SCA/kılavuz artışı gelmezse → HBM darlığı spekülasyon kalır. Geçersizleşme: IR teyidi.
4. Eğer Nvidia kalıcı CEO atamazsa → yönetişim ofseti sürer. Geçersizleşme: hızlı iç/dış atama + yol haritası teyidi.
5. Eğer Çin resmi bülten + kargo gelmezse → diesel yumuşama kaynak iddiası olarak kalır. Geçersizleşme: NDRC + kargo.
