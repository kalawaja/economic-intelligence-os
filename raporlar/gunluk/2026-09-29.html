# Günlük Rapor — 29 Eylül 2026

*Economic Intelligence OS — pencere: 28 Eylül Pazartesi kapanış sonrası + 29 Eylül Salı*

---

## 🔴 Tez: Nvidia 150 mlr $ buyback; Yanbu yükleme restart; 10Y 5,24; kilit açık

Nvidia yönetim kurulu 150 mlr $ ek geri alım yetkisi onayladı (toplam yetki 235 mlr $, FY28’e). East-West hattı ~3,5 mb/g debiyle çalışıyor; Yanbu’da yükleme kaynaklara göre başladı (Aramco resmi bülten yok). 10Y %5,24 bandı (19 yıllık yüksek yakın). SpaceX 24 Eyl kilit dilimi emilim testi ve sonraki 9/24 Eki takvimi sürüyor. Brent ~105 $. Dönemsel “sıkılaşan darlık” ayakta — nakit iadesi + kısmi enerji gevşeme, getiri ve kilit baskısı yerinde. Yarının testi: Micron (30 Eyl) HBM/kılavuz + Yanbu sürdürülebilir akış + kilit emilimi.

## ⚡ Bugün işe yarayanlar

- **Nvidia 150 mlr $ buyback:** Yetki artışı rekor; nakit üretiminden hissedar iadesi. Kim: AI nakit gücünün teyidi. Yarına: fiilî alım temposu.
- **Yanbu / East-West yükleme:** Kaynaklar: loading başladı, debi ~3,5 mb/g; tam kapasite hâlâ 6–8 hafta. Kim: enerji kısıtı bir kademe gevşedi. Yarına: Aramco teyit + düzenli tanker ritmi.
- **10Y %5,24 + kilit:** Getiri baskısı finansman maliyetini tutuyor; SpaceX kilit emilimi açık. Kim: sermaye maliyeti + arz olayı. Yarına: emilim verisi + getiri yönü.
- **Micron öncesi:** 30 Eyl Q4 sonuç; HBM/kapasite kılavuzu bekleniyor. Kim: bellek darlığı testi. Yarına: kılavuz revizyonu var mı.

## 🧭 Yön teyidi

Son dönemsel (29 Ağu–17 Eyl): **sıkılaşan darlık — yatay-aşağı ve dar**. Bugün: **ayakta**. Nvidia buyback nakit gücünü teyit etti; Yanbu restart enerji tarafını hafifletti; 10Y yüksekliği ve kilit bozmadı. Geçersizleşme: (a) kilit güçlü emilim + Flight ritim; (b) Aramco teyitli tam hat + Brent kalıcı <95; (c) hyperscaler capex/kılavuz gevşetme veya Micron zayıf HBM sinyali.

## 🧱 Hareket eden darboğaz

- **hat-dogu-bati / yanbu-yukleme:** Debi ~3,5 mb/g + yükleme başladı (kaynak); Aramco resmi yok; tam 6–8 hafta. Durum: açık (kısmi → ilerleme).
- **spcx-kilit:** 24 Eyl dilim emilimi açık; sonraki 9/24 Eki. Durum: açık.
- **humruz-ais:** Görünür trafik düşük band. Durum: açık.

Jazan, Umman STS, bellek-abd açık; HBM/CoWoS ve ai-capex-kilavuz durağan (Micron 30 Eyl testi).

## 💰 Sermaye

Nvidia: ek 150 mlr $ share repurchase authorization (toplam ~235 mlr $, FY28). Siemens Energy 2 mlr € dilimi zaten açıktı. Çekirdek 23 ad içinde yeni 8-K / ATM / 13D / imzalı büyük capex-PPA eşiği aşan başka olay yok.

## 🌡️ Termometre

**4/18 DÜŞÜK** · izlemede: getiri eğrisi (10Y ~%5,24), enflasyon (CPI %3,4). VIX sakin; Brent ~105 $; TCMB toplam rezerv 174,4 mlr $ (18 Eyl haftası).

## 📌 Koşullu sinyaller

1. Eğer Micron HBM kılavuzunu yükseltirse → bellek darlığı netleşir. Geçersizleşme: nötr/düşük kılavuz.
2. Eğer Yanbu düzenli yükleme teyitlenirse → enerji kısıtı düşer. Geçersizleşme: yalnız tek seferlik, akış yok.
3. Eğer Nvidia buyback fiilen başlar ve tempo tutarsa → nakit iadesi somutlaşır. Geçersizleşme: yetki kalır, alım yok.
4. Eğer 10Y %5,30+ kalıcı olursa → finansman maliyeti capex anlatısını sıkıştırır. Geçersizleşme: hızlı geri çekilme.
5. Eğer kilit emilimi zayıf kalırsa → arz baskısı ikinci bacak. Geçersizleşme: teslim + güçlü emilim.
