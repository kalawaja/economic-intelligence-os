3. **Getiri eğrisi tam eşikte (+0,50) — termometre 2→1 düştü ama sinyal kalitesi düşük:** Düzelme, 2Y'nin sabitlenip 10Y'nin müdahale sonrası geri yükselmesinden geldi; yani "sağlıklı dikleşme" değil, politika artefaktının ikinci türevi. Eğri ±5 bp bandında izleme sınırında salınacak; termometre okumasını tek başına rahatlama olarak yorumlama.
4. **Kanada penceresi bugün doluyor — tarife-hukuku temasının ilk canlı vade testi:** Metin yoksa %50 tarife otomatik devreye girer; eyalet onarım süreci (Quebec süt-kota çizgisi) anlaşmayı imzadan sonra da kırılgan bırakır. Yürürlük halinde Kanada-maruziyetli tedarik zincirleri (otomotiv, alüminyum, kereste) ve USMCA'nın 2026 gözden geçirme takvimi yeniden fiyatlanır. İzleme: bugün ABD kapanışına kadar resmi metin/erteleme açıklaması.
5. **SpaceX kilit emilimi bozuldu — arz takvimi artık fiyat belirleyici:** İkinci tranş ilk kez IPO fiyatının altına itti (135 $ kırıldı); 9 Eylül-24 Ekim arasında dört tranş + Kasım'da 1,3 milyar hisse gelirken "unlock ≠ arz" tezi zayıflıyor. DB'nin Cursor-temelli 235 $ hedefi ile piyasa fiyatı arasındaki makas, AI-anlatısının özel-piyasa değerlemelerinden halka açık fiyata ne kadar taşınabildiğinin ana göstergesi. İzleme: 135 $ etrafında haftalık kapanış + Kasım tranşının öne çekilme söylentileri.
