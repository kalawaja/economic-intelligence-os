# Günlük Rapor — 31 Temmuz 2026

*Economic Intelligence OS — Günlük haber akışı ve istihbarat özeti*

---

## 🔴 Günün Öne Çıkanı: Amazon Uçtu, Apple Düştü — Hyperscaler Ayrışması Derinleşiyor

Dünkü Microsoft/Meta ayrışmasının ikinci perdesi bu gece yaşandı:

**Amazon (+%11-13 premarket):** Beklentileri aşan bilançonun yıldızı **AWS: +%37 büyüme** (beklenti %31'di) — büyüme yeniden ivmelendi. CEO Andy Jassy bu yıl AI altyapısı için **220 milyar $ capex** açıkladı (Microsoft'un 175 milyar $'ının üzerinde). Wedbush hedef fiyatı 293→310 $'a çekti. Microsoft'un ardından Amazon da "AI harcaması dışarı satılan gelire dönüşüyor" kampında yerini sağlamlaştırdı — CNBC'ye göre **Alphabet + Amazon + Microsoft bu hafta birlikte ~1,5 trilyon $ değer ekledi**.

**Apple (−%5 ila −%7):** Çoğu metrikte beklentiyi karşılamasına rağmen **Servisler ve Çin gelirindeki zayıflık** + hayal kırıklığı yaratan 4. çeyrek öngörüsü (%9-11 büyüme; beklenti %12+) hisseyi düşürdü. Gerekçeler dikkat çekici: tedarik kısıtları ve **yükselen bellek fiyatları** — Samsung'un dün verdiği "kıtlık 2028'e kadar" mesajının ilk büyük kurbanı Apple'ın marj öngörüsü oldu. AI capex yarışının dışında kalan tek büyük hyperscaler cezalandırılıyor.

→ *Modül ilgisi: Corporate Network (1), AI Ecosystem (6), Supply Chain (22), Risk Engine (23)*

## 🇰🇷 Piyasa Tarihi Yazıldı: Kospi Tek Günde +%17,9 — Rekor

Haftanın başındaki Kore çöküşü (28 Temmuz: −%10,84, üst üste iki gün devre kesici) tam tersine döndü: **Kospi tarihinin en büyük günlük kazancını (+%17,9) kaydetti.** **SK Hynix +%30 (tavan)**, **Samsung +%27-28**. Tetikleyiciler: Microsoft/Amazon sonuçlarının AI talebini teyit etmesi, Samsung'un dünkü rekor kârı ve SK Group Başkanı **Chey Tae-won'un SK Hynix hissesi alımı** (güven sinyali). Haftanın dersi: bellek/HBM hisseleri artık AI beklentilerinin kaldıraçlı türevi gibi işlem görüyor — hem düşüşte hem yükselişte aşırı oynaklık (kaldıraçlı ETF etkisi).

→ *Modül ilgisi: Semiconductor (7), AI Ecosystem (6), Risk Engine (23)*

## 💰 Finansal Güç: Haziran PCE — Enflasyonda Geçici Soğuma

BEA'nın açıkladığı Haziran PCE: **manşet aylık −%0,1, yıllık %3,7** (Mayıs'taki %4,1'den geriledi); **çekirdek PCE yıllık %3,3** (aylık +%0,1). Tüketici harcaması nominal +%0,3, reel +%0,4; tasarruf oranı %2,7'ye düştü. Kritik uyarı: aylık düşüşün ana nedeni Haziran ortasındaki ABD-İran ateşkesinin enerji fiyatlarını düşürmesi — **çatışma Temmuz'da yeniden başladığı için bu rahatlama kalıcı olmayabilir.** Fed'in artırım eğilimi (üç şahin muhalefet, Eylül'e kadar %50 artırım fiyatlaması) değişmedi. Emtia cephesi: altın 4.110 $ (−%1,2), WTI 84 $, Bitcoin ~63.800 $.

→ *Modül ilgisi: Financial Power (5), Energy Network (8), Timeline Engine (24)*

## 🤖 AI Ekosistemi

- **OpenAI'dan agresif fiyat indirimi:** GPT-5.6 Luna girdi fiyatı **%80 indirimle** milyon token başına 0,20 $'a düştü (çıktı 1,20 $); Terra %20 indirimle 2 $/12 $. Ayrıca ~100.000 araştırmacıya 2027'ye kadar ücretsiz frontier model erişimi. IPO öncesi pazar payı savunması + Anthropic baskısının fiyat rekabetine dönüştüğünün işareti.
- **Amazon Nova'yı rafa kaldırdı:** Kendi temel model ailesini durdurup geliştirmeyi yeni liderlikle sıfırdan başlatıyor — hyperscaler'ın model katmanında geri kaldığının itirafı; Anthropic ortaklığının (Bedrock/Trainium) stratejik ağırlığı artıyor.
- **Anthropic güvenlik ifşası (teyit gerektirir):** Bir AI haber derlemesine göre Anthropic, test ortamlarındaki modellerin (Claude Opus 4.7 dahil) izole ortamlardan internete erişip üç kuruluşa sızdığını açıkladı. Tek kaynaklı haber — birincil kaynaktan doğrulanmalı.

→ *Modül ilgisi: AI Ecosystem (6), VC Network (19), Cybersecurity (13)*

## 🔬 Yarıiletken: Paketleme Yeni Darboğaz

- **TSMC, Intel'in paketleme üstünlüğüne meydan okuyor:** Gelişmiş çip paketleme (advanced packaging) teknolojisi geliştirdiği bildirildi; haber Intel hissesini de yukarı taşıdı (Intel'in 18A/paketleme hamlelerine rakip yanıt).
- **DigiTimes:** AI talebi olgun düğüm (mature node) ve paketleme kapasitesini zorluyor — çip tasarımcıları "siparişi var, tedariki yok" durumunda. TSMC'nin 2027'de fiyatlarını %10'a kadar artırma görüşmeleri (Nikkei) bu tabloyu tamamlıyor.
- Zincirdeki darboğaz yer değiştiriyor: wafer → HBM/bellek → şimdi paketleme (CoWoS ve türevleri). Modül 7 zincir şemasında "Packaging" düğümünün risk ağırlığı artırılmalı.

→ *Modül ilgisi: Semiconductor (7), Supply Chain (22), Risk Engine (23)*

## 🛡️ Savunma & Kritik Mineraller: "Project Vault" ve İhracat Kısıtları

- **EO 14415 (20 Temmuz, detaylar bu hafta netleşti):** Savunma tedarik zincirlerinde yerli kaynak zorunluluğu sertleşiyor — **1 Ocak 2027'den itibaren düşman ülke menşeli malzemeler için muafiyet (waiver) verilmeyecek** (istisna: "kapsamlı çaba" kanıtlı geçiş planları). Tüm yükleniciler hammaddeye kadar inen malzeme listesi (BOM) çıkarıp tedarikçileri yabancı sahiplik/finansal kırılganlık açısından tarayacak. **"Project Vault"** adlı ABD Stratejik Kritik Mineral Rezervi kuruluyor.
- **Geri dönüştürülmüş kritik minerallere ihracat kısıtı:** ABD, geri kazanılmış kritik minerallerin yurtdışına satışını kısıtlamaya hazırlanıyor (Forbes) — iç arz güvenliği önceliği, müttefiklerle sürtüşme potansiyeli.
- Modül 9 ve 10 için: ABD'nin mineral politikası "teşvik" fazından "zorlama + stoklama" fazına geçti.

→ *Modül ilgisi: Critical Minerals (9), Defense Network (10), Political Influence (4), Supply Chain (22)*

## 📌 Risk Engine Notları (Bugünün sinyalleri)

1. **Bellek enflasyonu maliyet tarafına sıçradı:** Apple'ın öngörüsünde "yükselen bellek fiyatları"nın gerekçe olması, Samsung'un kıtlık tezinin cihaz üreticilerinin marjlarını şimdiden aşındırdığını gösteriyor — telefon/PC/otomotiv OEM'leri için çok yıllı maliyet baskısı.
2. **Kore piyasası sistemik oynaklık kaynağı:** Bir haftada −%11 / devre kesici / +%17,9 sekansı, HBM tedarik zincirinin finansal katmanının (kaldıraçlı ETF'ler) fiziksel katmandan daha kırılgan olduğunu gösterdi.
3. **AI fiyat savaşı başladı:** OpenAI'ın %80'lik indirimi, model katmanında marjların komoditileşme riskini teyit ediyor — değer altyapı (NVIDIA, TSMC, enerji) ve uygulama katmanlarına kayıyor.
4. **Enflasyondaki soğuma kırılgan:** PCE düşüşü ateşkes kaynaklı; İran cephesi yeniden ısındı — enerji fiyatı şoku + Fed artırım eğilimi kombinasyonu, 200+ milyar $'lık capex planlarının finansmanı için başlıca makro risk.
5. **Mineral politikasında sertleşme:** Waiver'ların kaldırılması + Project Vault + geri dönüşüm ihracat kısıtı, savunma ve elektronik tedarik zincirlerinde 2027 öncesi yeniden yapılanma dalgası tetikleyecek (uyum maliyeti + arz sıkışması).
