# Günlük Rapor — 24 Kasım 2026

*Economic Intelligence OS — pencere: 23–24 Kasım*

---

## 🔴 Tez: Nvidia kurul Huang’ı 23 Kas’ta CEO olarak geri getirdi (hükümet girdisi); SEC muhasebe + CA Çin subpoena ofseti sürüyor; Hürmüz 23 Kas 4 / 24 sabah 0 düşük — sıkılaşan darlık ayakta, yönetişim kısmen çözüldü, regülasyon ofseti devam, sermaye çip tarafına akmış durumda

23–24 Kas penceresinde Nvidia kurul Huang’ı oybirliğiyle CEO, başkan ve kurul üyesi olarak yeniden atadı (23 Kas IR/Reuters/Politico; ABD hükümeti girdisi, Trump teyidi). Bağımsız kurul soruşturması, SEC muhasebe incelemesi ve California AG subpoenası devam ediyor (WSJ/Reuters 24 Kas). Hisse 23 Kas ~%31 yükseldi. SpaceX GPU borcu önceki pencerede fiyatlandı (~$32-44 mlr $, off-BS, >%8). Micron Singapur HBM ilk ekipman önceki. Hürmüz AIS-görünür 23 Kas 4, 24 Kas sabah 0 (hormuz.now, restricted, 7g ort ~7,1, ~%8 normal). Diğer 23 ad + darboğaz taramasında yeni IR/ajans eşiği yok. Çin diesel teyitsiz, Loughton sürüyor. Dönemsel sıkılaşan darlık ayakta. Yarının testi: Nvidia soruşturma kapsamı veya Hürmüz 20+.

## ⚡ Bugün işe yarayanlar

- **Nvidia yönetişim:** Huang geri dönüş (23 Kas kurul). Kim: AI çip liderliği. Yarına: soruşturma detayı veya yol haritası.
- **Hürmüz AIS düşük:** 23:4 / 24:0. Kim: ofset yok. Yarına: 20+ veya resmi.
- **SpaceX sermaye (önceki):** GPU borcu fiyatlandı. Kim: AI çip ramp. Yarına: emilim veya kısıt.
- **Micron HBM (önceki):** Singapur ekipman teyit. Kim: kapasite. Yarına: Taoyuan (26 Kas).

## 🧭 Yön teyidi

Son dönemsel (29 Ağu–17 Eyl): **sıkılaşan darlık — yatay-aşağı ve dar**. Bugün: **ayakta, yönetişim kısmen çözüldü, regülasyon ofseti devam, sermaye çip tarafına akmış**. Hürmüz/Çin/Loughton kısıtı devam; Nvidia dönüş ofseti yumuşattı ama incelemeler sürüyor. 10Y ~%4,92. Geçersizleşme: (a) Aramco tam hat + Brent kalıcı <95; (b) Çin kargo + Hürmüz 50+ ve isabet durması; (c) hyperscaler capex kesimi veya bellek arz gevşemesi.

## 🧱 Hareket eden darboğaz

**humruz-ais:** kısıt teyidi devam (23 Kas 4, 24 sabah 0). **nvidia-yonetisim:** Huang geri dönüş ile kısmen çözüldü, SEC/CA/kurul soruşturması sürüyor. **hbm-cowos:** Micron Singapur önceki teyit. **cin-yakit-ihracat:** teyitsiz. **ai-capex (güç/saha):** SpaceX borcu önceki, Loughton çözülmedi. **spcx-kilit:** emilim ölçülmedi. yanbu/jazan/umman-sts Aramco bülten yok. ai-capex-kilavuz durağan.

## 💰 Sermaye

Yeni sermaye olayı yok (ATM / 8-K / 13D / PPA / kilit emilim). SpaceX GPU borcu önceki pencerede fiyatlandı. Micron önceki taahhütler devam. Kotasyon ≠ sermaye.

## 🌡️ Termometre

**5/18 YÜKSELMİŞ** · izlemede: getiri eğrisi (10Y ~%4,92), VIX ~26,6 (23 Kas kapanış, ≥20), enflasyon (Eylül CPI %3,7 / PCE %3,4), SP500 düzeltmeden çıktı (~%7,4 rekor altı); alarmda yok. Brent ~80-83 $. TCMB brüt rezerv önceki. Termometre alarmı yok. Saha: Hürmüz kısıtı + Nvidia SEC/CA devam + önceki SpaceX borç.

## 📌 Koşullu sinyaller

1. Eğer Nvidia SEC/CA soruşturması suçlamaya giderse → yönetişim ofseti yeniden derinleşir. Geçersizleşme: hızlı kapanış + yol haritası teyidi.
2. Eğer Hürmüz 20 geminin altında kalırsa → kısıt tek gün değil. Geçersizleşme: günlük 50+ ve isabet durması.
3. Eğer SpaceX borcu orbital kısıt + emilim netleşmezse → AI çip finansmanı belirsiz kalır. Geçersizleşme: kilit emilim + IR teyidi.
4. Eğer Micron 2027 SCA/kılavuz artışı gelmezse → HBM darlığı spekülasyon kalır. Geçersizleşme: IR teyidi.
5. Eğer Çin resmi bülten + kargo gelmezse → diesel yumuşama kaynak iddiası olarak kalır. Geçersizleşme: NDRC + kargo.
