# Günlük Rapor — 2 Ekim 2026

---

## 🔴 Tez: Amazon 20 yıl nükleer PPA imzaladı; Çin Ekim yakıt ihracını askıya aldı; Brent 102 $; 10Y gün içi %5,34

Constellation IR (30 Eyl 16:00 ET, önceki pakette yok): Amazon 20 yıllık PPA, Calvert Cliffs’ten 690 MW (190 MW uprate 2030–32 dahil); tesis yatırımı >3 mlr $; perakende tedarik PJM. Güç şebekeye kalır; veri merkezi sahası değil (Ağustos kampüs iptali duruyor). Çin rafinerileri Ekim ürün ihracını HK/Makao dışı askıya aldı (Reuters, 4 kaynak; PetroChina kargo iptali); resmi Pekin kararı metni yok. Brent Aralık 102,31 $ (+%4,4). Hürmüz’de 29 Eyl üç tanker isabeti; Yanbu yükleme Kpler ~3,3 mb/g (26–30 Eyl), Aramco bülten yok. 10Y gün içi %5,3445 (2002’den beri tepe); kapanış ~%5,26. İstihdam raporu ve Tesla teslimatı 2 Eki 08:30 / gün içi — henüz yok. Dönemsel “sıkılaşan darlık” ayakta: güç offtake bağlandı, ürün kısıtı sıkılaştı, getiri yüksek. Yarının testi: BLS istihdam + Tesla teslim + 7 Eki Çin ihracat izni.

## ⚡ Bugün işe yarayanlar

- **Amazon–Constellation PPA:** IR; 690 MW / 20 yıl; uprate 190 MW; >3 mlr $ tesis yatırımı. Kim: hyperscaler güç offtake’i. Yarına: Amazon nakit çıkışı açıklanmadı.
- **Çin yakıt ihracı askıda:** Reuters; Ekim HK/Makao dışı durdu; PetroChina iptal. Kim: ürün darboğazı. Yarına: 7 Eki sonrası izin.
- **Hürmüz isabet + Yanbu ritim:** Marisks üç tanker (29 Eyl); Kpler Yanbu ~3,3 mb/g. Kim: deniz riski sürüyor, Kızıldeniz kolu kısmi. Yarına: Aramco bülten.
- **10Y gün içi %5,34:** Reuters; kapanış ~%5,26. Kim: finansman maliyeti. Yarına: istihdam sonrası bant.

## 🧭 Yön teyidi

Son dönemsel (29 Ağu–17 Eyl): **sıkılaşan darlık — yatay-aşağı ve dar**. Bugün: **ayakta**. PPA capex’i kesmedi, güç bacağını bağladı; Çin ürün askısı enerji kısıtını ürüne kaydırdı; getiri 2002 tepesini gün içi gördü. Geçersizleşme: (a) Aramco tam hat + Brent kalıcı <95; (b) Çin ihracat izni + Hürmüz 50+ gemi; (c) hyperscaler capex kesimi.

## 🧱 Hareket eden darboğaz

- **yanbu-yukleme:** Kpler 26–30 Eyl ~3,3 mb/g, 27 Eyl yedi rıhtım dolu. Durum: açık → kısmi ritim (Aramco bülten yok).
- **humruz-ais:** 29 Eyl üç tanker isabeti; AIS ekstrem. Durum: açık → fiziksel isabet eklendi.
- **cin-yakit-ihracat:** Ekim ürün ihracı HK/Makao dışı askıda. Durum: yeni satır, açık.
- **hat-dogu-bati:** Kpler hat ~2,65 mb/g önceki teyit; yeni Aramco yok. Durum: açık (kısmi).
