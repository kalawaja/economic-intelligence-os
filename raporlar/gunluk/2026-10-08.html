# Günlük Rapor — 8 Ekim 2026

*Economic Intelligence OS — pencere: 7 Ekim Çarşamba seansı + 8 Ekim Perşembe sabah*

---

## 🔴 Tez: Katar açıklarında tanker isabeti; Çin izni tatil sonrası da yok, çip borcu imzasız

UKMTO (7 Eki, Al Jazeera / Guardian 8 Eki): tanker, Katar’ın kuzey kıyısı açıklarında (Madinat ash Shamal’ın ~94 km kuzeyi, Hürmüz’ün ~500 km batısı) birden fazla mermiyle vuruldu; zayiat sayısı açıklanmadı. Körfez’in batı yarısında haftalar sonra ilk tanker isabeti. Tahran aynı gün Umman kıyısına yaslanan güney geçişini kapatacağını söyledi. Reuters (7 Eki): 5 Eki’ye kadarki hafta, savaşın başından beri en yüksek tanker isabet haftası. Çin tatili 7 Eki bitti; 8 Eki sabah HK/Makao dışı yeni ihracat izni yok (Economist 7 Eki: dondurma ucu açık, Ekim ihracatı ~%40 düşüş projeksiyonu). SpaceX ~40 mlr $ Nvidia çip borcu (FT/Reuters, 6 Eki) hâlâ imzasız; 5 yıl CDS rekor, kotasyon sermaye değil. Terafab: Musk (7 Eki, X) fab’ı Tesla ve SpaceX işletecek, TSMC en fazla alt kira; Intel CEO’su Bloomberg’e kalacağını söyledi. Mayıs dosyası genel çerçeve, bağ yok. 10Y 7 Eki kapanış %5,277 (gün içi %5,364). Brent kapanış 100,20 $. Dönemsel “sıkılaşan darlık” ayakta: isabet coğrafyası genişledi, offtake ve çip borcu bağlanmadı. Yarının testi: 9 Eki SpaceX kilit + Çin izin.

## ⚡ Bugün işe yarayanlar

- **Katar açıklarında isabet:** UKMTO 7 Eki, Al Jazeera ve Guardian 8 Eki. Batı Körfez’e kayma. Kim: Hürmüz sıkışması Katar MEB’ine taştı; QatarEnergy düğüm yok. Yarına: ikinci batı Körfez isabeti veya UKMTO düzeltmesi.
- **İran güney koridor beyanı:** Guardian 8 Eki. Umman kıyısı geçişi “kapanacak” deniyor; fiilî kapanış teyidi yok. Kim: bypass rotası da hedef ilan edildi. Yarına: geçiş sayısı veya fiilî kapanış.
- **Çin izni yok:** tatil bitti, sabah yeni izin yok. Economist 7 Eki dondurmayı ucu açık yazdı. Kim: dizel ofseti hâlâ kapalı. Yarına: Ticaret Bakanlığı izni + kargo.
- **Terafab işletmeci iddiası, bağ yok:** Musk X + Intel/Bloomberg 7 Eki. Kim: TSMC işletmeci senaryosu daraldı, imza hâlâ yok. Yarına: bağlayıcı JV veya ret.

## 🧭 Yön teyidi

Son dönemsel (29 Ağu–17 Eyl): **sıkılaşan darlık — yatay-aşağı ve dar**. Bugün: **ayakta, saha ayağı sertleşti**. İsabet coğrafyası Hürmüz’den Katar açıklarına genişledi; Çin izni gelmedi. SpaceX borcu ve Terafab bağlanmadı — capex kesimi değil. 10Y kapanış %5,277, gün içi %5,36; S&P rekorun %0,2 altında. Geçersizleşme: (a) Aramco tam hat + Brent kalıcı <95; (b) Çin ihracat izni + Hürmüz 50+ gemi ve isabet durması; (c) hyperscaler capex kesimi.

## 🧱 Hareket eden darboğaz

**humruz-ais:** durum sertleşti. 7 Eki UKMTO Katar kuzey kıyısı isabeti; İran güney koridor kapatma beyanı (fiilî kapanış yok). 5 Eki 11 tanker paketi duruyor. **cin-yakit-ihracat:** tatil bitti, 8 Eki sabah HK/Makao dışı izin yok; satır açık. yanbu / jazan / umman-sts: Aramco bülten yok. hbm-cowos ve ai-capex-kilavuz durağan. spcx-kilit 9 Eki açık.

## 💰 Sermaye

İmzalı olay yok. SpaceX ~40 mlr $ (10 mlr $ banka + 30 mlr $ tahvil) görüşmesi sürüyor, term sheet yok, 8-K yok — sermaye değil. Terafab: işletmeci iddiası ve Intel’in kalma sözü bağlayıcı taahhüt değil; 16,8 mlr $ ilk faz Ağustos’ta açıklanmıştı, yeni tutar yok. Broadcom–OpenAI ~50 mlr $ finansman (WSJ, Reuters Morning Bid 8 Eki) harita dışı, imzasız. Çekirdek 23’te yeni ATM / 13D / PPA yok. 9 Eki SpaceX kilit açılmadı.

## 🌡️ Termometre

**4/18 DÜŞÜK** · izlemede: getiri eğrisi (10Y 7 Eki kapanış %5,277, gün içi %5,364), enflasyon (PCE %3,4 / çekirdek %3,0). VIX 7 Eki kapanış 15,08. Brent 7 Eki kapanış 100,20 $ (Dow Jones). TCMB brüt rezerv 25 Eyl 171,2 mlr $. Termometre alarmı yok. **Saha alarmı:** Katar açıklarında tanker isabeti.

## 📌 Koşullu sinyaller

1. Eğer batı Körfez’de ikinci isabet gelirse → Hürmüz riski Katar MEB’ine yerleşir. Geçersizleşme: UKMTO düzeltmesi ve isabet durması.
2. Eğer Çin izin vermezse → Ekim ürün ihracatı projeksiyonu (~%40 düşüş) fiile döner. Geçersizleşme: izin + kargo.
3. Eğer 9 Eki SpaceX dilimi zayıf emilirse → arz baskısı ikinci bacak; çip borcu hâlâ ayrı ve imzasız. Geçersizleşme: teslim + güçlü emilim.
4. Eğer SpaceX–Apollo term sheet imzalanırsa → Nvidia çip siparişi dış borç katmanına bağlanır. Geçersizleşme: görüşme dağılır.
5. Eğer 10Y kapanış %5,30 üstünde kalırsa → gün içi %5,36 tek seanslık değil. Geçersizleşme: kalıcı %5,10 altı.
