# Günlük Rapor — 18 Eylül 2026

*Economic Intelligence OS — pencere: 17 Eylül Perşembe ABD nakit seansı + 18 Eylül Cuma sabahı (TCMB resmî rezerv bülteni dahil)*

---

## 🔴 Tez: Sindirim ralli; kısıtlar yerinde

Perşembe nakit, Çarşamba FOMC şokunu sindirdi. S&P **7.637,76 (+%1,14)**, Nasdaq **26.418,30 (+%1,69)**, SOX **11.599,49 (+%3,14)**; 10Y **%4,94**’e geriledi, VIX **15,44**. Brent settle **104,82 $**. TCMB 11 Eylül haftası resmî bülteni brüt rezervi **178,7 milyar $** (önceki hafta 184,2; −5,5) olarak açıkladı — önceki basın hesabı 183,8’in üzerindeydi. Ne sermaye olayı (ATM, 13D, kilit, imzalı PPA), ne kılavuz revizyonu, ne Aramco teyitli hat/yükleme restart’ı geldi. O yüzden dönemsel tespit (“sıkılaşan darlık — yatay-aşağı ve dar”) ayakta: ralli dar set içinde kaldı, enerji operasyonel primi ve Ekim ikinci 25 bp belirsizliği çözülmedi. Yarının testi: Cuma Avrupa kapanışı + hafta sonu Hürmüz AIS / Aramco bülteni; 24 Eylül SpaceX kilit takvimi yaklaşırken emilim sinyali.

## ⚡ Bugün işe yarayanlar

- **TCMB resmî rezerv:** 11 Eylül haftası brüt **178,7 mlr $** (−5,5), net **62,2**, swap hariç net **~50**. Döviz 68,4 / altın 110,3. Kim sıkışır: TRY likidite okuması ve döviz mevduat tarafı. Yarına bakılacak: swap detayı ve sonraki hafta akışı.
- **Perşembe sindirim + SOX:** Endeks ve yarıiletken toparlandı; Intel/Micron/Nvidia güçlü, kılavuz yok. Kim gevşer: geçici AI/bellek betası. Yarına: kılavuz veya eğitim duraklatma bülteni gelmezse rotasyon dar kalır.
- **Enerji priminin yumuşaması:** Brent 104,82 $; Umman STS ve “yarı kapasite günler içinde” iddiaları (Bloomberg kaynaklı) primi kesti, hattı açmadı. Kim: Aramco operasyonel risk hâlâ açık. Yarına: Aramco resmi restart veya Hürmüz günlük 50+ gemi.

## 🧭 Yön teyidi

Son dönemsel (29 Ağu–17 Eyl): **sıkılaşan darlık — yatay-aşağı ve dar**. Bugün: **ayakta**. Sindirim rallisi genişlik veya enerji kısıtını bozmadı; RSP/SPY dönüşü yok, hat/Yanbu teyitsiz. Geçersizleşme: (a) Aramco teyitli Doğu-Batı akışı + Yanbu restart + Brent <90; (b) RSP/SPY iki hafta üst üste; (c) Ekim 25 bp + 10Y %5,30 kalıcı.

## 🌡️ Termometre

**2/18 DÜŞÜK** · izlemede: getiri eğrisi (+0,27), enflasyon (CPI %3,4). VIX 15,44 normal; S&P zirveden ~−%2,3; Fed Ekim +25 bp ~%40 bandında.

## 📌 Koşullu sinyaller

1. Eğer Aramco resmi bültenle hat/yükleme restart eder ve Brent 90 altına yerleşirse → enerji kısıtı düşer, yön “yatay-yukarı dar”a döner. Geçersizleşme: yalnızca STS/teklif kalırsa.
2. Eğer Ekim FedWatch +25 bp %50’yi kalıcı geçerse → ikinci adım fiyatı sıkılaşır; eğri ve büyüme betası baskı görür. Geçersizleşme: hold %60+ ve Warsh dili yumuşar.
3. Eğer 24 Eylül SpaceX ~328 mn kilit öncesi emilim zayıflarsa → arz baskısı ikinci bacak açabilir. Geçersizleşme: kilit teslim + emilim.
4. Eğer hyperscaler veya lab capex/eğitim revizyonu yayımlanırsa → tempo metni kılavuza döner; donanım çarpanı kazanç şokuna kayar. Geçersizleşme: kılavuz korunursa.
