<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rapor — Ağ Haritası</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Fragment+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/rapor.css" />
</head>
<body>
  <nav class="rapor-ust"><a href="../../index.html">← Ağ Haritası</a></nav>
  <article id="rapor"><p>Yükleniyor…</p></article>
  <script src="../../assets/vendor/marked.min.js"></script>
  <script>
    (function () {
      var hedef = document.getElementById("rapor");
      var parcalar = ["kuantum-1.md", "kuantum-1b.md", "kuantum-2.md", "kuantum-2b.md"];
      function bas(md) {
        if (typeof marked === "undefined") {
          hedef.textContent = "Görüntüleyici yüklenemedi.";
          return;
        }
        hedef.innerHTML = marked.parse(md, { gfm: true, breaks: false });
        var h1 = hedef.querySelector("h1");
        if (h1) document.title = h1.textContent + " — Ağ Haritası";
        hedef.querySelectorAll("a[href^='http']").forEach(function (a) {
          a.target = "_blank";
          a.rel = "noopener";
        });
      }
      Promise.all(parcalar.map(function (f) {
        return fetch(f).then(function (r) {
          if (!r.ok) throw new Error(f + " " + r.status);
          return r.text();
        });
      })).then(function (parts) {
        bas(parts.join("\n"));
      }).catch(function (e) {
        hedef.textContent = "Rapor yüklenemedi. " + e;
      });
    })();
  </script>
</body>
</html>
