# Modül Raporu — İleri Paketleme: TCB Bond'lama ve Eş-Paketlenmiş Optik (CPO) Ekipman Zinciri

*Economic Intelligence OS — Modül analizi | 13 Ağustos 2026 | #çippaketleme*

*Bu modül, AI çip üretiminin yeni darboğazı hâline gelen ileri paketleme katmanını — termokompresyon bond'lama (TCB), hibrit bond'lama ve eş-paketlenmiş optik (CPO) ekipman/bileşen zincirini — halka açık şirket evreniyle inceler ve ağ haritasına işler. Analitik haritadır; yatırım tavsiyesi değildir.*

---

## 1) Tez: Darboğaz Litografiden Paketlemeye Kaydı

AI hızlandırıcılarında sınırlayıcı artık transistör basmak değil, basılmış çipleri **birbirine ve belleğe bağlamak**. Nvidia/AMD rack-ölçekli sistemleri, her nesilde daha büyük interposer'lar (CoWoS), daha yüksek HBM katları ve daha sıkı yerleştirme toleransları istiyor. TSMC bu yüzden ileri paketleme kapasitesini olağan fabrika döngüsünün dışında bir hızla büyütüyor: **CoWoS hedefi 2026 sonunda ayda ~130 bin wafer** — 2024 sonunun yaklaşık **dört katı**. Tahsisin **~%60'ı Nvidia'da**; Broadcom ~%15 (Google/Meta özel ASIC'leri), AMD ~%11. Chiayi'deki **AP7**, "dünyanın en büyük ileri paketleme kampüsü" olarak faz faz devreye giriyor; Tainan'daki AP8 yeni eklendi. Kapasite dört katına çıkarken bile talep karşılanamıyor — darboğazın kendisi, bu modülün izlediği ekipman şirketlerinin sipariş defterine dönüşüyor.

İkinci katman bellek tarafında: **HBM4 rampası** (SK Hynix seri üretimde, Micron 2026'da agresif pay hedefliyor) yerleştirme hassasiyetini **1 mikronun altına** indirdi. Bu eşik, TCB ekipman pazarını yeniden dağıtan teknik kırılma noktası — aşağıda. Üçüncü katman ağ tarafında: bakırın menzil sınırı, optiği anahtarın **paketinin içine** itiyor (CPO). IDTechEx, CPO pazarının 2036'ya dek **%37 yıllık bileşik büyümeyle ~20 milyar $'a** ulaşmasını bekliyor; Nvidia **Quantum-X Photonics** (InfiniBand CPO) anahtarlarını 2026 başında, **Spectrum-X Photonics**'i (Ethernet) 2026'nın ikinci yarısında takvime koydu. Her iki mimari de TSMC'nin **COUPE** fotonik motoru + **SoIC-X** 3B paketlemesiyle üretiliyor — yani CPO, paketleme darboğazının *içinde* doğan bir alt-darboğaz.

## 2) TCB Rekabet Haritası: Dört Halka Açık Oyuncu, Bir Kırılma Eşiği

**Besi (BE Semiconductor, BESI — Euronext Amsterdam):** Q2 2026 geliri **249,9 milyon € (+%68,7 yıllık)**; sipariş girişi **292,9 milyon € ile çeyreklik rekor (+%128,8)**; book-to-bill dört çeyrektir 1'in üzerinde. Sistem siparişlerinin **~%60'ı AI kaynaklı** (2025 H1: ~%50). **Hibrit bond'lama müşteri sayısı 2025 sonundaki 15'ten 21'e** çıktı — kullanım alanları logic, bellek, CPO ve tüketiciye yayılıyor. Kritik pazar dinamiği: **Micron, HBM4 TCB'sinde jeopolitik ve hassasiyet gerekçeleriyle Besi'ye konsolide oluyor** (Hanmi ve Shinkawa'nın yerine) *(tek analist kaynağı; teyit gerektirir)*. Uyarı işareti fiyatlamadan: kusursuz sonuca rağmen hisse sonuç günü **−%7** — optikteki "mükemmellik fiyatlandı" rejiminin ekipman kanadındaki karşılığı.

**ASMPT (0522.HK — merkez Singapur):** H1 2026 geliri **1,14 milyar $ (+%42,5)**; sipariş **1,63 milyar $ (+%85,1)**. İleri paketleme segmenti **rekor 339 milyon $ (grup gelirinin %30'u)**. Temmuz 2026'da **50+ adetlik chip-to-substrate TCB toplu siparişi**; lider bir logic üreticisinden (adı açıklanmadı) tekrar chip-to-wafer TCB siparişleri. **SK Hynix, Aralık 2025'te HBM4 TC bonder tedarikini ASMPT'ye açtı** — Kore'li tedarikçilerden çeşitlendirmenin ana kazananı. Ayrıca fotonik kanadı: takılabilir (pluggable) transceiver ekipman geliri yıllık **~3 katına** çıktı; büyük oyuncularla **CPO işbirlikleri** sürüyor. Q3 kılavuzu 630-690 milyon $ (orta noktada +%46,3 yıllık).

**Kulicke & Soffa (KLIC — NASDAQ):** FQ3 2026 geliri **330,4 milyon $ (+%123 yıllık, +%36,2 çeyreklik)**; **fluxless TCB** içeren Advanced Solutions segmenti önceki çeyreğin rekorunu **+%20** aştı. FY2027 TCB gelir hedefi **150-200 milyon $**. Kullanım oranları uçlarda: Çin'de >%95, bellek ve genel yarıiletkende ~%90; müşteri siparişleri **FQ2 2027'ye kadar** uzanıyor — ekipman döngüsünde alışılmadık görünürlük.

**Hanmi Semiconductor (042700.KS):** SK Hynix'ten **ilk HBM4 TC bonder siparişi 44,2 milyar won (~31 milyon $)** Haziran 2026'da geldi (TC Bonder 4.5 "Griffin"). Bugünkü (13 Ağustos) DigiTimes başlığına göre **HBM4 siparişleri toparlanırken Hanmi, Hanwha'nın önüne geçiyor** *(içerik erişilemedi; başlık düzeyinde; teyit gerektirir)*. Ama yapısal yön aleyhte: analistler SK Hynix'in Kore'li tedarikçileri (Hanmi + Hanwha Semitech) kademeli seyrelterek Hanmi'nin payının **%20-30'a inebileceğini** değerlendiriyor. Hanmi-Hanwha **patent davası** sürüyor — Kore TCB ekosistemini içeriden yıpratan ikinci cephe.

**Kırılma eşiği:** HBM4'ün **sub-1µm yerleştirme hassasiyeti**, fluxless/gelişmiş platformlara sahip Besi-ASMPT-K&S üçlüsünü öne çıkarırken önceki nesil için optimize Kore'li üreticileri savunmaya itiyor. **Samsung ayrı bir evren:** iştiraki SEMES'in ekipmanıyla içeride kalıyor ve HBM5'teki **hibrit bond'lama geçişine** kadar bu düzeni korumayı planlıyor — yani bugünkü TCB pazar payı savaşının tamamı SK Hynix + Micron sipariş defterinde oynanıyor.

## 3) Hibrit Bond'lama: TCB'nin Ardılı, Besi'nin Kalesi

TCB, lehim bump'larıyla ~mikron sınıfı bağlantı kurar; hibrit bond'lama bump'ı tamamen kaldırıp bakır-bakıra moleküler temas sağlar — HBM5 ve sonrası bellek yığınlarının, ayrıca TSMC SoIC benzeri 3B logic yığınlarının varsayılan yolu. Besi'nin 21 müşterili kurulu tabanı ve Applied Materials'la uzun süredir yürüyen ortak geliştirme hattı burada giriş bariyeri oluşturuyor; ASMPT ve K&S kendi platformlarıyla takipte. Yatırımcı açısından kritik soru zamanlama: **bugün sipariş edilen TCB filosunun ekonomik ömrü, bellek üreticilerinin hibrit geçiş takvimine bağlı** — geçiş öne çekilirse TCB yatırımı kısalır, sarkarsa Besi'nin hibrit önceliği geç fiyatlanır. Bu belirsizlik, Besi hissesinin rekor siparişe −%7 tepkisinin yapısal katmanı.

## 4) CPO Zinciri: Foundry Katmanından Lazere

- **Foundry/paket katmanı:** TSMC **COUPE + SoIC-X**, hem Nvidia hem Broadcom CPO ürünlerinin ortak üretim zemini — CPO hacmi büyüdükçe TSMC'nin paketleme tahsis tablosuna yeni bir talep sınıfı ekleniyor.
- **Sistem katmanında iki strateji:** Nvidia **platform-entegre** (Quantum-X/Spectrum-X Photonics — ağ+hızlandırıcı+yazılım tek mimari); Broadcom **modüler** (Tomahawk Ultra/6, Jericho 4 — hyperscaler kendi sistemine gömüyor). İki modelin pay dağılımı, ekipman zincirinin kimden sipariş alacağını belirleyecek.
- **Bileşen/lazer katmanı:** Harici lazer kaynakları ve fotonik montaj, optik transceiver modülündeki oyuncularla kesişiyor — **Coherent ve Lumentum** CPO lazer kanalının ana halka açık adresleri; Corning fiber/bağlantı tarafında. CPO, pluggable transceiver pazarını kısmen yamyamlaştırırken aynı şirketlere yeni gelir katmanı açıyor (optik modülüyle çapraz okuma).
- **Montaj/test katmanı:** ASMPT'nin CPO işbirlikleri ve Besi'nin hibrit bond'lama-CPO kullanım alanı, fotonik motorların paket içine alınmasının klasik OSAT hattından değil, bu modülün ekipman üçlüsünden geçeceğini gösteriyor.

## 5) Harita Okuması: Kim Kazanır, Kim Baskı Altında

**Pozitif:** Besi, ASMPT, K&S (sipariş defterleri + fiyatlama gücü), TSMC (kapasite kıtlığının sahibi), Nvidia (tahsisin %60'ı + CPO platformu), Broadcom (%15 tahsis + modüler CPO), SK Hynix (HBM4 rampası ekipmanla hızlanıyor), Coherent/Lumentum (CPO lazer kanalı).

**Baskı altında:** Hanwha Semitech (pay kaybı + patent cephesi), Shinkawa/Yamaha Robotics (Micron'un konsolidasyonunda dışarıda kalma riski; halka açık ana şirket Yamaha Motor üzerinden dolaylı), önceki nesil bond'lama kurulu tabanına bağlı OSAT'lar.

**Çift yönlü:** Hanmi (kısa vadede sipariş toparlanması, yapısal olarak pay riski), Samsung (SEMES içeride tutuyor — ekipman pazarına kapalı ama hibrit geçişte dışarı açılmak zorunda kalabilir), bellek üreticileri (ekipman enflasyonu capex'i şişiriyor; bellek-kıtlığı temasıyla kesişim).

## 6) Riskler ve İzleme Noktaları

1. **Döngü riski:** Ekipman siparişi kesiklidir; Besi/ASMPT/K&S'de book-to-bill'in 1'in altına dönmesi, AI capex yavaşlamasının en erken uyarı sinyallerinden biri olur — Risk Engine'e doğrudan girdi.
2. **Hibrit geçiş zamanlaması:** HBM5'te hibrit bond'lamaya geçiş takvimi (Samsung'un kararı dahil) bugünkü TCB yatırım döngüsünün ömrünü belirliyor.
3. **Kore iç cephesi:** Hanmi-Hanwha patent davası + SK Hynix'in çeşitlendirmesi; Kore ekipman payı eridikçe "devlet kapasitesi yarışı" (10 trilyon won paketi) bu katmana da uzanabilir.
4. **Tek müşteri yoğunlaşması:** TCB satışlarının büyük kısmı 3-4 alıcıya (SK Hynix, Micron, TSMC/OSAT, Intel) gidiyor; tek sipariş kayması çeyreklik sonuçları savuruyor.
5. **CPO adaptasyon hızı:** Pluggable ekosisteminin direnci (maliyet, servis edilebilirlik) CPO rampasını yavaşlatabilir; Spectrum-X Photonics'in H2 2026 lansmanı ilk gerçek hacim testi.
6. **Çin değişkeni:** K&S'nin Çin'deki >%95 kullanım oranı hem talebin hem de olası ihracat kontrolü genişlemesinin (ileri paketleme ekipmanı henüz kapsamda değil) göstergesi — ihracat-kontrolleri temasıyla kesişim.

## 7) İzleme Listesi (günlük koşulara girdi)

- Besi/ASMPT/K&S sipariş-book-to-bill açıklamaları; **Applied Materials bilançosu (bu akşam, 13 Ağu)** — paketleme/hibrit bond'lama yorumları.
- Hanmi-SK Hynix/Micron sipariş akışı; Hanmi-Hanwha dava takvimi; DigiTimes başlığının teyidi.
- TSMC aylık ciro + CoWoS/SoIC kapasite revizyonları (130 bin wafer/ay hedefi).
- Nvidia Spectrum-X Photonics H2 2026 lansmanı; Broadcom Tomahawk CPO hacim sinyalleri; COUPE üretim güncellemeleri.
- HBM4 sertifikasyon/rampa haberleri (SK Hynix, Micron, Samsung) — bellek-kıtlığı temasıyla çapraz.
