## 1) Dönem Özeti ve Teyit Karnesi

Pencere 20 takvim günü. Girdi: 12 Eylül köprü + 14 / 15 / 16 / 17 Eylül günlükleri ve deltaları. Endeks 28 Ağu kapanışına (önceki dönemselin zemini, S&P ~7.731) göre **aşağı ve dar**: 16 Eyl nakit S&P **7.551,81** — zirve 13 Ağu **7.816,70**'ten **−%3,4**; Nasdaq **25.978,42**; Dow **51.461,90 (−%1,21** FOMC seansı). Termometre dönemi DÜŞÜK bantta geçirdi (3/18 → 2/18); yeni alarm yok. Ama sükûnet yanıltıcı: yönü günlük sis değil **üç teslimat** belirledi.

**(a) Politika teslimatı.** 28 Ağu Warsh Jackson Hole ("işimiz var") + 4 Eyl istihdam +162 bin / işsizlik %4,1 + 11 Eyl CPI %3,4, artırım fiyatlamasını ~%35–40'tan ~%85–87'ye, sonra %92–94'e taşıdı. **16 Eyl FOMC 12–0, bant 3,75–4,00** — Temmuz 2023'ten beri ilk artırımı. SEP medyan 2026 yılsonu **%3,8 → %4,1**; 18 katılımcıdan 12 bir artırımı daha, 4 iki artırımı görüyor. Warsh: enflasyon "çok yüksek ve çok uzun", finansal koşullar "kısıtlayıcı değil", adım "bir doz konaklamayı geri almak." Ekim FedWatch +25 bp **%40,1** / hold %59,5 — Eylül kartı kapandı, ikinci adım bölünmüş.

**(b) Enerji teslimatı.** 28 Ağu Brent **88,10 $** idi. 11 Eyl **104,61 $**; Doğu-Batı (Abqaiq–Yanbu) hattı Irak çıkışlı İHA sonrası ihtiyati kapandı; Yanbu stoğu 5–7 gün, sonra denizcilik kaynakları yüklemeyi durdurdu ve Avrupa kargoları iptal edildi. Brent Salı Mayıs zirvesine döndü (~108 $ bandı), Çarşamba Umman/Sohar STS teklifiyle **105,83 $**'a geriledi. Hürmüz AIS tek haneli (salı 4 gemi). Jazan 400 bin v/g restart **hâlâ teyitsiz**. 28 Ağu "ihracat 2/3 toparlandı / Brent 87 $" okuması bu pencerede çöktü.

**(c) Darlık teslimatı.** Oracle 10 Eyl: gelir 19,3 mlr $ (+%30), IaaS +%121, RPO **664 mlr $**, çeyrekte +30 mlr $ AI sözleşme, **20 mlr $ ATM** — Cuma Dell ~+%12. Aynı rejim PANW'yi beat'e rağmen cezalandırdı. 14 Eyl SOX **−%5,86** (Nvidia −%3,4, Micron −%5+); yazılım ETF'i aynı seansta artıda. Tempo çağrısı (Amodei 12 Eyl + Altman/Musk/Hassabis) capex kılavuzu üretmedi; nakit çarpan kesti. RSP/SPY genişlik dönüşü oluşmadı.

**Teyit karnesi (dönem içi "teyit gerektirir" + devir kayıtlarının akıbeti):**

- ✅ **Doğrulananlar:** Eylül 25 bp (köprüdeki baz senaryo → 16 Eyl 12–0 teslim). Altman 2026 IPO ertelemesi (14 Eyl NPR tek kaynak → 15 Eyl Fortune/Verge/Forbes/Politico çok kaynak; şerh kapandı). Kanada 8 Eyl 27,6 mlr $ karşı-tarife yürürlükte (resmî liste). Lutnick "burada üret, ödeme" mimarisi kabine ağzı (Yonhap / 2 Eyl). Oracle RPO 664 mlr $ ve 20 mlr $ ATM (IR). Enflame STAR 912 mn $ + ilk gün ~+%179 (Reuters). SpaceX 9 Eyl 319 mn kilit, seans −%4+ (prospektüs takvimi). Warsh "işimiz var" (Reuters/Politico, köprü).
- ❌ **Çürüyenler / revize edilenler:** **28 Ağu Hürmüz/koridor soğuma okuması** (Brent 93→87, "ihracat 2/3") → hat kapandı, yükleme durdu, Brent 100 $ üstüne yerleşti. **"Hazine put'u yeter"** (9 Eyl 6 mlr $ geri alım) → 10Y açıklama günü yükseldi; uzun uç operasyonla inmedi. **Eylül hold senaryosu** (Goldman hold'daydı) → 13 Eyl 25 bp'ye döndü, komite teslim etti. **Jazan 30 Ağu restart** takvimi pencerede doğrulanmadı — çürüme değil, açık kaldı; "tesis açıldı" iddiası yok.
- ⏳ **Açık kalanlar:** Jazan 400 bin v/g Aramco bülteni. Yanbu yükleme durması + Doğu-Batı yarı kapasite hedefi (Bloomberg, teyit gerektirir) + Umman STS (Reuters, tanıdık kişiler). Hürmüz tek haneli AIS / Pazar Keşm mermi + 1 ölü ayrıntısı. PANW–Console tutarı ~500 mn $ (tek kaynak). Feinberg/Palantir 244 mn $ no-bid — sözleşme yok. SK Hynix–Intel ABD bellek görüşmesi (bağ yok; Hynix "plan kesinleşmedi"). Workday 51–54 mlr $, Hugging Face ~13 mlr $, Lambda turu, Anthropic ARR, Nvidia-Rebellions, YMTC Q1. TCMB 11 Eyl rezerv 183,8 mlr $ basın hesabı — resmî Perşembe bülteni. BIS kredi/GSYH açığı: Eylül çeyreklik *Quarterly Review* (14 Eyl, "yields climb, risk appetite holds") yayımlandı; ABD açık rakamı bu koşuda birincil BIS tablosundan okunamadı — 1 Ekim'e devir. Vietnam bayrağı app.js'de yok.

## 4) Yön Analizi — Haritanın Söyledikleri

**Tema düzeyi:** Önceki dönemin taşıyıcısı olan **dolaşımsal finansman** bu pencerede *yeni yapı üretmedi* — Oracle 20 mlr $ ATM mevcut capex programının özkaynak ayağı; yeni backstop/SPV/warrant yok. Yerine iki tema öne çıktı. Birincisi **politika-faiz**: Warsh standardı → CPI → 25 bp teslim → SEP %4,1. İkincisi **iran-enerji-riski**: koridor anlatısı operasyonel kesintiye döndü (hat, yükleme, kargo iptali). Üçüncü, kısa ömürlü **ai-güvenlik** (tempo çağrısı): Federal Register olmadı, capex kesilmedi, 14 Eyl tek seanslık çarpan oldu. Sönen tema: "Eylül hold / petrol geçici." Lutnick'le **tarife-hukuku** mimari oldu ama metin hâlâ yok — tema haritada notr duruyor, fiyatı 14 Eyl SOX'ta dolaylı yendi.

**Sektör düzeyi:** Net negatife kayan: **enerji-üretim/ihracat operasyonu** (Aramco beş kayıt negatif; Brent +~%20 dönem başı–zirve, sonra STS ile kısmi geri). **AI donanım betası** tek seansta cezalandı (SOX −%5,9), iki seansta teknik toparlandı — kılavuz değişmedi, rejim değişmedi. Net pozitife kayan dar set: **AI altyapı bilançosu** (Oracle birincil, Dell türevi) ve **yazılım/siber kanıt** (IGV artı / SOX eksi makası 14 Eyl). İki yüzlü: **bellek** (SKH görüşme notr, Micron nakit negatif) ve **uzay-halka açık** (SPCX kilit takvimi fiyatın üstünde).

**Makro düzeyi:** Termometre 3 → 2, DÜŞÜK. Fed kartı teslimatla izlemeden çıktı. Kalan izleme: eğri (+0,47 → +0,27, kısa uç sıkıştı) ve enflasyon (CPI %3,4 / PCE %3,7). VIX 15,8–17,7; HY OAS 265–276 bp; NFCI −0,564; Sahm −0,07 — kredi ve oynaklık yine kayıtsız. 10Y %5 bandına girdi (%5,014 seans, %5,003 FOMC). Hazine 6 mlr $ geri alımı uzun ucu indirmedi: vade primi hâlâ enflasyon/arz. TCMB rezerv 188,2 → 184,2 → 183,8 (son basamak basın). USD/TRY ~48,13 → ~48,67, aylık <%5.

**Uyumsuzluk avı (harita ↔ fiyat):**

1. **Termometre yeşil ↔ politika şokunun fiyatı.** 25 bp + SEP sıkılaşması + Brent 100 $ üstü, VIX 18'i zorlamadan geçti. Harita "DÜŞÜK" der; endeks zirveden −%3,4 ile sessizce aşağı yürüdü. Sistemik değil, pozisyonel — sidecar yok. Bu, önceki dönemin "kayıtsız kredi kanalı"nın devamı; kırılırsa ilk yer HY OAS 300 / VIX 20 değil, 10Y %5,3–5,5 ve enerji primi olur.
2. **Oracle bilançosu ↔ Oracle fiyatı.** Birincil IR döneminin en güçlü AI talebi; hisse beş kırmızı + hâlâ 8 Eyl'den ~−%12. Harita pozitif/notr, fiyat "mükemmellik + dolaşım şüphesi" cezası. 28 Eki yatırımcı günü hakem.
3. **Tempo metni ↔ capex kılavuzu.** Amodei/Altman/Musk/Hassabis aynı hizada; eğitim duraklatma veya hyperscaler capex revizyonu yok. 14 Eyl SOX −%5,9 çarpan, 16–17 Eyl +%0,4 / +%0,6 geri. Harita "notr / kılavuz yok" demekte haklı; fiyat bir gün önden koştu.
4. **Hürmüz/Yanbu saha ↔ Çarşamba petrol düşüşü.** Hat kapalı, yükleme duruyor, AIS 4 gemi — ama STS manşeti Brent'i −%2,7 indirdi. Fiyat yine diplomatik/lojistik *vaade* inandı; saha teyidi yok. 28 Ağu'daki aynı makas (anlatı soğudu, debi soğumadı) bu dönem tekrarlandı.
5. **Genişlik ↔ endeks.** RSP/SPY iki hafta üst üste endeksi geçmedi — 28 Ağu (b) geçersizleşmesi oluşmadı. Kazanç Oracle/Dell Cuma'sı ve FOMC günü Nasdaq'ın neredeyse yatay kapanışı (−%0,01) ile dar kaldı; Dow −%1,21 aynı seansın genişlik itirafı.

## 5) #yuppiepoff Piyasanın Yönü

**Önceki dönem tespitinin karnesi (28 Ağu): İSABET — kısmî şerhle.** Tespit "yukarı-ama-daralarak; yönü iç dinamik değil politika kanalı belirler; kanıt gösteren ödül / göstermeyen ceza; bellek/Kore politika manşetine iki yönlü aşırı duyarlı" idi.

Gerçekleşme: darlık korundu (RSP/SPY dönüşü yok) ✓; yön politika kanalından geldi (Warsh → CPI → 25 bp) ✓; kanıt/ceza ayrışması çalıştı (Oracle IR ödülü + beş gün ceza, PANW beat cezası, SOX tek seans) ✓; çip tarifesi resmi paket + %50 sunucu kapsamı **olmadı** — (a) geçersizleşmesi tetiklenmedi ✓; (b) genişlik, (c) Aralık %70+ *ve* 30Y %5,5, (d) Hürmüz %50 + Brent <80 — hiçbiri tetiklenmedi. **Iska / eksik pay:** tespit enerjiyi "kırılganlık bacağı" olarak (d)'nin tersine bıraktı; Doğu-Batı kapanışı + Yanbu durması Brent'i 88 → 108 $ bandına taşıdı ve "sınırlı yukarı"yı **sınırlı aşağıya** çevirdi (−%3,4 zirveden). Politika kanalı isabet, seviye tahmini iyimser kaldı.

Karne: **isabet (mekanizma + darlık + politika), kısmî (enerji şokunun boyutu ve endeks seviyesi).**

**Yeni tespit: Sıkılaşan darlık — piyasanın yönü "yukarı-ama-daralarak" değil, "yatay-aşağı ve dar." Sermaye hâlâ arz-kısıtlı hesaplama + gelir kanıtı sunan yazılıma sıkışıyor; üzerine iki kısıt bindi: Warsh'ın konaklamayı geri alma dili (SEP %4,1, Ekim ikinci 25 bp %40) ve operasyonel enerji primi (hat kapalı, yükleme duruyor, Brent 100 $ üstü yerleşik). Önümüzdeki 15 günde yönü iç ralli değil takvim belirler: 22 Eyl Starship, 24 Eyl SPCX ~328 mn kilit, Ekim FOMC, 6 Eki Marvell. Beklenti: endekste yatay / sınırlı aşağı, sert iç rotasyon; genişlik dönmeden "yukarı" okunmaz.**

Gerekçe: (1) 25 bp fiyatlanmıştı, satış *dilden* geldi — ikinci adım ve "koşullar kısıtlayıcı değil" cümlesi eğriyi +0,27'ye sıkıştırdı. (2) Enerji saha teyidi olmadan prim kesildi; bu 28 Ağu makasının tekrarı, kırılgan. (3) Şirket puanları seyrek ve aşağı — dönem şirket momentumu değil makro-rejim dönemiydi; dar set (Oracle) taşıyıcı kaldı.

**Güven: Orta-yüksek** (önceki tespitinin mekanizması ikinci dönemde de çalıştı; seviye şerhi enerjiye bağlı).

**Geçersizleşme koşulları:** (a) **Doğu-Batı hattı Aramco teyidiyle akar, Yanbu yüklemesi restart olur ve Brent 90 $ altına yerleşirse** → enerji kısıtı düşer; yön tekrar "yatay-yukarı dar" okunur. (b) **RSP/SPY iki hafta üst üste endeksi belirgin geçerse** → darlık tezi olumlu yönde çöper. (c) **Ekim FOMC ikinci 25 bp teslim eder VE 10Y %5,30'u kalıcı geçerse** → faiz kanalı sınırlı aşağıyı sert aşağıya çevirir. (d) **OpenAI/Anthropic eğitim duraklatma veya hyperscaler capex revizyonu yayımlanırsa** → tempo metni kılavuza döner; donanım betası çarpan değil kazanç şoku yer.
