# Dönemsel Yön Tayini — 12–28 Ağustos 2026

*Economic Intelligence OS — 15 günlük geriye dönük tarama, şirket puanlaması ve piyasa yönü tespiti. Yöntem: claude/moduller/yon-tayini.md, v1 formülü. Not: Bu koşu kullanıcı talebiyle 1 Eylül'den öne çekilmiştir; pencere 12–28 Ağustos'taki 13 günlük raporu kapsar. 29–31 Ağustos, bir sonraki dönemsel koşunun (16 Eylül) penceresine devredilmiştir.*

---

## 1) Dönem Özeti ve Teyit Karnesi

Pencere 17 takvim günü ve 13 günlük raporu kapsıyor. Endeks düzeyinde dönem tam anlamıyla yatay geçti — S&P 500, 11 Ağustos kapanışı 7.728,20'den 27 Ağustos'ta 7.730,99'a geldi (net ~%0,0; zirve 13 Ağu 7.798,99, dip 20 Ağu 7.641,16 — %2'lik bant). Ama bu yataylık beş ayrı fırtınanın toplamıydı: **(a)** 12–14 Ağu: CPI/PPI'nin beklentiye uygun gelmesiyle artırım fiyatlamasının çözülmesi + ikinci kademe AI bilançolarının (Lumentum, CoreWeave, SMCI, Coherent, Nebius) talepte tek çatlak göstermemesi + SanDisk'in NBM'le bellek re-rating'ini ateşlemesi; **(b)** 17–19 Ağu: uzun uç şoku (30Y %5,33 — 2007'den beri zirve), WSJ'nin ~3 trilyon $'lık bilanço-dışı AI taahhüdü analizi ve iki haftalık bellek rallisinin tek seansta küresel tersinmesi (Kospi −%6,4, sidecar); **(c)** 19–20 Ağu: Hazine'nin geri alım müdahalesi ("Hazine put'u") + SK Hynix'in ₩40 trilyonluk geri alımıyla V-dönüş — ve put'un kredibilite testini bir günde kaybetmesi; **(d)** 21–25 Ağu: Walmart'ın tüketici çatlağını mühürlemesi, Kanada müzakerelerinin çöküp %50 tarifenin yürürlüğe girmesi ve İran'a "Operation Economic Outcast" — ekonomik-baskı rejiminin aynı hafta iki cepheye genişlemesi; **(e)** 25–28 Ağu: İran-Umman koridor diplomasisiyle petrolün soğuması, **Nvidia'nın tarihî bilançosu** (96,2 mlr $; ilk 100 mlr $'lık çeyrek kılavuzu; "arz kısıtlı" %70 FY28) ve agentic yazılım rallisi (CRM/CRWD/OKTA) — ama aynı 24 saatte Marvell'e kesilen "mükemmellik cezası" ve Politico'nun çip-tarifesi haberi. Dönemin gerçek hikâyesi yine endeks değil: **AI finansmanının satıcı-kredisi/bilanço-dışı faza geçmesi ve cezalandırma rejiminin seçicileşmesi** (bkz. Bölüm 4).

**Teyit karnesi (dönem içi "teyit gerektirir" kayıtlarının akıbeti):**

- ✅ **Doğrulananlar:** SpaceX'in 2,8 mlr $'lık türbin taahhüdü (WSJ → SEC dosyası, 18 Ağu); Nvidia-OpenAI backstop tutar çelişkisi (105-120 → **120 mlr $ / 5 GW**, 19 Ağu); Samsung hissedar getirisi söylentisi (100 trln ₩ → **90-110 trln ₩ kurul onayı**, 24 Ağu); Meta Hatch'in Claude tabanlı olduğu (tek kaynak → The Information, 26 Ağu); Microsoft'un ~2,2 mn çiplik filosu (Guardian → çok kaynaklı, 20 Ağu); Anthropic-Fractile (anlaşma → imzalı sözleşme, 26 Ağu); Vela Nova müdahalesi (CENTCOM teyidi, 13 Ağu); SpaceX kilit tarihi çelişkisi (→ 20 Ağu, 319 mn hisse); TCMB rezerv öncü verileri (→ resmî 183,5 ve 188,4 mlr $; basın hesabı 188,8 düzeltildi); İran-Umman koridoru ("görüşme" → gelir paylaşımı + geçici koridor anlaşması, 28 Ağu — ama Tahran'ın ABD-taahhüt şartıyla koşullu); S&P/Nasdaq kapanış çelişkileri (FRED hakemliği: 17 Ağu 7.745,06; 20 Ağu 7.641,16; 26 Ağu 7.675,70; Nasdaq bileşik 26.541,35); "Nvidia Groq 3 LPX" karışıklığı (ürün Groq'un; ilk müşteri Nebius).
- ❌ **Çürüyenler / revize edilenler:** **Kanada "son dakika anlaşması"** (19-20 Ağu, Trump: "muhtemelen anlaştık") → görüşmeler Cuma gecesi ÇÖKTÜ, %50 tarife 22 Ağu'da yürürlüğe girdi — dönemin en sert anlatı çöküşü. **"Hazine put'u işledi"** (20 Ağu) → ralli bir günde geri verildi; retorik müdahalenin yarı ömrü tek gün çıktı. **"Mükemmellik fiyatlandı rejimi çözüldü"** (13 Ağu) → 24 saat sonra Cisco/AMAT/Cerebras'la geri döndü; dönem sonunda "seçici rejim"e evrildi (Nvidia ödül / Marvell ceza). **Bessent'in "Ekonomik D-Day" ambalajı** → paket ölçülü çıktı (Çin bankalarına ikincil yaptırım yok); petrol haberle SATILDI. **21 Ağu raporundaki Perşembe S&P kapanışı** (7.681,27) → FRED 7.641,16 (kaynak hatası, 24 Ağu'da düzeltildi). **Nvidia'ya "AI-capex getiri şüphesi"** (19-25 Ağu satışının anlatısı) → bilançoyla çürüdü.
- ⏳ **Açık kalanlar:** Temasek'in Samsung/SK Hynix alım tutarı ve takvimi (dönem boyunca hiç açıklanmadı — rallinin en büyük doğrulanmamış çapası); Anthropic Q2 geliri 11,5 mlr $ ve ~65 mlr $ ARR (bağımsız dosya yok); SanDisk NBM ~94 mlr $ TCV (analist derlemesi; şirket dosyası yok); Nvidia 2 trln $ backlog (tek kaynak); OpenAI-Broadcom "Jalapeño" teknik künyesi (tek derleme); "AM Intelligence" kimliği (~9.000 Vera Rubin siparişi); Hürmüz debi veri savaşı (saha ~12 gemi/gün %9 vs Goldman "ihracat 2/3 toparlandı" vs Trump "10 mn varil"); çip tarifesi planı (Politico, "erken aşama"); SKH Miyagi fab; Nvidia-Rebellions; Hugging Face ~13 mlr $; Feinberg/Palantir penceresi (29 Ağu'da doldu — resmî sonuç yok); SpaceX fiyat serisi kaynak tutarsızlığı (kalıcı şerh); Micron/Okta 27 Ağu kesin kapanışları.

## 4) Yön Analizi — Haritanın Söyledikleri

**Tema düzeyi:** Dönemin açık ara en çok düğüm/sermaye çeken teması, pilotta doğuşunu kaydettiğimiz **hesaplama-finansmanı/dolaşımsal finansman** oldu — ve bu dönemde faz değiştirdi: MOU'lardan belgeli yapıya geçti. Envanter tek pencerede: Nvidia→OpenAI 120 mlr $ backstop (5 GW'a daraltılmış, netleşmiş), Broadcom'un 100 mlr $'a uzanan borç/SPV-kira paketi (satıcı kredisi), Marvell←Google 12,2 mlr $ warrant (hisse opsiyonlu tedarik — bağlayıcı alım YOK), Nvidia-Poolside 6+1 mlr $ (lisans+kadro), Anthropic'in 10 mlr $ kredi hattı + 15 mlr $/yıl Colossus kirası, SoftBank'ın 6,3 mlr $ perakende tahvili, Alibaba'nın 10,2 mlr $ plasmanı — dış çapa artık iki kaynaklı (BIS + WSJ ~3 trln $). İkinci büyüyen tema **hissedar-getirisi savunması** (SKH ₩40 trln + Samsung 90-110 trln ₩ — bellek döngüsünün yeni tampon mekanizması) ve üçüncüsü **ekonomik-baskı mimarisi** (Kanada %50 + 27,6 mlr $ misilleme; Operation Economic Outcast'in şartlı-tırmanma tasarımı; çip tarifesi "üçüncü cephe"). Sönen tema: **"AI-capex getiri şüphesi"** — üç hafta piyasayı bastırdıktan sonra Nvidia bilançosuyla geri çekildi; yerini daha dar bir soruya bıraktı: kıtlık rantı zincirde kime dağılıyor (Nvidia %75 marj vs Marvell −90 bp).

**Sektör düzeyi:** Net pozitife kayanlar: **agentic yazılım/siber güvenlik** (CRM, CRWD, OKTA, PANW, NOW — dönemin en sert iki günlük sektör rallisi ve "gelir kanıtı" ayrışmasının kazanan tarafı), **AI hesaplama/bulut** (Nvidia, Nebius, CoreWeave, SMCI), **veri merkezi güç zinciri** (Bloom, nVent-Maverick, türbin kıtlığı — GE Vernova/Siemens/MHI kapasite artışları), **kripto-finans** (Clarity Act rüzgârı; BTC +%23) ve **sert varlıklar** (altının 1999'dan beri en iyi ayı). Net negatife kayanlar: **isteğe bağlı tüketici/perakende** (WMT/HD/TGT/LOW deseni + tüketici güveni Ocak'tan beri dip), **"AI kurbanı" yazılım** (Intuit, Zoom), **Kanada-maruziyetli tedarik zincirleri** (oto/çelik/kereste — henüz dar fiyatlanıyor). İki yüzlüler: **bellek** (rekor kârlar, NBM sözleşmeleri, kıtlık — ama dönemde İKİ tersinme yaşadı: 19 Ağu faiz/3-trln şoku, 28 Ağu tarife haberi; taşıyıcı anlatı talepten sermaye-getirisine, oradan politika riskine kaydı) ve **optik** (talep kusursuz, tepki asimetrik: Lumentum yatay→+14, Fabrinet −%5,2, AOI −%11).

**Makro düzeyi:** Termometre tüm dönemi DÜŞÜK bantta geçirdi (3→2→1→2) — ama bu sükûnet üç kör noktanın üstünde duruyor. (1) **Vade primi kanalı:** 30Y %5,33 zirvesi ve "Hazine put'u" epizodu, eğri göstergesi yeşilken yaşandı; Hazine'nin kendini "piyasa yapıcı" ilan etmesi mali-baskınlık tartışmasını kurumsallaştırdı — ilk fiilî operasyon 9 Eylül'de, o güne dek uzun uç söze yaslanıyor. (2) **Stagflasyon makası:** tüketici tarafı üst üste kırıldı (perakende −%0,6, Michigan 51,0, güven 89,4, konut −%10,5, WMT comps) — ama manşet PCE %3,7'ye sıcak geldi, hanehalkı beklentisi %5,8'e çıktı ve pompa 4,10 $/galon; Philly Fed'in 5 yıl zirvesi makasın öbür çenesi. (3) **Fiyatlama kaynak makası:** Eylül artırım fiyatlaması dönem içinde %57'den ölüme, oradan ~%40'a savruldu; FedWatch aynası ile TE arasındaki fark karar eşiği kadar büyüdü (TE: Aralık'a kadar artırım >%70) — Warsh'ın 28 Ağu Jackson Hole konuşması (koşu sonrası) bu makasın hakemi olacak. Kredi ve oynaklık kanalları her şoka kayıtsız kaldı (VIX 14-16, HY OAS 267-275 bp): satışlar pozisyonel kaldı, sistemikleşmedi — sidecar günü bile.

**Uyumsuzluk avı (harita ↔ fiyat ayrışmaları):**

1. **Endeks ↔ genişlik:** S&P zirveye %1 mesafede kapanırken eşit-ağırlıklı endeks Nvidia gününde EKSİYDİ; üç sektör negatif. Kazanç, kanıt sunan az sayıda devde yoğunlaşıyor — endeks tek anlatıya (AI-capex zinciri) kaldıraçlı, genişlik tamponu yok. Bu, "yatay endeks + sert iç rotasyon" döneminin mekanik açıklaması ve önümüzdeki dönemin ana kırılganlığı.
2. **Hürmüz veri savaşı:** Brent koridor diplomasisini fiyatlayıp 93 → 87-88 $'a indi; ama bağımsız takip debiyi savaş öncesinin %9'unda (KRİTİK) gösteriyor, Goldman "ihracat 2/3 toparlandı" diyor, Trump "10 mn varil" — üç anlatı uzlaşmaz. Fiyat diplomatik anlatıya inanmış durumda; tek fiilî olay (koridorun çökmesi, yeni tanker vuruşu) iki günlük fiyatlamayı bir seansta geri alır. 12 aylık konsensüsün 111 $'da çakılı kalması, piyasanın kendi fiyatına güvenmediğinin itirafı.
3. **Politika şokları ↔ kredi/oynaklık:** %50 Kanada tarifesi + karşı-liste + İran izolasyon paketi + çip tarifesi tartışması — ve VIX/HY OAS/TSX/CAD neredeyse kımıldamadı. Piyasa ekonomik-baskı rejimini "kuyruk riski" olarak ucuza taşıyor; 8 Eylül misillemesi ve 1 Ocak katmanı yürürlüğe girdikçe bu fiyatlama test edilecek.
4. **Özel piyasa ↔ halka açık piyasa:** Halka açıkta beat+raise bile cezalandırılırken (Cisco, AMAT, Cerebras, Fabrinet, Marvell) özel piyasada General Intuition 8 haftada 3x, Decart 6→7 mlr $, Anthropic ~1 trln $ IPO fısıltısı, Temmuz'da 40 unicorn. Köprü ayrımı "dolaşımın içi/dışı": içindekiler borçlanma kapasitesi buluyor (Anthropic, OpenAI, Lambda), dışındakiler down round yiyor (Groq −%49, Unitree −%45). Bu makas ya halka arzlarla (Anthropic, Vantage, YMTC/Enflame) test edilecek ya da özel taraf da ayıklanacak.
5. **Bellek: sözleşme anlatısı ↔ fiyat davranışı:** NBM (~94 mlr $ TCV) + ₩150 trilyonluk kombine getiri planları + "arz kısıtlı %70" yapısal talep teyidi — buna karşın kompleks iki kez (faiz, tarife) günler içinde %6-10 boşaldı ve Samsung'un resmî planına tepki "habere sat" oldu. Harita "döngü sözleşmeyle kırılıyor" diyor, fiyat "hâlâ momentum varlığıyım" diyor; ikisinin hakemi FY2027 NBM hacimlerinin bağımsız teyidi ve Eylül'deki Kore-ABD yatırım paketi olacak.

## 5) #yuppiepoff Piyasanın Yönü

**Önceki dönem tespitinin karnesi (11 Ağu pilotu): İSABET — kısmî şerhle.** Tespit "yön yukarı ama taşıyıcı değişti; endekslerde sınırlı yukarı/yatay seyir; asıl hareket katmanlar arasında — sermaye capex'i gelire çevirenlerde ve bilanço dışına taşıyabilenlerde toplanır; beklentisi şişmiş kulvarlarda (bellek/optik fiyatlaması, SaaS) düzeltmeler sürer" demişti. Gerçekleşme: S&P dönemi tam yatay kapattı (7.728 → 7.731; ±%2 bant) ✓; "faturayı kim ödüyor" sorusu dönemin ana ekseni oldu — backstop, satıcı kredisi, warrant, SPV-kira ✓; capex'i gelire çevirenler ödüllendirildi (Nvidia +%8,7, Nebius, CRM/CRWD/OKTA) ✓; şişkin kulvarlarda düzeltmeler geldi (bellek tersinmesi 19 Ağu, optikte Fabrinet/AOI, SaaS'ta Intuit/Zoom) ✓. Geçersizleşme koşullarının hiçbiri tetiklenmedi (CPI çekirdek %0,2; talep verisi kusursuz; MOU'lar somutlaştı). **Iska payı:** pilot, dönemin iki büyük şok kanalını öngörmemişti — uzun uç/vade primi şoku ("Hazine put'u" epizodu) ve ekonomik-baskı rejiminin genişlemesi (Kanada %50, Outcast, çip tarifesi). İkisi de tespiti çürütmedi ama "sınırlı yukarı" bandını iki kez stres etti. Karne: **isabet (yön + mekanizma), kısmî (risk haritası eksikti).**

**Yeni tespit: Ralli daralıyor — piyasanın yönü artık "yukarı" değil, "yukarı-ama-daralarak": sermaye, arz-kısıtlı Nvidia zinciri ile agentic-gelir kanıtı sunan yazılıma sıkışıyor; genişliği olmayan bu yükseliş, önümüzdeki 15 günde yönünü kendi iç dinamiğinden değil politika kanalından (çip tarifesi dosyası, Warsh sonrası Aralık-artırım fiyatlaması, 8 Eylül Kanada misillemesi, 9 Eylül'de başlayan Hazine operasyonları + SpaceX tranşı) alacak. Beklenti: endekslerde yatay/sınırlı yukarı ama sert iç rotasyonlu bir dönem; "kanıt gösteren ödül / göstermeyen ceza" ayrışması sektör rotasyonu olarak derinleşir; bellek/Kore bacağında politika manşetlerine iki yönlü aşırı duyarlılık sürer.**

Gerekçe üç gözleme dayanıyor: (1) Dönemin her büyük fiyat hareketi (bellek tersinmesi, V-dönüş, Nvidia günü, Marvell cezası) bir kanıt/anlatı olayına bağlıydı — makro veri değil; talep verisi ise istisnasız güçlü geldi: sorun talepte değil, kimin kanıt gösterebildiğinde. (2) Genişlik yok: eşit-ağırlık endeks zirve gününde eksi, kazanç Nvidia + kanıtlı yazılımda — bu yapı yükselişi sürdürebilir ama şok emicisi yoktur; tek kötü manşet (tarife metni, şahin Warsh) genişlik tamponu olmadan endekse iner. (3) Politika takvimi olağanüstü yüklü ve fiyatlanmamış: kredi/oynaklık kanalları %50'lik tarifeye bile kayıtsız kaldı — bu kayıtsızlık ya haklı çıkar (şoklar sulanır) ya da gecikmiş bir yeniden fiyatlamanın rezervuarıdır.

**Güven: Orta-yüksek** (iki dönemlik örneklem; mekanizma tezi güçlü, zamanlama tezi politika takvimine bağımlı).

**Geçersizleşme koşulları:** (a) **Çip tarifesi resmî pakete dönüşür ve veri merkezi sunucularını yüksek oranla (%50+) kapsarsa** → "yukarı-ama-daralarak" çöper; AI-altyapı maliyet şoku yönü aşağı çevirir. (b) **Eşit-ağırlıklı S&P (RSP/SPY), iki hafta üst üste endeksi belirgin geçerse** → genişlik dönmüş demektir; "daralan ralli" tezi (olumlu yönde) geçersizleşir, yön daha sağlam yukarı okunur. (c) **Aralık-artırım fiyatlaması FedWatch dahil tüm kaynaklarda %70+ kalıcılaşır VE 30Y %5,5'i kırarsa** → faiz kanalı anlatıyı ezer; "endeks yatay/sınırlı yukarı" bandı aşağı kırılır. (d) **Hürmüz koridoru fiilen işler (debi savaş öncesinin %50'sine döner) ve Brent 80 $ altına yerleşirse** → enflasyon/politika baskısı çözülür; tespitin "kırılganlık" bacağı zayıflar, yön yukarı güçlenir.
