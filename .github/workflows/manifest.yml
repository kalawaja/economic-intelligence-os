name: manifest

on:
  pull_request:
  push:

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Manifest yalnız eklenir
        run: |
          set -eu
          # PR ve main dışındaki push'lar yayınlanmış listeye (PR tabanı / main)
          # bakılır. main'e push, bir önceki main commit'ine bakılır.
          # Böylece main'de hiç olmayan bir id bu dalda silinebilir; main'deki
          # bir id'yi düşürmek yine reddedilir.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            taban="origin/${{ github.base_ref }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            taban="${{ github.event.before }}"
          else
            git fetch origin main
            taban="origin/main"
          fi
          case "$taban" in
            ""|0000000000000000000000000000000000000000)
              node arac/manifest-kontrol.js
              ;;
            *)
              node arac/manifest-kontrol.js --taban "$taban"
              ;;
          esac
